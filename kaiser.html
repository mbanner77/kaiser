<style>
  :root{
    --bg:#0e1117; --panel:#161c26; --panel2:#1d2532; --border:#2a3446;
    --txt:#dbe2ee; --muted:#8b96a8; --gold:#e0b458; --gold2:#c79a3d;
    --green:#4cc38a; --red:#e5636f; --cyan:#5fb8d4; --orange:#d9973f;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -100px,#1a2233 0%,transparent 60%),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.006) 0 2px, transparent 2px 6px),
      radial-gradient(1400px 700px at 50% 115%, #131a28 0%, transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;overflow-x:hidden;
  }
  header{
    position:sticky;top:0;z-index:10;

    padding:12px 20px;background:rgba(14,17,23,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent 0%,rgba(224,180,88,.55) 50%,transparent 100%);}
  .brand{font-weight:800;font-size:20px;letter-spacing:2px;color:var(--gold);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;}
  /* --- Systemmenü --- */
  details.menu{position:relative;}
  details.menu summary{
    list-style:none;cursor:pointer;font-size:14.5px;font-weight:600;
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:6px 12px;user-select:none;
  }
  details.menu summary::-webkit-details-marker{display:none;}
  details.menu[open] summary{border-color:var(--gold);}
  .menu-inhalt{
    position:absolute;right:0;top:calc(100% + 6px);z-index:60;
    background:var(--panel2);border:1px solid var(--border);border-radius:12px;
    padding:8px;min-width:200px;box-shadow:0 14px 40px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:2px;
  }
  .menu-inhalt button{margin:0;text-align:left;border:none;background:transparent;border-radius:8px;}
  .menu-inhalt button:hover{background:var(--panel);border:none;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:13px;color:var(--muted);
  }
  .chip b{color:var(--txt);font-weight:600;}
  .chip.warn{border-color:var(--red);color:var(--red);}
  .spacer{flex:1;}
  main{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
  #screen{animation:fadein .28s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  /* Karten schweben nacheinander ein */
  #screen .card{animation:cardIn .4s cubic-bezier(.2,.9,.3,1) both;}
  #screen .card:nth-of-type(2){animation-delay:.05s;}
  #screen .card:nth-of-type(3){animation-delay:.1s;}
  #screen .card:nth-of-type(4){animation-delay:.15s;}
  #screen .grid .card:nth-child(1){animation-delay:.04s;}
  #screen .grid .card:nth-child(2){animation-delay:.1s;}
  #screen .grid .card:nth-child(3){animation-delay:.16s;}
  #screen .grid .card:nth-child(4){animation-delay:.22s;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    #screen, #screen .card, .up, .down, .stat .ico, .schild::after{animation:none !important;}
  }
  h1{font-size:30px;font-weight:800;margin-bottom:6px;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.5px;}
  h2{font-size:21px;font-weight:700;margin-bottom:14px;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.3px;
    position:relative;padding-bottom:9px;}
  h2::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:150px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold) 0%,rgba(224,180,88,.35) 60%,transparent 100%);}
  h3{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
  p{line-height:1.6;}
  .muted{color:var(--muted);} .gold{color:var(--gold);} .green{color:var(--green);}
  .red{color:var(--red);} .cyan{color:var(--cyan);}
  .small{font-size:13px;} .center{text-align:center;}
  .card{
    background:linear-gradient(180deg,var(--panel2) 0%,var(--panel) 100%);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;
    transition:border-color .2s, transform .15s, box-shadow .2s;
  }
  .card:hover{border-color:#3a4759;transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.28);}
  .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 6px 18px rgba(0,0,0,.18);}
  #screen .card:nth-of-type(2){animation-delay:.05s;}
  #screen .card:nth-of-type(3){animation-delay:.10s;}
  #screen .card:nth-of-type(4){animation-delay:.15s;}
  #screen .grid .card:nth-child(2){animation-delay:.07s;}
  #screen .grid .card:nth-child(3){animation-delay:.13s;}
  ::selection{background:rgba(224,180,88,.35);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2a3446;border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}
  #titelbild{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--border);}
  .wetter-ico{font-size:30px;display:inline-block;vertical-align:middle;margin-right:8px;
    animation:wippen 3s ease-in-out infinite;}
  @keyframes wippen{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-4px) rotate(3deg);}}
  .grid{display:grid;gap:14px;}
  .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;
    transition:border-color .2s, transform .15s;
  }
  .stat:hover{border-color:#3a4759;transform:translateY(-1px);}
  .stat .ico{font-size:20px;display:inline-block;animation:statSchweben 3.6s ease-in-out infinite;}
  .stat:nth-child(2) .ico{animation-delay:.5s;} .stat:nth-child(3) .ico{animation-delay:1s;}
  .stat:nth-child(4) .ico{animation-delay:1.5s;} .stat:nth-child(5) .ico{animation-delay:2s;}
  @keyframes statSchweben{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}
  .stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:4px 0 2px;}
  .stat .val{font-size:19px;font-weight:700;}
  .bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px;}
  .bar>div{height:100%;border-radius:99px;background:var(--gold);transition:width .5s;}
  .stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .step{
    font-size:12px;letter-spacing:.5px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--border);color:var(--muted);background:var(--panel);
  }
  .step.act{background:var(--gold);border-color:var(--gold);color:#1a1509;font-weight:700;}
  .step.done{color:var(--green);border-color:var(--green);}
  button{
    font-family:inherit;font-size:14.5px;font-weight:600;
    background:var(--panel2);color:var(--txt);
    border:1px solid var(--border);border-radius:10px;
    padding:10px 18px;cursor:pointer;margin:4px 8px 4px 0;
    transition:transform .06s, background .15s, border-color .15s, filter .15s;
  }
  button:hover:not(:disabled){border-color:var(--gold);box-shadow:0 3px 14px rgba(224,180,88,.14);}
  button:active:not(:disabled){transform:scale(.965);}
  button{transition:border-color .18s ease, box-shadow .18s ease, transform .1s ease, background .18s ease;}
  .btn-primary{position:relative;overflow:hidden;}
  .btn-primary::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);
    transform:skewX(-18deg);transition:left .05s;pointer-events:none;opacity:0;}
  .btn-primary:hover::after{animation:btnGlanz .8s ease;opacity:1;}
  @keyframes btnGlanz{from{left:-80%;}to{left:130%;}}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;}
  .moral div{transition:width .55s cubic-bezier(.3,.9,.4,1);}
  .strbar div{transition:width .55s cubic-bezier(.3,.9,.4,1);}
  table tr:hover td{background:rgba(255,255,255,.03);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a3546;border-radius:99px;border:2px solid #0d1117;}
  ::-webkit-scrollbar-thumb:hover{background:#3a4a60;}
  .pergament{animation:pergamentAuf .5s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes pergamentAuf{from{opacity:0;transform:translateY(12px) scale(.96,.9);}to{opacity:1;transform:none;}}
  .delta-pos{animation:deltaGruen 1.1s ease both;}
  .delta-neg{animation:deltaRot 1.1s ease both;}
  @keyframes deltaGruen{0%{background:rgba(94,190,120,.28);}100%{background:transparent;}}
  @keyframes deltaRot{0%{background:rgba(219,90,90,.24);}100%{background:transparent;}}
  .battlelog p:first-child{animation:logNeu .4s ease both;}
  @keyframes logNeu{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:none;}}
  .stat{transition:border-color .2s ease, box-shadow .2s ease;}
  .stat:hover{border-color:rgba(224,180,88,.55);box-shadow:0 4px 16px rgba(0,0,0,.3);}
  .setuprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    padding:8px 0;border-bottom:1px solid var(--border);}
  .setuprow:last-child{border-bottom:none;}
  .setuprow .mini-schild{flex:0 0 auto;}
  .setuprow .s-wap{flex:0 0 62px;min-width:62px;}
  .setuprow .s-farbe{flex:0 1 118px;min-width:98px;}
  .setuprow .s-name{flex:1 1 130px;min-width:110px;}
  .setuprow .s-anrede{flex:0 1 80px;min-width:72px;}
  .setuprow .s-ki{flex:0 1 108px;min-width:96px;}
  .setuprow select, .setuprow input{margin:0;}
  @media (max-width:820px){
    .setuprow{gap:5px;}
    .setuprow .s-name{flex:1 1 100%;order:5;}
  }
  @keyframes unruhePuls{0%,100%{box-shadow:0 0 0 rgba(229,99,111,0);}50%{box-shadow:0 0 18px rgba(229,99,111,.45);}}
  @keyframes moralPuls{0%,100%{filter:brightness(1);}50%{filter:brightness(1.6);}}
  .titelmenu{display:grid;gap:9px;max-width:380px;margin:0 auto;}
  .titelmenu button{width:100%;margin:0;text-align:center;}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;}
  }
  button:active:not(:disabled){transform:scale(.97);}
  button:disabled{opacity:.35;cursor:default;}
  .btn-primary{background:linear-gradient(180deg,#ecc878 0%,var(--gold) 34%,var(--gold2) 100%);color:#1a1509;border-color:#a97f35;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 3px 10px rgba(0,0,0,.35);
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    position:relative;overflow:hidden;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--gold);
    box-shadow:0 0 18px rgba(224,180,88,.32);}
  .btn-primary::after{content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.34),transparent);
    transform:skewX(-18deg);transition:left .45s ease;}
  .btn-primary:hover:not(:disabled)::after{left:130%;}
  .btn-danger{background:transparent;color:var(--red);border-color:var(--red);}
  .btn-danger:hover:not(:disabled){
    background:linear-gradient(180deg,#e5636f 0%,#b23845 100%);color:#fff;border-color:#8a2f3f;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 3px 12px rgba(219,90,90,.35);}
  .btn-lg{font-size:16px;padding:13px 26px;border-radius:12px;}
  .btn-sm{font-size:12.5px;padding:6px 10px;margin:2px 4px 2px 0;}
  input[type=text],input[type=number],select{
    font-family:inherit;font-size:15px;
    background:var(--bg);color:var(--txt);
    border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;width:150px;
  }
  input[type=text]{width:210px;}
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  input[type=range]{
    width:100%;appearance:none;-webkit-appearance:none;background:transparent;
    height:30px;cursor:pointer;accent-color:var(--gold);
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:7px;border-radius:99px;
    background:linear-gradient(180deg,#232c3b,#2a3446);
    border:1px solid #202a3a;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:21px;height:21px;border-radius:50%;margin-top:-8px;
    background:radial-gradient(circle at 35% 30%,#f4d98d 0%,var(--gold) 45%,var(--gold2) 100%);
    border:1px solid #a97f35;
    box-shadow:0 2px 7px rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.5);
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12);}
  input[type=range]::-moz-range-track{
    height:7px;border-radius:99px;background:#2a3446;border:1px solid #202a3a;
  }
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f4d98d 0%,var(--gold) 45%,var(--gold2) 100%);
    border:1px solid #a97f35;box-shadow:0 2px 7px rgba(0,0,0,.55);
  }
  input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;vertical-align:-3px;}
  input[type=number]::-webkit-inner-spin-button{opacity:.5;}
  table{width:100%;border-collapse:collapse;}
  td,th{padding:7px 6px;text-align:left;font-size:14.5px;}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;}
  tr+tr td{border-top:1px solid var(--border);}
  tbody tr:hover td, table tr:hover td{background:rgba(224,180,88,.035);}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;}
  #map{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;}
  .tile{
    width:26px;height:26px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:rgba(0,0,0,.65);
  }
  .t-frei{background:#2e4638;} .t-acker{background:#6f8f3f;}
  .t-markt{background:var(--orange);} .t-muehle{background:var(--cyan);}
  .t-palast{background:#e8e6df;} .t-dom{background:var(--gold);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .legend .tile{width:16px;height:16px;border-radius:4px;display:inline-flex;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .delta-pos{color:var(--green);font-weight:600;}
  .delta-neg{color:var(--red);font-weight:600;}
  .hero{padding:56px 20px;text-align:center;}
  .hero .crown{font-size:64px;display:block;margin-bottom:14px;}
  .hero h1{font-size:44px;letter-spacing:6px;color:var(--gold);}
  .event{
    border-left:3px solid var(--border);padding:8px 12px;margin:8px 0;
    background:var(--panel);border-radius:0 10px 10px 0;font-size:14.5px;
  }
  .event.bad{border-color:var(--red);} .event.good{border-color:var(--green);}
  .rowflex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .sliderrow{display:grid;grid-template-columns:170px 1fr 64px;gap:12px;align-items:center;margin:12px 0;}
  .sliderrow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .goal{background:rgba(224,180,88,.08);border:1px solid rgba(224,180,88,.35);}
  footer{margin-top:26px;text-align:center;font-size:12px;color:var(--muted);}
  /* --- Schlacht --- */
  .battlefield{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:start;}
  .armee{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .armee h4{font-size:15px;margin-bottom:8px;}
  .armee .u{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums;}
  .vs{font-size:26px;text-align:center;padding-top:40px;color:var(--gold);}
  .strbar{height:12px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0 4px;}
  .strbar>div{height:100%;transition:width .5s;}
  .strbar.a>div{background:var(--cyan);} .strbar.d>div{background:var(--orange);}
  .battlelog{max-height:180px;overflow-y:auto;font-size:13.5px;}
  .battlelog p{padding:2px 0;border-bottom:1px dashed var(--border);}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .floatdmg{position:absolute;font-weight:800;color:var(--red);animation:floatup 1s ease-out forwards;pointer-events:none;}
  @keyframes floatup{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-40px);}}
  /* --- Konfetti --- */
  .confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:99;animation:cfall linear forwards;pointer-events:none;border-radius:2px;}
  @keyframes cfall{to{transform:translateY(105vh) rotate(720deg);opacity:.6;}}
  /* --- Monumente --- */
  .monu{display:flex;gap:20px;align-items:flex-end;justify-content:center;padding:6px 0 2px;}
  .monu svg{display:block;}

  #karte, #karteS{width:100%;height:auto;display:block;border-radius:12px;
    border:1px solid var(--border);margin:4px 0 10px;}
  .schild{display:inline-flex;align-items:center;justify-content:center;
    width:70px;height:80px;font-size:34px;border:3px solid var(--gold);
    border-radius:10px 10px 46% 46%/10px 10px 55% 55%;
    background:linear-gradient(180deg,var(--panel2),#0c1016);
    box-shadow:0 6px 22px rgba(0,0,0,.45);
    position:relative;overflow:hidden;}
  .schild::after{content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,transparent 38%,rgba(255,245,215,.14) 48%,rgba(255,245,215,.24) 50%,rgba(255,245,215,.14) 52%,transparent 62%);
    background-size:250% 100%;animation:schildGlanz 5.5s ease-in-out infinite;}
  @keyframes schildGlanz{0%,55%{background-position:160% 0;}80%,100%{background-position:-70% 0;}}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:baseline;}

    background:linear-gradient(175deg,#241f16 0%,#1c1812 55%,#211c13 100%);
    border:1px solid rgba(224,180,88,.4);border-radius:var(--radius);
    padding:22px 24px;position:relative;
    box-shadow:inset 0 0 44px rgba(224,180,88,.05), 0 10px 30px rgba(0,0,0,.35);
  }

    content:"";position:absolute;width:16px;height:16px;pointer-events:none;
    border:2px solid rgba(224,180,88,.55);
  }
  .pergament::before{top:6px;left:6px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}

  .pergament h2::after{left:50%;transform:translateX(-50%);}
  .ereignis-ico{font-size:44px;display:inline-block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
    animation:ereignisPochen 2.4s ease-in-out infinite;}
  @keyframes ereignisPochen{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.09) rotate(2deg);}}
  .zierlinie{height:1px;max-width:320px;margin:6px auto;
    background:linear-gradient(90deg,transparent,rgba(224,180,88,.6),transparent);position:relative;}
  .zierlinie::after{content:"❦";position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    color:rgba(224,180,88,.75);font-size:12px;background:transparent;padding:0 8px;}
  .wahl-knopf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:7px 0;
    border-color:rgba(224,180,88,.35);}

  .wahl-nr{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:inline-flex;
    align-items:center;justify-content:center;font-size:13px;font-weight:800;
    background:rgba(224,180,88,.16);border:1px solid rgba(224,180,88,.5);color:var(--gold);}
  .res-chip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;
    border:1px solid var(--border);background:rgba(13,17,23,.5);font-variant-numeric:tabular-nums;}
  /* Feierliches Leuchten hinter den großen Porträts */
  #portraitB, #portraitK{animation:portraitGlanz 3.2s ease-in-out infinite;}
  @keyframes portraitGlanz{
    0%,100%{box-shadow:0 12px 44px rgba(0,0,0,.5), 0 0 34px rgba(224,180,88,.22);}
    50%{box-shadow:0 12px 44px rgba(0,0,0,.5), 0 0 64px rgba(224,180,88,.45);}
  }
  .setup-tabelle{table-layout:fixed;width:100%;}
  .setup-tabelle td{padding:4px 3px;overflow:hidden;}
  .setup-tabelle td:first-child{width:26px;}
  .setup-tabelle input[type=text]{width:100%;min-width:70px;padding:8px 8px;}
  .setup-tabelle select{width:100%;padding:8px 4px;}
  .blink{animation:blinkA 1.6s ease-in-out infinite;}

  /* --- Schlachtfeld-Canvas --- */
  #feld{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--border);
    background:linear-gradient(180deg,#1c2637 0%,#2a3a2a 45%,#22301f 100%);margin-bottom:12px;}
  .phasebadge{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--panel2);

  .moral{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px;}

  .taktik{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0;}
  .taktik .opt{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;

  .taktik .opt b{display:block;margin-bottom:4px;}
  .taktik .opt span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;}

  .spark{display:block;width:100%;height:58px;margin-top:6px;}
  .up{color:var(--green);font-size:12px;font-weight:700;} .down{color:var(--red);font-size:12px;font-weight:700;}
  .up,.down{display:inline-block;animation:badgePop .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.35s;}
  @keyframes badgePop{from{opacity:0;transform:scale(.4) translateY(4px);}to{opacity:1;transform:none;}}

  .pulse{animation:pulse 2.6s ease-in-out infinite;display:inline-block;}

  .shine{background:linear-gradient(90deg,var(--gold) 20%,#fff3cf 50%,var(--gold) 80%);

  @keyframes shine{to{background-position:-200% center;}}

  #toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;}

  /* --- Zeremonien & Jahres-Vignette --- */

  .krone-fall{

    60%{opacity:1;transform:translateX(-50%) translateY(6px) rotate(4deg);}
    to{opacity:1;transform:translateX(-50%) translateY(0) rotate(0);}
  }
  #wipe{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;

  @media (max-width:640px){

</style>

<body>
<header>
  <span class="brand">👑 KAISER</span>

  <span class="chip" id="hSpieler" style="display:none"></span>

          oninput="lautSetzen('musik', this.value)" id="lautMusik">
        <p class="muted small" style="margin-top:6px">🔔 Effekte</p>
        <input type="range" min="0" max="1" step="0.05" style="width:100%"
          oninput="lautSetzen('fx', this.value)" id="lautFx">

  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importSpielstand(this)">

<main>
<noscript>
  <div style="max-width:560px;margin:40px auto;padding:24px;border:1px solid #e0b458;border-radius:14px;
    background:linear-gradient(175deg,#241f16,#1c1812);text-align:center">
    <p style="font-size:40px;margin-bottom:10px">👑</p>
    <p style="font-size:18px;font-weight:700;color:#e0b458;margin-bottom:10px">Diese Vorschau kann Kaiser nicht ausführen</p>

    (z.&nbsp;B. der Dateien-App auf dem iPhone). Das Spiel selbst braucht einen richtigen Browser.</p>
    <p style="line-height:1.6;margin-top:12px"><b>So spielt Ihr auf dem Handy:</b><br>
    Öffnet Eure Online-Adresse (Render) in <b>Safari</b> und wählt dort
    „Teilen → Zum Home-Bildschirm". Kaiser installiert sich dann als App
    und läuft sogar offline.</p>
    <p style="line-height:1.6;margin-top:12px;color:#8b96a8;font-size:14px">Alternative: die Datei mit einer
    Browser-App öffnen (nicht mit der Dateivorschau), oder am Rechner per Doppelklick im Browser starten.</p>

<div id="wipe"></div>
<script>
"use strict";
/* ============================================================
   KAISER. Hommage an den C64-Klassiker von 1984
   Eigenständige Neu-Implementierung · Hotseat · 1-9 Spieler
   ============================================================ */

const TITEL = [
  ["Herr","Dame"],["Baron","Baronin"],["Landgraf","Landgräfin"],["Markgraf","Markgräfin"],
  ["Fürst","Fürstin"],["Herzog","Herzogin"],["Kurfürst","Kurfürstin"],["König","Königin"],["Kaiser","Kaiserin"]
];
const NAMEN = ["Friedrich","Anna","Wilhelm","Luise","Karl","Sophie","Otto","Marie","Georg"];
const KINDER_M = ["Friedrich","Wilhelm","Karl","Heinrich","Ludwig","Konrad","Albrecht","Leopold"];
const KINDER_W = ["Anna","Luise","Sophie","Adelheid","Mathilde","Klara","Editha","Theresia"];
const ERZIEHUNG = [
  { zug:"kriegerisch",  ico:"🛡️", n:"Beim Marschall",     d:"Der Erbe lernt das Kriegshandwerk (Zug: Kriegerisch)." },
  { zug:"haendlerisch", ico:"⚖️", n:"Im Kontor",          d:"Der Erbe lernt rechnen und feilschen (Zug: Händlerisch)." },
  { zug:"gelehrt",      ico:"📚", n:"Bei den Gelehrten",  d:"Der Erbe studiert Schrift und Staatskunst (Zug: Gelehrt)." }
];
function erziehen(zug){
  const p = cur();
  if(!p.erbe || p.erbe.zug) return;
  p.erbe.zug = zug;
  const e = ERZIEHUNG.find(x=>x.zug===zug);
  toast(`${e.ico} ${p.erbe.name} wird fortan ${e.n.toLowerCase()} erzogen.`);
  render();
}
const FARBEN = ["#5fb8d4","#e0b458","#4cc38a","#e5636f","#b58fd4","#d9973f","#7fd4c1","#e08ab8","#a8c46a"];
const WAPPEN = ["🦅","🦁","🐺","🌹","⚔️","⭐","🐉","🛡️","🌙"];
/* Bonus-Wappen, freigeschaltet über gesammelte Erfolge */
const BONUS_WAPPEN = [
  { ab:4,  w:"👑" }, { ab:8,  w:"🦄" }, { ab:12, w:"🔥" }, { ab:16, w:"⚜️" }
];
const wappenFrei = () => WAPPEN.concat(BONUS_WAPPEN.filter(b=>erfolge().size >= b.ab).map(b=>b.w));
const KOSTEN = { markt:1000, muehle:2000, hafen:3000, palastTeil:5000, domTeil:9000, inf:100, kav:250, art:500,
  forst:800, bruch:1200, mauer:4000, burg:9000 };
/* Baustoff-Bedarf der Bauwerke (Holz / Stein) */
const MATERIAL = {
  markt:{holz:20,stein:0}, muehle:{holz:30,stein:10}, hafen:{holz:40,stein:20},
  palastTeil:{holz:15,stein:30}, domTeil:{holz:10,stein:45},
  forst:{holz:0,stein:0}, bruch:{holz:10,stein:0},
  mauer:{holz:20,stein:80}, burg:{holz:40,stein:140}
};
const FORST_MAX = 4, BRUCH_MAX = 3, MAUER_MAX = 3, BURG_MAX = 2;
function hatMaterial(p, was){
  const m = MATERIAL[was] || {holz:0,stein:0};
  return (p.holz||0) >= m.holz && (p.stein||0) >= m.stein;
}
function zahleMaterial(p, was){
  const m = MATERIAL[was] || {holz:0,stein:0};
  p.holz = (p.holz||0) - m.holz;
  p.stein = (p.stein||0) - m.stein;
}
function matText(was){
  const m = MATERIAL[was] || {holz:0,stein:0};
  const teile = [];
  if(m.holz) teile.push(m.holz + " 🪵");
  if(m.stein) teile.push(m.stein + " 🪨");
  return teile.length ? ", " + teile.join(" + ") : "";
}
const LAND   = { palast:13000, dom:25000 };
const PALAST_TEILE = 16, DOM_TEILE = 14;
const JUSTIZ = ["","sehr fair","fair","streng","gierig"];
const PHASEN = ["Status","Korn","Handel","Zw.-Bilanz","Steuern","Bauen","Bilanz"];
const WETTER = [
  { t:"Dürre, die Felder verdorren",        ico:"☀️", f:0.55, w:8  },
  { t:"Verregneter Sommer",                  ico:"🌧️", f:0.78, w:12 },
  { t:"Wechselhaftes Jahr",                  ico:"⛅",  f:0.95, w:34 },
  { t:"Gutes Erntewetter",                   ico:"🌤️", f:1.10, w:30 },
  { t:"Goldener Sommer",                     ico:"🌻", f:1.25, w:12 },
  { t:"Ein Prachtjahr, wie es selten kommt", ico:"🌟", f:1.45, w:4  }
];

const G = { spieler:[], aktiv:0, jahr:1700, tempo:1, screen:"title", sieger:null, _kr:null, _s:null };

/* ---------- Helfer ---------- */
const $  = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("de-DE");
const ri  = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const rf  = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const cur = () => G.spieler[G.aktiv];
const titelName = p => TITEL[p.titel][p.w?1:0];
const anrede = p => (p.w?"Ihre":"Seine") + " " + (p.titel>=7?"Majestät":p.titel>=4?"Hoheit":"Exzellenz");

function neuerSpieler(name,w,idx,ki){
  return {
    name, w, ki:!!ki,
    farbe:FARBEN[idx%FARBEN.length], wappen:WAPPEN[idx%WAPPEN.length],
    gebaeude:[], chronik:[], startAlter:ri(22,30),
    bez:{}, pakte:{}, kiTyp:null, gen:1, haefen:0, zug:wuerfleZug(),
    berater:{}, spionage:{}, ehen:{},
    holz:120, stein:60, forst:0, bruch:0, mauer:0, burg:0,
    holzPreis:ri(8,16), steinPreis:ri(14,26),
    stat:{ steuern:0, kornErloes:0, siege:0, niederlagen:0, bauten:0 },
    geld:15000, land:10000, korn:400, pop:2500,
    maerkte:0, muehlen:0, palast:0, dom:0,
    heer:{inf:0,kav:0,art:0},
    zoll:10, einkSt:20, mwSt:15, justiz:2,
    titel:0, stimmung:60,
    kornPreis:ri(70,120), landPreis:ri(16,70),
    kornHist:[], snap:null, delta:null,
    todesJahr: (G.tempo>=2.5 ? ri(1721,1726) : G.tempo>1 ? ri(1739,1746) : ri(1760,1768)) + Math.random(),
    tot:false,
    ausgabe:0, kriegGefuehrt:false,
    turnStart:0, report:null, zb:null
  };
}

const bauplaetze = p => Math.floor(p.land/1000);
const minLand = p => Math.max((p.maerkte+p.muehlen)*1000, p.palast>0?LAND.palast:0, p.dom>0?LAND.dom:0);
const freiLand  = p => Math.max(0, p.land - minLand(p));
const staedte   = p => Math.min(Math.floor(p.maerkte/5), Math.floor(p.muehlen/3));
/* Jahreszeiten wirken aufs Spiel: Bedarf, Preise, Ernte, Feldzüge */
const SAISON_FX = {
  "Frühling": { korn:0.85, txt:"Saatzeit: Korn ist am Markt rund 15 % günstiger." },
  "Sommer":   { ernte:1.05, txt:"Hochsommer: die Ernte fällt 5 % reicher aus." },
  "Herbst":   { schwank:1.7, txt:"Erntemarkt: die Kornpreise schwanken heftig." },
  "Winter":   { bedarf:1.15, txt:"Winter: das Volk braucht 15 % mehr Korn, Feldzüge zahlen Frost-Tribut." }
};
const saisonFx = () => SAISON_FX[saison().n] || {};
const noetigKorn = p => Math.ceil(p.pop/10 * (saisonFx().bedarf || 1));
function saisonKornPreis(){
  const fx = saisonFx();
  const sw = fx.schwank || 1;
  return clamp(Math.round((G.kornMarkt||100) * rf(1 - 0.07*sw, 1 + 0.07*sw) * (fx.korn || 1)), 20, 430);
}
const miliz     = p => p.maerkte*50;
/* Bebauung konkurriert mit Anbaufläche (Original-Zielkonflikt) */
const bebautFarm = p => (p.maerkte+p.muehlen)*250
  + Math.ceil(p.palast*1000/PALAST_TEILE) + Math.ceil(p.dom*1500/DOM_TEILE);
const anbau = p => Math.max(0, p.land - bebautFarm(p));
const heerStaerke = h => h.inf + h.kav*2.5 + h.art*4;
const alterJahre = p => (p.startAlter||26) + (G.jahr - 1700);
const GEWAND = ["#6e5f45","#5d7a4f","#4f6d7a","#7a4f5d","#6a4f7a","#3f5d8a","#7a3f8a","#8a2f3f","#a8842f"];
/* Beziehungen (-100 bis 100) und Nichtangriffspakte */
function bezWert(a, b){ return clamp((a.bez && a.bez[G.spieler.indexOf(b)]) || 0, -100, 100); }
function bezAendern(a, b, delta){
  const ia = G.spieler.indexOf(a), ib = G.spieler.indexOf(b);
  a.bez = a.bez || {}; b.bez = b.bez || {};
  a.bez[ib] = clamp((a.bez[ib]||0) + delta, -100, 100);
  b.bez[ia] = clamp((b.bez[ia]||0) + delta, -100, 100);
}
function buendnisAktiv(a, b){
  const ib = G.spieler.indexOf(b);
  return a.buendnisse && a.buendnisse[ib] && a.buendnisse[ib] >= G.jahr;
}
function buendnisSchliessen(a, b){
  const ia = G.spieler.indexOf(a), ib = G.spieler.indexOf(b);
  a.buendnisse = a.buendnisse || {}; b.buendnisse = b.buendnisse || {};
  a.buendnisse[ib] = G.jahr + 8; b.buendnisse[ia] = G.jahr + 8;
  bezAendern(a, b, 15);
  geschichte("🛡️", `${a.name} und ${b.name} schmieden ein Bündnis mit Beistandspflicht (8 Jahre).`);
}
function buendnisBrechen(a, b, grund){
  const ia = G.spieler.indexOf(a), ib = G.spieler.indexOf(b);
  if(a.buendnisse) delete a.buendnisse[ib];
  if(b.buendnisse) delete b.buendnisse[ia];
  bezAendern(a, b, -25);
  geschichte("🪓", `Das Bündnis zwischen ${a.name} und ${b.name} zerbricht${grund ? " · " + grund : ""}.`);
}
function paktAktiv(a, b){
  const ib = G.spieler.indexOf(b);
  return a.pakte && a.pakte[ib] && a.pakte[ib] >= G.jahr;
}
/* Handelsrouten: beide Seiten kassieren jährlich Zoll. Krieg kappt die Route */
function routeAktiv(i, j){
  return (G.routen||[]).some(r => (r.a===i && r.b===j) || (r.a===j && r.b===i));
}
function routenVon(i){
  return (G.routen||[]).filter(r => r.a===i || r.b===i);
}
function routeEroeffnen(i, j){
  G.routen = G.routen || [];
  if(routeAktiv(i,j)) return;
  G.routen.push({ a:i, b:j, seit:G.jahr });
  bezAendern(G.spieler[i], G.spieler[j], 10);
  geschichte("🚚", `${G.spieler[i].name} und ${G.spieler[j].name} eröffnen eine Handelsroute.`);
  erfolg("kaufmann");
}
function routeTrennen(i, j, grund){
  const vorher = (G.routen||[]).length;
  G.routen = (G.routen||[]).filter(r => !((r.a===i && r.b===j) || (r.a===j && r.b===i)));
  if(G.routen.length < vorher)
    geschichte("🪓", `Die Handelsroute zwischen ${G.spieler[i].name} und ${G.spieler[j].name} ist ${grund||"unterbrochen"}.`);
}
const routenZoll = p => {
  if(p._routenPause === G.jahr) return 0;                /* Raubritter: Karawanen bleiben aus */
  const i = G.spieler.indexOf(p);
  const basis = routenVon(i).length * (350 + staedte(p)*80 + ((p.haefen||0)>0 ? 150 : 0));
  return Math.round(basis * (G.handelsprivileg && G.handelsprivileg >= G.jahr ? 1.5 : 1));
};
/* Ehen zwischen Häusern: wirken wie ein langer Pakt und stiften Erbansprüche */
function eheAktiv(a, b){
  const ib = G.spieler.indexOf(b);
  return a.ehen && a.ehen[ib] && a.ehen[ib] >= G.jahr;
}
const eheSchwelle = ziel => ziel.kiTyp === "aggressor" ? 35 : 15;
/* Live-Aussicht für den Heiratsantrag im Diplomatie-Bildschirm */
function eheAussicht(){
  const el = document.getElementById("eheChance");
  if(!el) return;
  const p = cur();
  const ziel = G.spieler[+($("#dipZiel") ? $("#dipZiel").value : -1)];
  if(!ziel || ziel === p || ziel.tot){ el.textContent = ""; return; }
  const mitgift = Math.floor(+($("#dipMitgift") ? $("#dipMitgift").value : 0) || 0);
  if(eheAktiv(p, ziel)){ el.innerHTML = '<span class="muted">bereits vermählt</span>'; return; }
  if(!ziel.ki){ el.innerHTML = '<span class="muted">entscheidet selbst</span>'; return; }
  const wert = bezWert(ziel, p) + mitgift/200;
  const schwelle = eheSchwelle(ziel);
  el.innerHTML = wert >= schwelle + 8 ? '<span class="green">Aussicht: sehr gut</span>'
    : wert >= schwelle ? '<span class="green">Aussicht: gut</span>'
    : wert >= schwelle - 8 ? '<span class="gold">Aussicht: unsicher, mehr Mitgift hilft</span>'
    : '<span class="red">Aussicht: gering, erst Verhältnis pflegen</span>';
}
function eheSchliessen(von, an, mitgift){
  const iv = G.spieler.indexOf(von), ia = G.spieler.indexOf(an);
  von.geld -= mitgift; an.geld += mitgift;
  von.ehen = von.ehen || {}; an.ehen = an.ehen || {};
  von.ehen[ia] = G.jahr + 12; an.ehen[iv] = G.jahr + 12;
  von.pakte = von.pakte || {}; an.pakte = an.pakte || {};
  von.pakte[ia] = Math.max(von.pakte[ia]||0, G.jahr + 12);
  an.pakte[iv] = Math.max(an.pakte[iv]||0, G.jahr + 12);
  bezAendern(von, an, 25);
  geschichte("💍", `Die Häuser ${von.name} und ${an.name} vermählen ihre Kinder (Mitgift: ${fmt(mitgift)} T).`);
  erfolg("vermaehlt");
}

/* ---------- Botschaften an fremde Höfe: Worte, auf die Bots reagieren ---------- */
function botKriegserklaerung(ai, di){
  const p = G.spieler[ai], ziel = G.spieler[di];
  if(G.lehre || p.tot || ziel.tot) return false;
  if(G.reichsfrieden && G.reichsfrieden >= G.jahr) return false;
  if(paktAktiv(p, ziel) || eheAktiv(p, ziel) || buendnisAktiv(p, ziel)) return false;
  if(p.titel < 1 || heerStaerke(p.heer) + miliz(p)*0.8 < 150) return false;
  if((G._angriffe||[]).some(x=>x.kr.a===ai && x.kr.d===di)) return false;
  const kr = { a:ai, d:di, weg:wegZwischen(ai,di), fragen:[], wahl:{},
               aufA: kiAufstellung(p.heer), resA: p.kiTyp==="aggressor" ? 0 : 0.2,
               gelaende: wuerfleGelaende() };
  kr.fragen = lebende().map(x=>x.i).filter(i2=>i2!==ai && i2!==di);
  for(const i2 of kr.fragen){
    const s2 = G.spieler[i2];
    kr.wahl[i2] = buendnisAktiv(s2, ziel) ? "def" : s2.ki ? kiDiploWahl(s2, kr) : "frei";
  }
  if(kr.weg.some(i2=>!["atk","frei"].includes(kr.wahl[i2]))) return false;
  if(routeAktiv(ai, di)) routeTrennen(ai, di, "durch die Kriegserklärung zerbrochen");
  if(((ziel.mauer||0) + (ziel.burg||0)) > 0)
    belagerungAnwenden(kr, p.heer.art >= 2 ? "beschuss" : "sturm");
  p.kriegGefuehrt = true;
  G._angriffe = (G._angriffe||[]).concat({ kr });
  geschichte("⚔️", `${p.name} erklärt ${ziel.name} den Krieg, die Heere marschieren!`);
  return true;
}

function parleyLog(text, von){
  G._parley = G._parley || [];
  G._parley.push({ von, text });
  if(G._parley.length > 8) G._parley.shift();
}
function botschaftSenden(art){
  const p = cur();
  const zi = +($("#dipZiel") ? $("#dipZiel").value : -1);
  const ziel = G.spieler[zi];
  if(!ziel || ziel.tot) return;
  G._dipZielMerk = zi;
  let text = "";
  if(art === "frei"){
    text = ($("#botText") ? $("#botText").value : "").trim();
    if(!text){ alertMsg("Die Botschaft ist leer, der Bote reitet nicht ohne Worte."); return; }
  }
  /* Höchstens 3 Botschaften je Hof und Jahr */
  p._parleyN = p._parleyN && p._parleyN.jahr === G.jahr ? p._parleyN : { jahr:G.jahr, n:{} };
  if((p._parleyN.n[zi]||0) >= 3){
    alertMsg(`Der Hof von ${ziel.name} nimmt heuer keine weiteren Botschaften von Euch entgegen.`);
    return;
  }
  p._parleyN.n[zi] = (p._parleyN.n[zi]||0) + 1;
  const label = { gruss:"🕊️ Freundliche Worte", drohung:"😠 Drohung", tribut:"💰 Tributforderung", frei:"📜" };
  parleyLog(art==="frei" ? `„${text}“` : label[art], "ich");
  /* Menschlicher Empfänger: Botschaft wird zu Beginn seines Zuges überbracht */
  if(!ziel.ki){
    if(art === "gruss") bezAendern(p, ziel, 2);
    if(art === "drohung" || art === "tribut") bezAendern(p, ziel, -6);
    G.botschaften = (G.botschaften||[]).concat({
      von:G.aktiv, an:zi, jahr:G.jahr,
      text: art==="frei" ? text : label[art] });
    parleyLog(`Der Bote reitet. ${ziel.name} erhält Eure Botschaft zu Beginn ${ziel.w?"ihres":"seines"} Zuges.`, "hof");
    toast(`📜 Botschaft an ${ziel.name} übermittelt.`);
    mpSync(); render();
    return;
  }
  /* Bot: sofortige Reaktion nach Charakter und Kräfteverhältnis */
  let art2 = art;
  if(art === "frei"){
    const tl = text.toLowerCase();
    art2 = /krieg|angriff|vernicht|unterwerf|zerstör|marschier|brenn/.test(tl) ? "drohung"
         : /tribut|zahlt|zahlung|abgabe/.test(tl) ? "tribut"
         : /handel|korn|kauf|verkauf|ware|route/.test(tl) ? "handel"
         : /freund|friede|gruß|gruss|ehre|dank|bündnis|buendnis/.test(tl) ? "gruss" : "neutral";
  }
  const meinS = heerStaerke(p.heer) + miliz(p)*0.8;
  const botS  = heerStaerke(ziel.heer) + miliz(ziel)*0.8;
  const verh  = botS / Math.max(1, meinS);
  if(art2 === "gruss"){
    const schonJahr = ziel._gruss === G.jahr + "-" + G.aktiv;
    if(!schonJahr){ bezAendern(p, ziel, ri(2,4)); ziel._gruss = G.jahr + "-" + G.aktiv; }
    parleyLog(botAntwortText(ziel, bezWert(ziel,p) > 5 ? "freundlich" : "kuehl"), ziel.name);
    if(!schonJahr) toast(`🕊️ Das Verhältnis zu ${ziel.name} verbessert sich.`);
  } else if(art2 === "handel"){
    bezAendern(p, ziel, 1);
    parleyLog(botAntwortText(ziel, "handel"), ziel.name);
  } else if(art2 === "neutral"){
    parleyLog(botAntwortText(ziel, bezWert(ziel,p) > 15 ? "freundlich" : "kuehl"), ziel.name);
  } else if(art2 === "drohung" || art2 === "tribut"){
    bezAendern(p, ziel, art2==="tribut" ? -ri(10,16) : -ri(7,13));
    const angst = verh < (art2==="tribut" ? 0.6 : 0.7) && ziel.kiTyp !== "aggressor";
    if(angst && Math.random() < 0.65){
      const trib = Math.min(ziel.geld, Math.max(300, Math.round(ziel.geld * (art2==="tribut"?0.05:0.03))));
      ziel.geld -= trib; p.geld += trib;
      parleyLog(botAntwortText(ziel, "zahlt"), ziel.name);
      parleyLog(`💰 ${ziel.name} zahlt ${fmt(trib)} Taler Tribut.`, "hof");
      toast(`💰 ${ziel.name} beugt sich und zahlt ${fmt(trib)} Taler.`);
      geschichte("💰", `${ziel.name} zahlt ${p.name} ${fmt(trib)} Taler Tribut.`);
    } else {
      const wut = (ziel.kiTyp==="aggressor" ? 0.45 : 0.2) + (art2==="tribut" ? 0.15 : 0)
                + (bezWert(ziel,p) < -40 ? 0.15 : 0);
      if(verh > 1.05 && Math.random() < wut && botKriegserklaerung(zi, G.aktiv)){
        parleyLog(botAntwortText(ziel, "krieg"), ziel.name);
        parleyLog(`⚔️ ${ziel.name} erklärt Euch den Krieg! Zu Beginn Eures nächsten Zuges müsst Ihr Euch verteidigen.`, "hof");
        toast(`⚔️ ${ziel.name} erklärt Euch den Krieg!`, 8000);
        sTrommel();
      } else {
        parleyLog(botAntwortText(ziel, "trotzig"), ziel.name);
        toast(`😠 ${ziel.name} weist Eure Worte zurück, das Verhältnis leidet.`);
      }
    }
  }
  mpSync(); render();
}
/* Prüft die Kriegsvoraussetzungen und benennt, was fehlt */
function kannKrieg(p){
  const fehlt = [];
  if(p.titel < 1) fehlt.push("den Rang Baron");
  if(heerGroesse(p.heer) <= 0 && miliz(p) <= 0) fehlt.push("Truppen oder Miliz (Markt bauen oder Soldaten werben)");
  if(p.kriegGefuehrt) fehlt.push("ein neues Jahr (nur ein Feldzug pro Jahr)");
  if(G.reichsfrieden && G.reichsfrieden >= G.jahr) fehlt.push(`das Ende des Reichsfriedens (bis ${G.reichsfrieden})`);
  if(!G.spieler.some(s=>s!==p && !s.tot)) fehlt.push("einen lebenden Gegner");
  return { ok: fehlt.length===0, fehlt };
}
const heerGroesse = h => h.inf + h.kav + h.art;

const auftragArt = a => AUFTRAG_ARTEN.find(x=>x.id===a.id);
/* Wird am Jahresende geprüft: erfüllt, offen oder verfallen */
function auftragPruefen(p, r){
  const a = p.auftrag;
  if(!a) return;
  const art = auftragArt(a);
  if(!art){ p.auftrag = null; return; }
  if(art.ok(p, a)){
    p.geld += a.lohn;
    p.stimmung = clamp(p.stimmung + 4, 5, 100);
    r.auftragErfuellt = { n:art.n, ico:art.ico, lohn:a.lohn };
    geschichte(art.ico, `${p.name} erfüllt den Reichsauftrag „${art.n}" (${fmt(a.lohn)} T).`);
    p.auftrag = null;
  } else if(G.jahr >= a.frist){
    p.stimmung = clamp(p.stimmung - 4, 5, 100);
    r.auftragVerfallen = { n:art.n, ico:art.ico };
    p.auftrag = null;
  }
}

/* ---------- Sound-Design (Web Audio: Synthese, Rauschen, Hall) ---------- */
let _ac = null, muted = false, _master = null, _delay = null;
/* Getrennte Lautstärken für Musik und Effekte (persistent) */
let LAUT = { musik: 0.65, fx: 0.85 };
try{ LAUT = Object.assign(LAUT, JSON.parse(window.localStorage.getItem("kaiser_laut")||"{}")); }catch(e){}
function lautSetzen(art, wert){
  LAUT[art] = clamp(+wert, 0, 1);
  try{ window.localStorage.setItem("kaiser_laut", JSON.stringify(LAUT)); }catch(e){}
}
let _musikModus = false;
function toggleMute(){ muted = !muted; $("#btnMute").textContent = muted ? "🔇" : "🔊"; }
function audioCtx(){
  if(_ac) return _ac;
  _ac = new (window.AudioContext||window.webkitAudioContext)();
  _master = _ac.createGain(); _master.gain.value = 0.9;
  _master.connect(_ac.destination);
  /* leichter Echo-Hall für Fanfaren, Glocken und Kanonen */
  _delay = _ac.createDelay(0.7); _delay.delayTime.value = 0.22;
  const rueck = _ac.createGain(); rueck.gain.value = 0.28;
  const nass  = _ac.createGain(); nass.gain.value  = 0.16;
  _delay.connect(rueck); rueck.connect(_delay);
  _delay.connect(nass);  nass.connect(_master);
  return _ac;
}
function beep(freq, dur, delay=0, type="triangle", vol=0.12, hall=false){
  if(muted) return;
  try{
    const ac = audioCtx();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(_master); if(hall) g.connect(_delay);
    vol *= _musikModus ? LAUT.musik : LAUT.fx;
    if(vol <= 0.0005) return;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
function rausch(dur, delay=0, vol=0.2, tief=false, hall=false){
  if(muted) return;
  try{
    const ac = audioCtx();
    const t = ac.currentTime + delay;
    const len = Math.max(1, Math.ceil(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = tief ? "lowpass" : "highpass";
    f.frequency.value = tief ? 320 : 2400;
    const g = ac.createGain(); g.gain.value = vol * (_musikModus ? LAUT.musik : LAUT.fx);
    if(g.gain.value <= 0.0005) return;
    src.connect(f); f.connect(g); g.connect(_master); if(hall) g.connect(_delay);
    src.start(t);
  }catch(e){}
}

    r.ereignisse.push({ t:`⚡ <b>REVOLUTION!</b> Das Volk stürmt die Residenz, ${alter2} muss abdanken.
      ${p.name} besteigt unter Jubelrufen den Thron, ein Neuanfang für das geschundene Reich.`, c:"bad" });
    geschichte("⚡", `${alter2} wird vom Volk zur Abdankung gezwungen, ${p.name} übernimmt.`);
    if(!p.ki) toast(`⚡ Revolution! Ihr regiert fortan als ${p.name}.`, 8000);
  } else {
    /* Sturz: die Herrschaft endet */
    p.tot = true; p.gestuerzt = true;
    p.heer = { inf:0, kav:0, art:0 };
    r.ereignisse.push({ t:`⚡ <b>REVOLUTION!</b> Das Volk stürmt die Residenz und jagt Euch vom Thron.
      Ohne Thronfolger endet Eure Herrschaft hier.`, c:"bad" });
    geschichte("🏳️", `${titelName(p)} ${p.name} wird vom eigenen Volk gestürzt, das Reich versinkt im Chaos.`);
    if(!p.ki){ toast("🏳️ Das Volk hat Euch gestürzt. Eure Herrschaft ist beendet.", 9000); sTrauer(); }

}
function zwischenbilanz(p){
  const r = { ereignisse:[] };
  const noetig = noetigKorn(p);
  const f = noetig>0 ? p.ausgabe/noetig : 1;

  const ev = Math.random() / diffFaktor();
  if(ev < 0.05 && p.pop > 1200){
    const opfer = Math.round(p.pop * rf(0.12,0.28));
    p.pop -= opfer;
    geschichte("💀", `Die Pest sucht ${p.name}s Reich heim · ${fmt(opfer)} Tote.`);
    r.ereignisse.push({t:`Die Pest wütet im Land! ${fmt(opfer)} Untertanen sterben.`,c:"bad"});
  } else if(ev < 0.10){
    const zuzug = Math.round(p.pop * rf(0.02,0.05));
    p.pop += zuzug;
    r.ereignisse.push({t:`Ein Treck von Siedlern trifft ein: +${fmt(zuzug)} Einwohner.`,c:"good"});
  }

  /* Grundstimmung aus Steuern, Justiz und Kornausgabe. Ereignis-Effekte
     (Feste, Aufruhr, Kriege …) hallen mit halber Stärke ins nächste Jahr nach */
  const stimmungBasis = clamp(90 - (p.einkSt+p.mwSt)*0.8 - p.zoll*0.4 - (p.justiz-2)*10 + (f-1)*40
    + (p.zug==="volksnah" ? 5 : 0), 5, 100);
  const nachhall = p._stimmungBasis !== undefined
    ? clamp(p.stimmung - p._stimmungBasis, -30, 30) * 0.5 : 0;
  p.stimmung = Math.round(clamp(stimmungBasis + nachhall, 5, 100));
  p._stimmungBasis = Math.round(stimmungBasis);

  const g = G.tempo;
  r.geburten   = Math.round(p.pop * 0.04 * (0.5 + p.stimmung/100) * g);
  r.tote       = Math.round(p.pop * 0.018);
  r.verhungert = f < 1 ? Math.round(p.pop * (1-f) * 0.5) : 0;
  r.migration  = Math.round(p.pop * 0.05 * (p.stimmung-50)/100 * g);
  p.pop = Math.max(50, p.pop + r.geburten - r.tote - r.verhungert + r.migration);
  if(p.stimmung >= 90) erfolg("volk");
  /* Revolutionsgefahr: anhaltendes Elend unter Stimmung 15 */
  if(p.stimmung < 15){
    p.unruheJahre = (p.unruheJahre||0) + 1;
    if(p.unruheJahre === 1){
      r.ereignisse.push({ t:"🔥 Es gärt im Volk! Flugschriften kursieren, auf den Märkten wird offen geschimpft. Hebt die Stimmung, sonst drohen Unruhen.", c:"bad" });
    } else if(p.unruheJahre === 2){
      const geplündert = Math.round(p.korn * 0.1);
      p.korn -= geplündert;
      r.ereignisse.push({ t:`🔥 Unruhen! Aufgebrachte Haufen plündern ${fmt(geplündert)} Fuder aus den Speichern. Noch ein Jahr Elend, und das Volk erhebt sich!`, c:"bad" });
      geschichte("🔥", `Unruhen in ${p.name}s Reich, die Speicher werden geplündert.`);
    } else if(Math.random() < 0.55){
      aufstand(p, r);
    } else {
      r.ereignisse.push({ t:"🔥 Barrikaden in den Gassen! Nur das Zaudern der Rädelsführer rettet Euch dieses Jahr, das Reich steht am Abgrund.", c:"bad" });
    }
  } else if(p.stimmung >= 25){
    p.unruheJahre = 0;
  }
  /* Thronfolger: dem Haus wird ein Kind geboren */
  if(!p.erbe && alterJahre(p) >= 20 && alterJahre(p) <= 55){
    const verm = p.ehen && Object.values(p.ehen).some(j=>j>=G.jahr);
    if(Math.random() < (verm ? 0.22 : 0.13)){
      const w = Math.random() < 0.5;
      const pool = w ? KINDER_W : KINDER_M;
      p.erbe = { name: pool[ri(0,pool.length-1)], w, geb: G.jahr, zug: p.ki ? wuerfleZug() : null };
      r.ereignisse.push({ t:`🍼 Dem Hause wird ${w?"eine Tochter":"ein Sohn"} geboren: <b>${p.erbe.name}</b>! ${p.ki?"":"Wählt unten die Erziehung."}`, c:"good" });
      geschichte("🍼", `${p.name}s Haus feiert die Geburt von ${p.erbe.name}.`);
    }
  }
  r.f = f;
  p.zb = r;
}

/* ---------- Jahresschluss (Ernte, Steuern, Heer) ---------- */
function jahresschluss(p){
  const r = { ereignisse:[] };

  /* Wetter & Ernte */
  const summe = WETTER.reduce((s,w)=>s+w.w,0);
  let roll = Math.random()*summe, wetter = WETTER[2];
  for(const w of WETTER){ roll -= w.w; if(roll<=0){ wetter = w; break; } }
  r.wetter = wetter;
  const bearbeitet = Math.min(p.pop*4, anbau(p));
  let ertrag = rf(0.038,0.050) * wetter.f * (1 + Math.min(p.muehlen*0.05, 1.0)) * (saisonFx().ernte || 1);
  if(hatPrivileg(p,7)) ertrag *= 1.10;                 /* Königlicher Erntesegen */
  if(p._ernteBonus){ ertrag *= 1 + p._ernteBonus; r.erfindung = true; p._ernteBonus = 0; }
  r.ernte = Math.round(bearbeitet * ertrag);
  p.korn += r.ernte;
  /* Baustoff-Ertrag aus Forsthöfen und Steinbrüchen */
  r.holzErtrag = (p.forst||0) * 30;
  r.steinErtrag = (p.bruch||0) * 20;
  p.holz = (p.holz||0) + r.holzErtrag;
  p.stein = (p.stein||0) + r.steinErtrag;

  /* Wirtschafts-Ereignisse */
  const ev = Math.random() / diffFaktor();
  if(ev < 0.07){
    const verlust = Math.round(p.korn * rf(0.2,0.4));
    p.korn -= verlust;
    r.ereignisse.push({t:`Ratten im Kornspeicher! ${fmt(verlust)} Fuder vernichtet.`,c:"bad"});
  } else if(ev < 0.11 && (p.maerkte>0 || p.muehlen>0)){
    if(p.maerkte>0 && (p.muehlen===0 || Math.random()<0.5)){ p.maerkte--; entferneGebaeude(p,"m"); r.ereignisse.push({t:"Feuersbrunst! Ein Markt brennt nieder.",c:"bad"}); }
    else { p.muehlen--; entferneGebaeude(p,"k"); r.ereignisse.push({t:"Feuersbrunst! Eine Mühle brennt nieder.",c:"bad"}); }
  }

  /* Steuern & Heer-Unterhalt */
  r.steuern = Math.round(p.pop*(p.einkSt*0.08 + p.mwSt*0.05)/10)*10
            + p.zoll*p.maerkte*6 + p.maerkte*150 + staedte(p)*2000 + (p.haefen||0)*700;
  if(p.berater && p.berater.schatz) r.steuern = Math.round(r.steuern * 1.08);
  if(hatPrivileg(p,1)) r.steuern = Math.round(r.steuern * 1.05);   /* Baronale Steuerhoheit */
  r.routenGeld = routenZoll(p);
  p.geld += r.routenGeld;
  p.geld += r.steuern;
  p.stat.steuern += r.steuern;
  r.unterhalt = unterhalt(p);
  p.geld -= r.unterhalt;
  r.gehaelter = beraterGehalt(p);
  p.geld -= r.gehaelter;
  r.spione = p.gegenspione ? 500 : 0;
  p.geld -= r.spione;
  expeditionAufloesen(p, r);
  /* Berater-Agenden: gelegentliche Zwischenfälle */
  if(p.berater && p.berater.schatz && Math.random() < 0.05){
    p.geld -= 1000;
    delete p.berater.schatz;
    r.ereignisse.push({t:"Der Schatzmeister hat 1.000 Taler veruntreut und ist geflohen!",c:"bad"});
  } else if(beraterGehalt(p) > 0 && p.geld < 0 && Math.random() < 0.5){
    const aktiv = BERATER.filter(b=>p.berater[b.k]);
    if(aktiv.length){ const b = aktiv[ri(0,aktiv.length-1)]; delete p.berater[b.k];
      r.ereignisse.push({t:`${b.person} quittiert den Dienst, die Kasse ist leer.`,c:"bad"}); }
  }
  if(r.unterhalt > 0 && p.geld < 0){
    const rest = Math.max(0, Math.round(heerGroesse(p.heer)*0.7));
    const verlust = heerGroesse(p.heer) - rest;
    if(verlust > 0){
      const q = rest / Math.max(1, heerGroesse(p.heer));
      p.heer.inf = Math.floor(p.heer.inf*q); p.heer.kav = Math.floor(p.heer.kav*q); p.heer.art = Math.floor(p.heer.art*q);
      r.ereignisse.push({t:`Der Sold bleibt aus · ${fmt(verlust)} Söldner desertieren!`,c:"bad"});
    }
  }

  /* Zeitfaktor */
  const dauer = (Date.now() - p.turnStart)/1000;
  r.ueberzeit = Math.max(0, dauer - 90);
  if(r.ueberzeit > 0) p.todesJahr -= r.ueberzeit/180;

  auftragPruefen(p, r);
  if(G.jahr >= 1750 && !p.ki) erfolg("chronist");
  p.report = r;
  p.chronik = (p.chronik||[]).concat({ j:G.jahr, pop:p.pop, geld:Math.round(p.geld), land:p.land, heer:heerGroesse(p.heer), mi:score(p) }).slice(-80);
  quicksave();
}

function pruefeBefoerderung(p){
  if(p.titel >= 8) return false;
  const b = BEDINGUNGEN[p.titel+1];
  if(p.geld > 0 && b.ok(p)){
    p.titel++;
    geschichte(p.titel===8?"👑":"🎖️", `${p.name} wird zu${p.w?"r":"m"} ${titelName(p)} erhoben.`);
    if(!p.ki){ erfolg("baron"); if(p.titel===8) erfolg("kaiser"); }
    return true;
  }
  return false;
}

/* ---------- Krieg: Nachbarschaft & Diplomatie ---------- */
function lebende(){ return G.spieler.map((p,i)=>({p,i})).filter(x=>!x.p.tot); }
function nachbarn(i){
  const l = lebende().map(x=>x.i);
  if(l.length<=2) return l.filter(x=>x!==i);
  const pos = l.indexOf(i);
  return [ l[(pos-1+l.length)%l.length], l[(pos+1)%l.length] ];
}
/* kürzester Weg (über lebende Spieler im Sitzkreis) von a nach b, exklusive Endpunkte */
function wegZwischen(a,b){
  const l = lebende().map(x=>x.i);
  const pa = l.indexOf(a), pb = l.indexOf(b), n = l.length;
  const d1 = (pb-pa+n)%n, d2 = (pa-pb+n)%n;
  const richtung = d1<=d2 ? 1 : -1, dist = Math.min(d1,d2);
  const weg = [];
  for(let s=1;s<dist;s++) weg.push(l[(pa+richtung*s+n)%n]);
  return weg;
}

function kriegVorbereiten(zielIdx){
  const a = G.aktiv, d = zielIdx;
  if(routeAktiv(a, d)) routeTrennen(a, d, "durch die Kriegserklärung zerbrochen");
  const weg = wegZwischen(a,d);
  const alle = lebende().map(x=>x.i).filter(i=>i!==a && i!==d);
  const kr = { a, d, weg, fragen:[], frageIdx:0, wahl:{}, abgebrochen:false,
               taktikA: G._taktikA || "sturm", taktikD: null };
  kr.gelaende = wuerfleGelaende();
  /* KI-Regenten antworten sofort, Menschen werden am Gerät befragt */
  for(const i of alle){
    const s = G.spieler[i];
    if(s.ki) kr.wahl[i] = kiDiploWahl(s, kr);
    else kr.fragen.push(i);
  }
  G._kr = kr;
  diploWeiter();
}
function diploWeiter(){
  const kr = G._kr;
  if(kr.frageIdx < kr.fragen.length){
    const f = kr.fragen[kr.frageIdx];
    if(mpMein(f)) zeige("diplomatie");
    else mpPend("diplo", f);

}
function diploWahl(wahl){
  const kr = G._kr;
  const frag = G.spieler[kr.fragen[kr.frageIdx]];
  const ver = G.spieler[kr.d];
  if(wahl !== "def" && buendnisAktiv(frag, ver)){
    buendnisBrechen(frag, ver, "der Beistand wurde verweigert");
    toast(`🪓 Ihr habt den Beistand verweigert, das Bündnis mit ${ver.name} ist zerbrochen.`, 7000);
  }
  kr.wahl[kr.fragen[kr.frageIdx]] = wahl;
  kr.frageIdx++;

}
function diploFertig(){
  const kr = G._kr;
  /* Durchmarsch prüfen: jeder Wegspieler muss Angreifer unterstützen oder Durchmarsch gewähren */
  const blockiert = kr.weg.some(i => !["atk","frei"].includes(kr.wahl[i]));
  if(blockiert){
    kr.abgebrochen = true;
    G.spieler[kr.a].kriegGefuehrt = true;
    if(mpMein(kr.a)) zeige("kriegAbbruch");
    else mpPend("kriegAbbruch", kr.a);

  }
  const ver = G.spieler[kr.d];
  if(((ver.mauer||0) + (ver.burg||0)) > 0 && !kr.belagerung){
    if(mpMein(kr.a)) zeige("belagerung");

  if(mpMein(kr.a)){ G._aufW = [2,2,2,2,2]; G._aufRes = 0; zeige("aufstellungA"); }
  else mpPend("schlachtplan", kr.a);
}

/* ---------- Schlacht (animiert) ---------- */
function seiteBauen(besitzerIdx, unterstuetzer, verteidigt){
  const eig = G.spieler[besitzerIdx];
  const pools = [{ idx:besitzerIdx, name:eig.name, inf:eig.heer.inf, kav:eig.heer.kav, art:eig.heer.art }];
  for(const ui of unterstuetzer){
    const u = G.spieler[ui];
    pools.push({ idx:ui, name:u.name, inf:u.heer.inf, kav:u.heer.kav, art:u.heer.art });
  }
  const m = miliz(eig);
  const aufgebot = verteidigt ? Math.round(eig.pop*0.02) : 0;
  return { pools, miliz:m, aufgebot,
    inf: pools.reduce((s,x)=>s+x.inf,0),
    kav: pools.reduce((s,x)=>s+x.kav,0),
    art: pools.reduce((s,x)=>s+x.art,0) };
}
const seiteStaerke = s =>
  s.inf + s.kav*2.5 + s.art*4 + s.miliz*0.8 + s.aufgebot*0.5;

/* ============================================================
   Schlacht nach Original-Vorbild: Truppen werden vor der Schlacht
   auf fünf Abschnitte aufgestellt, dann rücken die Linien vor.
   Fernkampf der Artillerie, Nahkampf am Berührungspunkt,
   Durchbrüche in die Nachbarabschnitte, Moral und Flucht.
   ============================================================ */
const LANES = 5;
const LANE_NAMEN = ["Nordflanke","Halbnord","Zentrum","Halbsüd","Südflanke"];
const AUFSTELLUNGEN = [
  { n:"Breite Linie",       g:[2,2,2,2,2] },
  { n:"Massiertes Zentrum", g:[1,2,4,2,1] },
  { n:"Schwerpunkt Nord",   g:[4,3,2,1,1] },
  { n:"Schwerpunkt Süd",    g:[1,1,2,3,4] },
  { n:"Doppelflanke",       g:[3,1,1,1,3] }
];
function verteileEinheiten(einheiten, gewichte){
  const summe = gewichte.reduce((a,b)=>a+b,0) || 1;
  const lanes = Array.from({length:LANES}, ()=>({inf:0,kav:0,art:0,miliz:0,auf:0}));
  for(const typ of ["inf","kav","art","miliz","auf"]){
    const gesamt = einheiten[typ]||0;
    const roh = gewichte.map(g => gesamt*g/summe);
    const basis = roh.map(Math.floor);
    let vergeben = basis.reduce((a,b)=>a+b,0);
    const reste = roh.map((r,i)=>({i, r:r-basis[i]})).sort((a,b)=>b.r-a.r);
    for(let k=0; vergeben<gesamt; k++,vergeben++) basis[reste[k%LANES].i]++;
    basis.forEach((n,i)=>lanes[i][typ]=n);
  }
  return lanes;
}
/* Kampferfahrung des stehenden Heeres: Rekruten -> Kämpen -> Veteranen */
const RANG_NAMEN = ["Rekruten","Kämpen","Veteranen"];
const RANG_ICO = ["🪖","⚔️","🎖️"];
const heerRang = p => (p.heerXp||0) >= 60 ? 2 : (p.heerXp||0) >= 25 ? 1 : 0;
const xpFaktor = stufe => 1 + stufe*0.05;
/* Anwerbbare Feldherren mit eigenen Stärken */
const FELDHERREN = [
  { id:"flanke",     ico:"🐎", n:"Ritter Falk von Sturmfels",  t:"Flankenmeister",
    d:"Kavallerie +10 %, Durchbrüche reißen größere Lücken in die Front." },
  { id:"belagerung", ico:"💣", n:"Meister Balthasar Krumm",    t:"Belagerungskünstler",
    d:"Artillerie +15 %, feindliche Festungswerke wirken beim Angriff schwächer." },
  { id:"defensiv",   ico:"🛡️", n:"Marschall Gerold der Fels",  t:"Defensivgenie",
    d:"In der Verteidigung +10 % Nahkampfkraft und zähere Moral." },
  { id:"sturm",      ico:"⚡", n:"Hauptmann Jörg Hitzfeld",    t:"Sturmherr",
    d:"Schnellerer Vormarsch und ein härterer erster Zusammenprall (+8 % Nahkampf)." }
];
const feldherrArt = p => p.feldherr ? FELDHERREN.find(f=>f.id===p.feldherr.id) : null;
const feldherrSkala = p => p.feldherr ? 1 + Math.min(p.feldherr.ruhm||0, 5)*0.06 : 1;
/* Kampf-Faktoren einer Seite aus Feldherr und Erfahrung */
function seitenFaktoren(p, verteidigt){
  const fx = { kav:1, art:1, nah:1, tempo:1, durch:0.3, zaeh:false };
  fx.nah *= xpFaktor(heerRang(p)); fx.art *= xpFaktor(heerRang(p));
  const fa = feldherrArt(p);
  if(fa){
    const sk = feldherrSkala(p);
    if(fa.id==="flanke"){ fx.kav *= 1 + 0.10*sk; fx.durch = 0.3 + 0.15*sk; }
    if(fa.id==="belagerung"){ fx.art *= 1 + 0.15*sk; }
    if(fa.id==="defensiv" && verteidigt){ fx.nah *= 1 + 0.10*sk; fx.zaeh = true; }
    if(fa.id==="sturm" && !verteidigt){ fx.tempo *= 1 + 0.25*sk; fx.nah *= 1 + 0.08*sk; }
  }
  return fx;
}
const laneGroesse = u => u.inf+u.kav+u.art+u.miliz+u.auf;
const resGroesse = r => r ? (r.inf||0)+(r.kav||0)+(r.miliz||0)+(r.auf||0) : 0;
/* Zieht den Reserve-Anteil (ohne Artillerie) aus einer Armee heraus */
function reserveAbziehen(e, frac){
  if(!frac) return null;
  const r = { inf:0, kav:0, miliz:0, auf:0 };
  for(const typ of ["inf","kav","miliz","auf"]){
    r[typ] = Math.round((e[typ]||0) * frac);
    e[typ] = (e[typ]||0) - r[typ];
  }
  return resGroesse(r) > 0 ? r : null;
}
const laneNahkampf = u => u.inf + u.kav*2.5 + u.art*0.4 + u.miliz*0.8 + u.auf*0.5;
function laneVerlust(u, anzahl){
  let g = laneGroesse(u);
  if(g<=0 || anzahl<=0) return 0;
  const echt = Math.min(g, Math.round(anzahl));
  for(const typ of ["inf","kav","art","miliz","auf"]){
    const teil = Math.round(echt * (u[typ]/g));
    u[typ] = Math.max(0, u[typ]-teil);
  }
  /* Rundungsreste beim größten Posten abziehen */

  const haar = `rgb(${haarBasis.map(v=>Math.round(v+(200-v)*grau)).join(",")})`;

  /* Gewand / Schultern */
  ctx.fillStyle = GEWAND[p.titel];
  ctx.beginPath();
  ctx.moveTo(cx-W*0.40, H+2);
  ctx.quadraticCurveTo(cx-W*0.36, H*0.66, cx-W*0.17, H*0.615);
  ctx.lineTo(cx+W*0.17, H*0.615);
  ctx.quadraticCurveTo(cx+W*0.36, H*0.66, cx+W*0.40, H+2);
  ctx.closePath(); ctx.fill();
  /* Stickerei-Borte */
  ctx.strokeStyle = "rgba(224,180,88,.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, H*0.62); ctx.lineTo(cx, H); ctx.stroke();
  /* Pelz-/Hermelinkragen */
  if(p.titel>=7){
    ctx.fillStyle = "#efece2";
    ctx.beginPath();
    ctx.moveTo(cx-W*0.19, H*0.63);
    ctx.quadraticCurveTo(cx, H*0.585, cx+W*0.19, H*0.63);
    ctx.lineTo(cx+W*0.15, H*0.78); ctx.quadraticCurveTo(cx, H*0.73, cx-W*0.15, H*0.78);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#20242c";
    for(let i=0;i<7;i++) ctx.fillRect(cx-W*0.14+i*W*0.047, H*0.66+ (i%2)*8, 3, 6);
  } else if(p.titel>=3){
    ctx.strokeStyle = "#d8d0bd"; ctx.lineWidth = 9; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(cx-W*0.16, H*0.66); ctx.quadraticCurveTo(cx, H*0.60, cx+W*0.16, H*0.66); ctx.stroke();
  }
  /* Seidene Schärpe quer über die Brust (ab Fürst) */
  if(p.titel>=4){
    ctx.save();
    ctx.globalAlpha = 0.85;
    const sgrad2 = ctx.createLinearGradient(cx-W*0.2, H*0.62, cx+W*0.2, H*0.95);
    sgrad2.addColorStop(0, p.farbe);
    sgrad2.addColorStop(1, "#8a2f3f");
    ctx.fillStyle = sgrad2;
    ctx.beginPath();
    ctx.moveTo(cx-W*0.155, H*0.635);
    ctx.lineTo(cx-W*0.085, H*0.625);
    ctx.lineTo(cx+W*0.24, H*0.97);
    ctx.lineTo(cx+W*0.15, H*0.99);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(224,180,88,.7)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx-W*0.145, H*0.633); ctx.lineTo(cx+W*0.235, H*0.972); ctx.stroke();

  /* Amtskette + Medaillon */
  if(p.titel>=4){

    ctx.beginPath(); ctx.moveTo(cx-W*0.13, H*0.65); ctx.quadraticCurveTo(cx, H*0.78, cx+W*0.13, H*0.65); ctx.stroke();

    ctx.beginPath(); ctx.arc(cx, H*0.775, 7, 0, 7); ctx.fill();
    ctx.fillStyle = p.farbe;
    ctx.beginPath(); ctx.arc(cx, H*0.775, 3.4, 0, 7); ctx.fill();
  }
  /* Hals & Kopf */
  ctx.fillStyle = haut;
  ctx.fillRect(cx-kr*0.36, kopfY+kr*0.62, kr*0.72, kr*0.75);
  ctx.beginPath(); ctx.ellipse(cx, kopfY, kr*0.82, kr, 0, 0, 7); ctx.fill();
  /* Ohren */
  ctx.beginPath(); ctx.ellipse(cx-kr*0.82, kopfY+kr*0.08, kr*0.13, kr*0.2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+kr*0.82, kopfY+kr*0.08, kr*0.13, kr*0.2, 0, 0, 7); ctx.fill();
  if(p.w){ /* Ohrringe */
    ctx.fillStyle = "#e0b458";
    ctx.beginPath(); ctx.arc(cx-kr*0.82, kopfY+kr*0.32, 2.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+kr*0.82, kopfY+kr*0.32, 2.6, 0, 7); ctx.fill();
  }
  /* Haare */
  ctx.fillStyle = haar;
  if(p.w){
    ctx.beginPath();
    ctx.moveTo(cx-kr*0.95, kopfY+kr*1.5);
    ctx.quadraticCurveTo(cx-kr*1.15, kopfY-kr*0.2, cx-kr*0.5, kopfY-kr*0.95);
    ctx.quadraticCurveTo(cx, kopfY-kr*1.22, cx+kr*0.5, kopfY-kr*0.95);
    ctx.quadraticCurveTo(cx+kr*1.15, kopfY-kr*0.2, cx+kr*0.95, kopfY+kr*1.5);
    ctx.lineTo(cx+kr*0.62, kopfY+kr*1.5);
    ctx.quadraticCurveTo(cx+kr*0.78, kopfY+kr*0.2, cx+kr*0.55, kopfY-kr*0.42);
    ctx.quadraticCurveTo(cx, kopfY-kr*0.72, cx-kr*0.55, kopfY-kr*0.42);
    ctx.quadraticCurveTo(cx-kr*0.78, kopfY+kr*0.2, cx-kr*0.62, kopfY+kr*1.5);
    ctx.closePath(); ctx.fill();
  } else {
    const ansatz = aj>58 ? 0.28 : 0.05;    /* Geheimratsecken im Alter */
    ctx.beginPath();
    ctx.moveTo(cx-kr*0.85, kopfY-kr*0.05);
    ctx.quadraticCurveTo(cx-kr*0.8, kopfY-kr*(1.05-ansatz), cx, kopfY-kr*(1.12-ansatz));
    ctx.quadraticCurveTo(cx+kr*0.8, kopfY-kr*(1.05-ansatz), cx+kr*0.85, kopfY-kr*0.05);
    ctx.quadraticCurveTo(cx+kr*0.6, kopfY-kr*0.42, cx, kopfY-kr*0.5);
    ctx.quadraticCurveTo(cx-kr*0.6, kopfY-kr*0.42, cx-kr*0.85, kopfY-kr*0.05);
    ctx.closePath(); ctx.fill();
    /* Bart ab 40 oder ab Herzog */
    if(aj>=40 || p.titel>=5){
      ctx.beginPath();
      ctx.moveTo(cx-kr*0.55, kopfY+kr*0.35);
      ctx.quadraticCurveTo(cx, kopfY+kr*(aj>=52?1.55:1.3), cx+kr*0.55, kopfY+kr*0.35);
      ctx.quadraticCurveTo(cx, kopfY+kr*0.62, cx-kr*0.55, kopfY+kr*0.35);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = haar; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx-kr*0.3, kopfY+kr*0.48); ctx.quadraticCurveTo(cx, kopfY+kr*0.6, cx+kr*0.3, kopfY+kr*0.48); ctx.stroke();
    }
  }
  /* Augen, Brauen, Nase, Mund. Alle paar Sekunden ein Wimpernschlag */
  const augY = kopfY - kr*0.08;
  const blinzelt = t > 0 && ((t + idx*1300) % 4300) < 140;
  for(const s of [-1,1]){
    if(blinzelt){
      ctx.strokeStyle = "rgba(90,64,44,.85)"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx+s*kr*0.2, augY); ctx.lineTo(cx+s*kr*0.5, augY); ctx.stroke();
      ctx.fillStyle = "#fff";
    } else {
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(cx+s*kr*0.35, augY, kr*0.16, kr*0.10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = ["#4a3a28","#3a5a6a","#3f5a3a"][Math.floor(rng()*3)];
    ctx.beginPath(); ctx.arc(cx+s*kr*0.35, augY, kr*0.065, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = haar; ctx.lineWidth = 3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(cx+s*kr*0.18, augY-kr*0.22); ctx.lineTo(cx+s*kr*0.52, augY-kr*(0.24+rng()*0.05)); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(120,80,50,.55)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, augY+kr*0.1); ctx.quadraticCurveTo(cx+kr*0.09, kopfY+kr*0.28, cx-kr*0.04, kopfY+kr*0.32); ctx.stroke();
  ctx.strokeStyle = p.w ? "#b0524f" : "rgba(120,70,50,.8)"; ctx.lineWidth = p.w ? 4 : 3;
  ctx.beginPath(); ctx.moveTo(cx-kr*0.22, kopfY+kr*0.55); ctx.quadraticCurveTo(cx, kopfY+kr*(0.62+0.04*Math.min(1,p.stimmung/60)), cx+kr*0.22, kopfY+kr*0.55); ctx.stroke();
  /* Falten im Alter */
  if(aj>=48){
    ctx.strokeStyle = "rgba(110,80,60,.4)"; ctx.lineWidth = 1.5;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.moveTo(cx+s*kr*0.5, augY+kr*0.16); ctx.quadraticCurveTo(cx+s*kr*0.56, augY+kr*0.24, cx+s*kr*0.48, augY+kr*0.3); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx-kr*0.4, kopfY-kr*0.52); ctx.quadraticCurveTo(cx, kopfY-kr*0.58, cx+kr*0.4, kopfY-kr*0.52); ctx.stroke();
    if(aj>=58){ ctx.beginPath(); ctx.moveTo(cx-kr*0.38, kopfY-kr*0.4); ctx.quadraticCurveTo(cx, kopfY-kr*0.46, cx+kr*0.38, kopfY-kr*0.4); ctx.stroke(); }
  }
  /* Kopfschmuck nach Rang */
  const kroneY = kopfY - kr*(p.w?1.05:0.98);
  if(p.titel>=1 && p.titel<=2){         /* Silberreif */
    ctx.strokeStyle = "#c9ccd4"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx-kr*0.6, kroneY+kr*0.18); ctx.quadraticCurveTo(cx, kroneY, cx+kr*0.6, kroneY+kr*0.18); ctx.stroke();
  } else if(p.titel>=3 && p.titel<=4){  /* Silberreif mit Zacken */
    ctx.strokeStyle = "#c9ccd4"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx-kr*0.6, kroneY+kr*0.18); ctx.quadraticCurveTo(cx, kroneY, cx+kr*0.6, kroneY+kr*0.18); ctx.stroke();
    ctx.fillStyle = "#c9ccd4";
    for(const s of [-0.4,0,0.4]){
      ctx.beginPath(); ctx.moveTo(cx+s*kr-5, kroneY+kr*0.08); ctx.lineTo(cx+s*kr, kroneY-kr*0.18); ctx.lineTo(cx+s*kr+5, kroneY+kr*0.08); ctx.closePath(); ctx.fill();
    }
  } else if(p.titel>=5 && p.titel<=6){  /* Goldene Adelskrone */
    ctx.fillStyle = "#e0b458";
    ctx.fillRect(cx-kr*0.62, kroneY, kr*1.24, kr*0.2);
    for(const s of [-0.5,-0.17,0.17,0.5]){
      ctx.beginPath(); ctx.moveTo(cx+s*kr*1.1-6, kroneY+2); ctx.lineTo(cx+s*kr*1.1, kroneY-kr*0.3); ctx.lineTo(cx+s*kr*1.1+6, kroneY+2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+s*kr*1.1, kroneY-kr*0.3, 2.6, 0, 7); ctx.fill();
    }
  } else if(p.titel===7){               /* Königskrone */
    ctx.fillStyle = "#8a2f3f";
    ctx.beginPath(); ctx.ellipse(cx, kroneY-kr*0.1, kr*0.5, kr*0.28, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#e0b458";
    ctx.fillRect(cx-kr*0.62, kroneY, kr*1.24, kr*0.22);
    for(const s of [-0.45,0,0.45]){
      ctx.beginPath(); ctx.moveTo(cx+s*kr-7, kroneY+2); ctx.lineTo(cx+s*kr, kroneY-kr*0.42); ctx.lineTo(cx+s*kr+7, kroneY+2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#e5636f";
    for(const s of [-0.4,0,0.4]) { ctx.beginPath(); ctx.arc(cx+s*kr, kroneY+kr*0.11, 3, 0, 7); ctx.fill(); }
  } else if(p.titel===8){               /* Kaiserkrone mit Bügel und Kreuz */
    ctx.fillStyle = "#8a2f3f";
    ctx.beginPath(); ctx.ellipse(cx, kroneY-kr*0.12, kr*0.52, kr*0.3, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#e0b458";
    ctx.fillRect(cx-kr*0.66, kroneY, kr*1.32, kr*0.24);
    ctx.strokeStyle = "#e0b458"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx-kr*0.6, kroneY); ctx.quadraticCurveTo(cx, kroneY-kr*0.72, cx+kr*0.6, kroneY); ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, kroneY-kr*0.55); ctx.lineTo(cx, kroneY-kr*0.85);
    ctx.moveTo(cx-kr*0.1, kroneY-kr*0.72); ctx.lineTo(cx+kr*0.1, kroneY-kr*0.72); ctx.stroke();
    ctx.fillStyle = "#fff";
    for(let i=0;i<7;i++){ ctx.beginPath(); ctx.arc(cx-kr*0.55+i*kr*0.183, kroneY+kr*0.12, 2.4, 0, 7); ctx.fill(); }
  }
  /* Galerie-Vignette und goldener Zierrahmen wie ein Ahnenporträt */
  const c2 = document.getElementById(cid);
  if(c2){
    const W2 = c2.width, H2 = c2.height;
    const vig = ctx.createRadialGradient(W2/2, H2*0.45, Math.min(W2,H2)*0.38, W2/2, H2*0.5, Math.max(W2,H2)*0.75);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(10,8,4,.42)");
    ctx.fillStyle = vig; ctx.fillRect(0,0,W2,H2);
    ctx.strokeStyle = "rgba(224,180,88,.75)"; ctx.lineWidth = 3;
    ctx.strokeRect(4, 4, W2-8, H2-8);
    ctx.strokeStyle = "rgba(140,105,45,.6)"; ctx.lineWidth = 1;
    ctx.strokeRect(8.5, 8.5, W2-17, H2-17);
    /* Eck-Rosetten */
    ctx.fillStyle = "rgba(224,180,88,.85)";
    for(const [rx2, ry2] of [[8,8],[W2-8,8],[8,H2-8],[W2-8,H2-8]]){
      ctx.beginPath(); ctx.arc(rx2, ry2, 3.2, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(224,180,88,.5)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(rx2, ry2, 5.6, 0, 7); ctx.stroke();
    }
  }
}

/* ---------- Feuerwerk über der Krönung ---------- */
function zeichneFeuerwerk(t){
  const c = document.getElementById("feuerwerk");
  if(!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  const fw = G._fw = G._fw || { raketen:[], funken:[], letzt:0 };
  ctx.clearRect(0,0,W,H);
  /* Neue Raketen zünden */
  if(t - fw.letzt > 550 + Math.random()*500 && fw.raketen.length < 3){
    fw.letzt = t;
    fw.raketen.push({ x: W*(0.12+Math.random()*0.76), y: H+8,
      zielY: H*(0.12+Math.random()*0.4), v: 3.4+Math.random()*1.6,
      farbe: ["#e0b458","#e5636f","#5fb8d4","#4cc38a","#e08ab8"][ri(0,4)] });
  }
  /* Raketen steigen */
  for(const r of fw.raketen){
    r.y -= r.v * 1.9;
    ctx.strokeStyle = "rgba(255,235,180,.7)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + rf(-1,1), r.y+11); ctx.stroke();
    if(r.y <= r.zielY){
      r.tot = true;
      const n2 = ri(26,40);
      for(let k=0;k<n2;k++){
        const a2 = k/n2*6.2832 + rf(-0.1,0.1), sp2 = rf(0.7,2.4);
        fw.funken.push({ x:r.x, y:r.y, vx:Math.cos(a2)*sp2, vy:Math.sin(a2)*sp2,
          leben: 1, farbe: r.farbe, glitzer: Math.random()<0.3 });
      }
    }
  }
  fw.raketen = fw.raketen.filter(r=>!r.tot);
  /* Funken fallen aus */
  for(const f2 of fw.funken){
    f2.x += f2.vx; f2.y += f2.vy;
    f2.vy += 0.028;                          /* Schwerkraft */
    f2.vx *= 0.985; f2.vy *= 0.985;
    f2.leben -= 0.012;
    if(f2.leben <= 0) continue;
    const a3 = f2.glitzer ? f2.leben * (0.5+0.5*Math.sin(t/60 + f2.x)) : f2.leben;
    ctx.globalAlpha = clamp(a3,0,1);
    ctx.fillStyle = f2.farbe;
    ctx.beginPath(); ctx.arc(f2.x, f2.y, f2.glitzer ? 1.6 : 2.1, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  fw.funken = fw.funken.filter(f2=>f2.leben>0);
  if(fw.funken.length > 400) fw.funken.splice(0, fw.funken.length-400);
}

const SAISON_DEKO = {

  "Sommer":   { ico:"🌾", t:"Die Sonne steht hoch über den Feldern." },

/* ---------- Jahreszeiten-Panorama im Zugwechsel ---------- */
function zeichneSaisonband(t){
  const c = document.getElementById("saisonband");
  if(!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  const sn = saison();
  ctx.clearRect(0,0,W,H);
  const himmel = ctx.createLinearGradient(0,0,0,H);
  if(sn.n==="Winter"){ himmel.addColorStop(0,"#2c3646"); himmel.addColorStop(1,"#55606e"); }
  else if(sn.n==="Herbst"){ himmel.addColorStop(0,"#3a3448"); himmel.addColorStop(1,"#7a5638"); }
  else if(sn.n==="Frühling"){ himmel.addColorStop(0,"#33445c"); himmel.addColorStop(1,"#6a7a58"); }
  else { himmel.addColorStop(0,"#31527c"); himmel.addColorStop(1,"#7a8a52"); }
  ctx.fillStyle = himmel; ctx.fillRect(0,0,W,H);
  /* Sonne bzw. Wintermond */
  if(sn.n==="Winter"){
    ctx.fillStyle = "rgba(235,240,250,.85)";
    ctx.beginPath(); ctx.arc(W*0.84, H*0.22, 14, 0, 7); ctx.fill();
    ctx.save(); ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(W*0.84+6, H*0.22-3, 12, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#37414f";
    ctx.beginPath(); ctx.arc(W*0.84+6, H*0.22-3, 12, 0, 7); ctx.fill();
  } else {
    const sonnY = sn.n==="Sommer" ? H*0.18 : H*0.30;
    const sonn = ctx.createRadialGradient(W*0.82, sonnY, 3, W*0.82, sonnY, 34);
    sonn.addColorStop(0,"rgba(255,236,180,.85)"); sonn.addColorStop(1,"rgba(255,236,180,0)");
    ctx.fillStyle = sonn; ctx.beginPath(); ctx.arc(W*0.82, sonnY, 34, 0, 7); ctx.fill();
  }
  /* Ferne Hügelkette */
  ctx.fillStyle = "rgba(255,255,255,.05)";
  ctx.beginPath(); ctx.moveTo(0,H*0.62);
  ctx.quadraticCurveTo(W*0.25, H*0.46, W*0.5, H*0.58);
  ctx.quadraticCurveTo(W*0.75, H*0.68, W, H*0.52);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  /* Hügelzug */
  ctx.fillStyle = sn.g2;
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.22, H-band(H,58), W*0.48, H-band(H,34));
  ctx.quadraticCurveTo(W*0.74, H-band(H,12), W, H-band(H,46));
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  /* Baumreihen: hinten klein, vorn groß */
  const brng2 = mulberry(31);
  for(let b=0;b<12;b++) malBaum(ctx, 20+b*(W-40)/11 + brng2()*16, H-band(H,30)-brng2()*band(H,16), 5+brng2()*4, sn.b1, sn.b2, sn.schnee);
  for(let b=0;b<8;b++)  malBaum(ctx, 35+b*(W-70)/7 + brng2()*20, H-6-brng2()*8, 9+brng2()*6, sn.b1, sn.b2, sn.schnee);
  /* Saison-Partikel im Band */
  if(sn.schnee){
    ctx.fillStyle = "rgba(250,252,255,.85)";
    for(let i=0;i<64;i++){
      const seed = ((i*61)%97)/97;
      const px2 = (seed*W + t/(28+seed*24)) % W;
      const py2 = (t/(20+seed*20) + i*37) % H;
      ctx.beginPath(); ctx.arc(px2, py2, 1.2+seed*1.8, 0, 7); ctx.fill();
    }
  } else if(sn.n==="Herbst"){
    for(let i=0;i<26;i++){
      const seed = ((i*53)%89)/89;
      const px2 = (seed*W + t/(40+seed*30)) % W;
      const py2 = (t/(34+seed*22) + i*29) % H;
      ctx.save(); ctx.translate(px2,py2); ctx.rotate(t/300+i);
      ctx.fillStyle = i%2 ? "rgba(190,120,50,.8)" : "rgba(160,90,40,.75)";
      ctx.fillRect(-2.2,-1.4,4.4,2.8); ctx.restore();
    }
  } else {
    /* Vögel */
    ctx.strokeStyle = "rgba(220,226,238,.5)"; ctx.lineWidth = 1.3;
    for(let i=0;i<3;i++){
      const vx2 = ((t/(26+i*9) + i*280) % (W+60)) - 30;
      const vy2 = 14 + i*9 + Math.sin(t/380+i)*4;
      ctx.beginPath(); ctx.moveTo(vx2-5,vy2); ctx.quadraticCurveTo(vx2-1.5,vy2-3.5,vx2,vy2);
      ctx.quadraticCurveTo(vx2+1.5,vy2-3.5,vx2+5,vy2); ctx.stroke();
    }

/* ---------- Titelpanorama (prozedural gemalt, mit Tag-/Nachtwechsel) ---------- */
function lerpFarbe(a, b, q){

/* Himmelpaletten: Abend → Nacht → Morgen → Tag → Abend (ein Umlauf ≈ 80 s) */
const TITEL_PHASEN = [

  { o:[7,10,20],   m:[14,18,34],   u:[24,30,48]   },   /* Nacht */
  { o:[30,38,58],  m:[80,60,90],   u:[160,110,80] },   /* Morgenrot */

function zeichneTitel(t){

  himmel.addColorStop(0, lerpFarbe(A.o, B.o, glatt));

  const nacht = si===0 ? glatt : si===1 ? 1-glatt*0 : 0;      /* Abend→Nacht steigt */
  const nachtFaktor = si===0 ? glatt : si===1 ? 1 : si===2 ? 1-glatt : 0;
  /* Sonne wandert über den Bogen (tags), der Mond bei Nacht */
  const sonnenPhase = ((umlauf + 0.5) % 1);                    /* 0.5 versetzt: mittags oben */
  const sx = W*(0.15 + 0.7*((umlauf*2 + 0.6) % 1));
  const sy = H*0.62;

    ctx.fillStyle = sonne; ctx.beginPath(); ctx.arc(sx,sy,46,0,7); ctx.fill();
    ctx.restore();
  }

    const mx = W*0.78, my = H*0.28;
    ctx.save(); ctx.globalAlpha = nachtFaktor;
    const hof = ctx.createRadialGradient(mx,my,6,mx,my,40);

  ctx.quadraticCurveTo(W*0.7,H-10,W,H-40);

  ctx.fillRect(bx-90, by-70, 180, 70);
  for(let z=0;z<7;z++) ctx.fillRect(bx-90+z*28, by-80, 14, 12);
  const turm = (tx,th,tw)=>{
    ctx.fillRect(tx-tw/2, by-th, tw, th);
    ctx.beginPath(); ctx.moveTo(tx-tw/2-5, by-th); ctx.lineTo(tx, by-th-26); ctx.lineTo(tx+tw/2+5, by-th); ctx.closePath(); ctx.fill();
  };
  turm(bx-90, 108, 34); turm(bx+90, 108, 34); turm(bx, 150, 42);
  /* Warm erleuchtete Fenster, nachts hell, tags erloschen */
  const fenster = [[bx-96,86],[bx-84,60],[bx+84,86],[bx+96,60],[bx-6,120],[bx+6,96],[bx-40,44],[bx+34,52],[bx-12,36],[bx+18,30]];

  ctx.closePath(); ctx.fill();
  /* Vögel */

  for(let i=0;i<3;i++){
    const vx = ((t/(30+i*8) + i*300) % (W+80)) - 40;

    ctx.quadraticCurveTo(vx+2,vy-4,vx+6,vy); ctx.stroke();
  }
  ctx.restore();

  for(let gf=0; gf<9; gf++){
    const seed = ((gf*71)%89)/89;
    const q = ((t/(5200+seed*2800)) + gf*0.31) % 1;

/* ---------- Reichskarte (prozedural, deterministisch pro Reich) ---------- */
function mulberry(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1|seed);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function territoriumsRadius(land){
  return 105 + 165 * Math.sqrt(Math.min(land,50000)/50000);
}
function blobPunkte(rng, cx, cy, rr){

    const a = i/16*6.2832;
    const r = rr * (0.8 + rng()*0.36);
    pts.push([cx + Math.cos(a)*r*1.35, cy + Math.sin(a)*r*0.82]);
  }
  return pts;
}
function malBlob(ctx, pts){
  ctx.beginPath();
  ctx.moveTo((pts[0][0]+pts[15][0])/2, (pts[0][1]+pts[15][1])/2);
  for(let i=0;i<16;i++){
    const n = pts[(i+1)%16];
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0]+n[0])/2, (pts[i][1]+n[1])/2);
  }
  ctx.closePath();
}
