            <button onclick="diploAktion('geschenk')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>🎁 Geschenk senden</button>
          </div>
          <div class="rowflex">
            <select id="dipRichtung" style="width:130px">
              <option value="kauf">Ich kaufe</option><option value="verkauf">Ich verkaufe</option>
            </select>
            <input type="number" id="dipMenge" min="1" value="100" style="width:80px" title="Fuder">
            <span class="muted small">Fuder à</span>
            <input type="number" id="dipPreis" min="1" value="${G.kornMarkt||100}" style="width:80px" title="Taler je Fuder">
            <button onclick="diploAktion('handel')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>Anbieten</button>
          </div>
          <div class="rowflex">
            <button onclick="diploAktion('pakt')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>🕊️ Nichtangriffspakt anbieten (5 Jahre)</button>
            <button onclick="diploAktion('buendnis')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>🛡️ Bündnis anbieten (8 Jahre, 1.000 T)</button>
          </div>
          <p class="muted small">Ein Bündnis verpflichtet zum Beistand: Wird ein Partner angegriffen,
          kämpft das Heer des anderen automatisch mit. Wer den Beistand verweigert, bricht das Bündnis
          und verliert viel Ansehen. Verbündete können einander nicht angreifen.</p>
          <div class="rowflex">
            <button onclick="diploAktion('route')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>🚚 Handelsroute anbieten (1.500 T)</button>
            <span class="muted small">${routenVon(G.aktiv).length}/3 Routen</span>
          </div>
          <div class="rowflex">
            <input type="number" id="dipMitgift" min="2000" step="500" value="3000" style="width:100px" title="Mitgift in Talern"
              oninput="eheAussicht()">
            <button onclick="diploAktion('ehe')" ${(p.diploZaehler||0)>=diploLimit(p)?'disabled':''}>💍 Vermählung anbieten</button>
            <span id="eheChance" class="small"></span>
          </div>
          <p class="muted small">Eine Ehe stiftet 12 Jahre Frieden zwischen den Häusern, und beim Tod des
          vermählten Regenten erbt Euer Haus einen Teil seines Landes.</p>
          <div class="rowflex">
            <select id="spionMission" style="min-width:200px">
              <option value="bericht">🕵️ Geheimbericht (600 T)</option>
              <option value="sabotage">💥 Mauer sprengen (1.200 T)</option>
              <option value="brand">🔥 Speicher brandschatzen (1.000 T)</option>
              <option value="aufruhr">🗣️ Aufruhr stiften (1.500 T)</option>
            </select>
            <button onclick="spionEntsenden()" ${p.spionGenutzt?'disabled':''}>Entsenden</button>
            ${p.spionGenutzt?'<span class="muted small">Spion dieses Jahr bereits unterwegs</span>':''}
          </div>
          <p class="muted small">Sabotage-Missionen sind riskant: Wird der Spion gefasst, gibt es einen
          Skandal, und mancher Regent greift dann zu den Waffen.</p>
          <div class="rowflex">
            <label class="small" style="cursor:pointer"><input type="checkbox" ${p.gegenspione?'checked':''}
              onchange="gegenspioneToggle(this.checked)"> 🛡️ Gegenspione unterhalten (500 T/Jahr) ·
              fremde Spione scheitern bei Euch deutlich öfter</label>
          </div>
          ${lebende().filter(x=>x.i!==G.aktiv).map(z=>spionBericht(p, z.i)).join("")}
        </div>
        <div class="card">
          <h3>🗣️ Botschaft an den Hof</h3>
          <p class="muted small">Sendet Worte an den oben gewählten Partner. Fremde Regenten antworten
          nach Charakter und Kräfteverhältnis: Freundliche Worte bessern das Verhältnis, Drohungen
          und Tributforderungen können Silber einbringen, oder einen <b>Krieg</b> entfesseln.
          Botschaften kosten keine Diplomatie-Aktion (höchstens drei je Hof und Jahr).</p>
          <div class="rowflex" style="margin-top:8px">
            <button onclick="botschaftSenden('gruss')">🕊️ Freundliche Worte</button>
            <button onclick="botschaftSenden('drohung')">😠 Drohung senden</button>
            <button onclick="botschaftSenden('tribut')">💰 Tribut fordern</button>
          </div>
          <div class="rowflex">
            <input id="botText" maxlength="160" placeholder="Eigene Botschaft, der Hof deutet Eure Worte …" style="flex:1;min-width:180px">
            <button onclick="botschaftSenden('frei')">📜 Boten entsenden</button>
          </div>
          ${(G._parley||[]).length?`
          <div style="margin-top:8px;max-height:180px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px">
            ${G._parley.map(e=>`<p class="small" style="padding:2px 0${e.von==="ich"?";color:var(--gold)":e.von==="hof"?";opacity:.75":""}">
              <b>${e.von==="ich"?"Ihr":e.von==="hof"?"·":e.von}:</b> ${e.text}</p>`).join("")}
          </div>`:""}
        </div>
        <div class="card">
          <h3>👥 Der Hofstaat</h3>
          ${BERATER.map(b=>`
            <div class="rowflex" style="justify-content:space-between">
              <span>${b.ico} <b>${b.person}</b> · ${b.n}<br>
                <span class="muted small">${b.d} · ${fmt(b.gehalt)} T Gehalt/Jahr</span></span>
              ${p.berater[b.k]
                ? `<button class="btn-sm" onclick="beraterEntlassen('${b.k}')">Entlassen</button>`
                : `<button class="btn-sm" onclick="beraterAnheuern('${b.k}')" ${p.geld<b.kosten?'disabled':''}>Anheuern (${fmt(b.kosten)} T)</button>`}
            </div>`).join("")}
          <p class="muted small">Berater kosten Antrittsgeld und Jahresgehalt, und haben mitunter eigene Pläne.</p>
          <p class="muted small">Angebote an menschliche Regenten werden zu Beginn von deren
          nächstem Zug beantwortet. Marktpreis derzeit ${fmt(G.kornMarkt||100)} T/Fuder.</p>
        </div>
      </div>
      <button class="btn-primary btn-lg" onclick="zeige('bauen')">Zurück zur Bauphase</button>`;
  },

  angebote(){
    const meine = (G.angebote||[]).map((a,i)=>({a,i})).filter(x=>x.a.an===G.aktiv);
    if(!meine.length){ setTimeout(()=>zeige("status"), 10); return ""; }
    const karten = meine.map(({a,i})=>{
      const von = G.spieler[a.von];
      const txt = a.richtung==="route"
        ? `möchte eine <b>Handelsroute</b> zwischen Euren Reichen eröffnen, beide Seiten kassieren jährlich Zoll, der Antragsteller trägt die Kosten.`
        : a.richtung==="ehe"
        ? `bittet um die <b>Vermählung Eurer Häuser</b>, mit einer Mitgift von <b>${fmt(a.menge)} Talern</b> (12 Jahre Frieden, Erbanspruch bei Todesfällen).`
        : a.richtung==="pakt"
        ? `bietet Euch einen <b>Nichtangriffspakt</b> über 5 Jahre an.`
        : a.richtung==="buendnis"
        ? `bietet Euch ein <b>Bündnis mit Beistandspflicht</b> über 8 Jahre an: Wird einer angegriffen, kämpft der andere automatisch mit.`
        : a.richtung==="kauf"
          ? `möchte <b>${fmt(a.menge)} Fuder Korn</b> von Euch kaufen, zu <b>${fmt(a.preis)} T/Fuder</b> (${fmt(a.menge*a.preis)} T gesamt).`
          : `bietet Euch <b>${fmt(a.menge)} Fuder Korn</b> an, zu <b>${fmt(a.preis)} T/Fuder</b> (${fmt(a.menge*a.preis)} T gesamt).`;
      return `<div class="pergament" style="max-width:660px;margin:0 auto 14px">
        <p style="font-size:15px">${von.wappen} <b>${titelName(von)} ${von.name}</b> ${txt}</p>
        <div class="zierlinie" style="margin:10px auto"></div>
        <p class="muted small center">Marktpreis derzeit ${fmt(G.kornMarkt||100)} T/Fuder · Euer Verhältnis: ${bezWert(cur(),von)>0?"+":""}${bezWert(cur(),von)}</p>
        <div class="center" style="margin-top:8px">
          <button class="btn-primary" onclick="angebotAntwort(${i}, true)">Annehmen</button>
          <button onclick="angebotAntwort(${i}, false)">Ablehnen</button>
        </div>
      </div>`;
    }).join("");
    return `
      <div class="center"><span class="ereignis-ico">📜</span></div>
      <h2 class="center" style="padding-bottom:4px">Botschaften an Euren Hof</h2>
      <div class="zierlinie" style="margin-bottom:14px"></div>
      ${karten}`;
  },

  kriegPlan(){
    const p = cur();
    const nb = nachbarn(G.aktiv);
    const ziele = lebende().filter(x=>x.i!==G.aktiv && !paktAktiv(p, x.p) && !buendnisAktiv(p, x.p));
    const pakte = lebende().filter(x=>x.i!==G.aktiv && (paktAktiv(p, x.p) || buendnisAktiv(p, x.p)));
    const vorwahl = G._zielVorwahl;
    G._zielVorwahl = undefined;
    const opts = ziele.map(z=>{
      const adj = nb.includes(z.i);
      const weg = adj ? [] : wegZwischen(G.aktiv, z.i);
      const burg = ((z.p.mauer||0)+(z.p.burg||0))>0 ? " · 🏰 befestigt" : "";
      return `<option value="${z.i}" ${z.i===vorwahl?'selected':''}>${titelName(z.p)} ${z.p.name} · ${fmt(z.p.land)} ha, ${fmt(z.p.pop)} Einw.${burg}${adj?" · Nachbar":" · Durchmarsch über "+weg.map(i=>G.spieler[i].name).join(", ")}</option>`;
    }).join("");
    return `
      ${stepper("Bauen")}
      <h2>⚔️ Feldzug planen</h2>
      <div class="card">
        <div class="rowflex">Gegner: <select id="ziel" style="max-width:100%">${opts}</select></div>
        ${pakte.length?`<p class="muted small">🕊️ Durch Pakte oder Bündnisse geschützt: ${pakte.map(x=>x.p.name).join(", ")}</p>`:""}
        ${ziele.map(z=>spionBericht(p, z.i)).join("")}
        <table>
          <tr><th>Eure Streitmacht</th><th class="r">Stärke</th></tr>
          <tr><td>Infanterie</td><td class="r">${fmt(p.heer.inf)}</td></tr>
          <tr><td>Kavallerie</td><td class="r">${fmt(p.heer.kav)}</td></tr>
          <tr><td>Artillerie</td><td class="r">${fmt(p.heer.art)}</td></tr>
          <tr><td>Miliz</td><td class="r">${fmt(miliz(p))}</td></tr>
        </table>
        <p class="muted small" style="margin-top:8px">Vor der Schlacht werden die übrigen Regenten
        befragt: Sie können Euch oder den Verteidiger mit ihrem Heer unterstützen (die Miliz bleibt
        stets daheim) oder neutral bleiben. Liegt das Ziel nicht an Eurer Grenze, braucht Ihr
        Durchmarschrechte aller Reiche auf dem Weg. Danach stellt Ihr Eure Truppen auf dem
        Schlachtfeld auf, der Verteidiger stellt geheim dagegen, hat Heimvorteil und ruft
        das Volksaufgebot.</p>
      </div>
      <button class="btn-danger btn-lg" onclick="kriegVorbereiten(+$('#ziel').value)">Zu den Waffen!</button>
      <button class="btn-lg" onclick="zeige('bauen')">Doch kein Krieg</button>`;
  },

  diplomatie(){
    const kr = G._kr;
    const frag = G.spieler[kr.fragen[kr.frageIdx]];
    const ang = G.spieler[kr.a], ver = G.spieler[kr.d];
    const aufWeg = kr.weg.includes(kr.fragen[kr.frageIdx]);
    return `
      <div class="hero" style="padding-top:30px">
        <span class="crown">📜</span>
        <h2 style="font-size:24px">Botschaft an ${titelName(frag)} ${frag.name}</h2>
        <p style="margin:12px auto;max-width:560px">
          <b class="gold">${titelName(ang)} ${ang.name}</b> zieht gegen
          <b class="cyan">${titelName(ver)} ${ver.name}</b> in den Krieg.
          ${aufWeg?"Der Heerzug führt durch <b>Euer</b> Gebiet.":""}
          Wie haltet Ihr es, ${titelName(frag)} ${frag.name}?</p>
        ${buendnisAktiv(frag, ver)?`<div class="event bad" style="max-width:560px;margin:0 auto 10px">🛡️ Ihr seid
          mit ${ver.name} <b>verbündet</b>. Der Beistand ist Pflicht, jede andere Wahl bricht das Bündnis
          und kostet viel Ansehen!</div>`:""}
        <p class="muted small" style="margin-bottom:18px">Unterstützt Ihr eine Seite, kämpft Euer
        stehendes Heer (${fmt(heerGroesse(frag.heer))} Mann) mit. Eure Miliz bleibt daheim.</p>
        <div>
          <button class="btn-lg" onclick="diploWahl('atk')">⚔️ Angreifer unterstützen</button>
          <button class="btn-lg" onclick="diploWahl('def')">🛡️ Verteidiger unterstützen</button>
        </div>
        <div>
          ${aufWeg
            ? `<button class="btn-lg" onclick="diploWahl('frei')">🕊️ Neutral. Durchmarsch gewähren</button>
               <button class="btn-lg" onclick="diploWahl('sperr')">🚫 Neutral. Durchmarsch verweigern</button>`
            : `<button class="btn-lg" onclick="diploWahl('frei')">🕊️ Neutral bleiben</button>`}
        </div>
      </div>`;
  },

  kriegAbbruch(){
    const kr = G._kr;
    const sperrer = kr.weg.filter(i=>!["atk","frei"].includes(kr.wahl[i])).map(i=>G.spieler[i].name).join(", ");
    return `
      <h2>Feldzug abgebrochen</h2>
      <div class="card">
        <p class="red" style="font-size:16px">Kein Durchkommen! ${sperrer} verweigert Euren Truppen
        den Durchmarsch, das Heer kehrt unverrichteter Dinge heim.</p>
        <p class="muted" style="margin-top:8px">Die Gelegenheit dieses Jahres ist vertan.</p>
      </div>
      <button class="btn-primary btn-lg" onclick="zeige('bauen')">Weiter</button>`;
  },

  belagerung(){
    const kr = G._kr;
    const ang = G.spieler[kr.a], ver = G.spieler[kr.d];
    const fest = festungsBonus(ver);
    return `
      <h2>🏰 Belagerung · ${ver.name}s Festungswerke</h2>
      <div class="card">
        <p><b class="cyan">${titelName(ver)} ${ver.name}</b> hat sich verschanzt:
          ${ver.mauer?`Stadtmauer Stufe ${ver.mauer}`:""}${ver.mauer&&ver.burg?" und ":""}${ver.burg?`Burg Stufe ${ver.burg}`:""}.
          Im offenen Feld kämpfen die Verteidiger dahinter mit <b>+${Math.round((fest-1)*100)} %</b> Stärke.</p>
        <p class="muted small" style="margin-top:6px">Wählt, wie Ihr die Festung brechen wollt, ${titelName(ang)} ${ang.name}:</p>
      </div>
      <div style="max-width:680px">
        <button class="btn-lg" onclick="belagerungWahl('sturm')" style="display:block;width:100%;text-align:left;margin:6px 0">
          ⚔️ <b>Sturmangriff</b>, sofort angreifen. Die Mauern stehen (voller Bonus), die ersten Sturmreihen erleiden Verluste.</button>
        <button class="btn-lg" onclick="belagerungWahl('beschuss')" ${ang.heer.art>=2?"":"disabled"} style="display:block;width:100%;text-align:left;margin:6px 0">
          💣 <b>Beschuss</b> ${ang.heer.art<2?'<span class="red small">(braucht mind. 2 Artillerie)</span>':""}. Breschen schießen:
          Mauerbonus stark geschwächt, gute Chance, einen Mauerring dauerhaft zu zerstören.</button>
        <button class="btn-lg" onclick="belagerungWahl('aushungern')" style="display:block;width:100%;text-align:left;margin:6px 0">
          ⏳ <b>Aushungern</b>, lange Belagerung: der Verteidiger verliert Korn und Volk, Miliz und Aufgebot kämpfen entkräftet,
          der Mauerbonus sinkt beinahe zur Hälfte.</button>
      </div>`;
  },

  verteidigung(){
    const a = naechsterAngriff();
    if(!a){ setTimeout(()=>beginneZugFortsetzen(), 10); return ""; }
    const ang = G.spieler[a.kr.a], ver = cur();
    const eigen = heerGroesse(ver.heer) + miliz(ver) + Math.round(ver.pop*0.02);
    const feind = heerGroesse(ang.heer);
    return `
      <div class="hero" style="padding-top:26px;padding-bottom:8px">
        <span class="crown">🚨</span>
        <h1 class="red" style="font-size:26px;margin:10px 0">Feindliche Heere im Anmarsch!</h1>
      </div>
      <div class="pergament" style="max-width:640px;margin:0 auto">
        <p style="font-size:16px;text-align:center"><b style="color:${ang.farbe}">${ang.wappen} ${titelName(ang)} ${ang.name}</b>
        ${ang.kiTyp ? `<span class="muted small">(${KI_TYP_NAMEN[ang.kiTyp]||"KI"})</span>` : ""}
        hat Euch den Krieg erklärt, seine Truppen stehen an Eurer Grenze.</p>
        <div class="zierlinie" style="margin:10px auto"></div>
        <table style="max-width:380px;margin:8px auto">
          <tr><td>Feindliches Heer</td><td class="r red">${fmt(feind)} Mann</td></tr>
          <tr><td>Eure Verteidiger <span class="muted small">(Heer + Miliz + Aufgebot)</span></td><td class="r">${fmt(eigen)} Mann</td></tr>
          ${(ver.mauer||0)>0 ? `<tr><td>Eure Festungswerke</td><td class="r green">🏰 +${Math.round((festungsBonus(ver)-1)*100)} % ${a.kr.mauerBruch ? '<span class="red small">(Breschen geschossen!)</span>' : a.kr.hunger ? '<span class="red small">(ausgehungert)</span>' : ""}</td></tr>` : ""}
        </table>
        <p class="muted small center" style="margin-top:6px">Stellt Eure Verteidiger auf die fünf Abschnitte,
        Ihr habt Heimvorteil, Miliz und Volksaufgebot an Eurer Seite.</p>
      </div>
      <div class="center" style="margin-top:14px">
        <button class="btn-danger btn-lg" onclick="verteidigungStarten()">🛡️ Zur Verteidigung!</button>
      </div>`;
  },

  aufstellungA(){
    const kr = G._kr;
    const p = G.spieler[kr.a];
    const helferA = kr.fragen.filter(i=>kr.wahl[i]==="atk");
    const A = seiteBauen(kr.a, helferA, false);
    G._aufE = { inf:A.inf, kav:A.kav, art:A.art, miliz:A.miliz, auf:0 };
    G._aufFarbe = p.farbe; G._aufRechts = false;
    return SCREENS._aufstellung(p, G.spieler[kr.d],
      `Stellt Eure ${fmt(A.inf+A.kav+A.art+A.miliz)} Mann auf den fünf Abschnitten auf.
       Die Artillerie feuert aus der Tiefe, Kavallerie stürmt schneller vor.
       Der Verteidiger kennt Eure Aufstellung nicht, und Ihr nicht seine.`,
      "aufstellungAFertig()", "Aufstellung befehlen");
  },

  aufstellungD(){
    const kr = G._kr;
    const p = G.spieler[kr.d];
    const helferD = kr.fragen.filter(i=>kr.wahl[i]==="def");
    const D = seiteBauen(kr.d, helferD, true);
    G._aufE = { inf:D.inf, kav:D.kav, art:D.art, miliz:D.miliz, auf:D.aufgebot };
    G._aufFarbe = p.farbe; G._aufRechts = true;
    return SCREENS._aufstellung(p, G.spieler[kr.a],
      `Geheime Aufstellung! ${titelName(G.spieler[kr.a])} ${G.spieler[kr.a].name} rückt gegen
       Euch vor, der Angreifer möge wegsehen. Verteilt Eure ${fmt(laneGroesse(G._aufE))} Mann
       (samt Miliz und Volksaufgebot) auf die fünf Abschnitte.`,
      "aufstellungDFertig()", "Stellung beziehen, zur Schlacht!");
  },

  turnier(){
    const t2 = G._turnier;
    if(!t2) { setTimeout(()=>zeige("bauen"), 10); return ""; }
    const ich = cur(), sieger = G.spieler[t2.sieger];
    const gewonnen = t2.sieger === G.aktiv;
    return `
      <div class="hero" style="padding-top:22px;padding-bottom:8px">
        <h2 style="font-size:24px">🏇 Das große Turnier zu ${ich.name}${/[sxz]$/.test(ich.name)?"’":"s"} Hof</h2>
      </div>
      <canvas id="tjost" width="920" height="240" style="display:block;width:100%;max-width:760px;margin:0 auto;border-radius:12px;border:1px solid var(--border)"></canvas>
      <div class="center" style="margin-top:12px">
        <p id="tjostText" class="muted">Die Reiter legen die Lanzen ein …</p>
        <div class="pergament" style="max-width:460px;margin:12px auto;padding:12px 18px;display:none" id="tjostErgebnis">
          <p style="font-size:17px"><b class="gold">${sieger.wappen} ${titelName(sieger)} ${sieger.name}</b> gewinnt die Tjost!</p>
          <p class="small" style="margin-top:4px">${gewonnen
            ? "Euer Volk jubelt (+5 Stimmung), und Eure Truppen üben sich am Rande des Turniers (+5 Erfahrung)."
            : `Alle geladenen Höfe verlassen das Fest wohlgesonnen (+4 Verhältnis), der Sieger fühlt sich geehrt.`}</p>
        </div>
        <button class="btn-primary btn-lg" onclick="G._turnier=null; zeige('bauen')">Zurück an den Hof</button>
      </div>`;
  },

  /* gemeinsames Aufstellungs-Formular */
  _aufstellung(p, gegner, text, fertigFn, knopf){
    const gel = (G._kr && G._kr.gelaende) || [];
    const zeilen = LANE_NAMEN.map((n,i)=>`
      <div class="sliderrow">
        <span>${n}${gel[i]&&gel[i].ico?` <span title="${gel[i].n}">${gel[i].ico}</span>`:""}</span>
        <input type="range" min="0" max="4" step="1" value="${G._aufW[i]}"
          oninput="aufstellungGewicht(${i}, this.value)">
        <span class="v" id="gw${i}" style="min-width:64px">${gewichtText(i)}</span>
      </div>`).join("");
    const presets = AUFSTELLUNGEN.map((a,k)=>
      `<button class="btn-sm ${a.g.join()===G._aufW.join()?'btn-primary':''}" data-preset="${k}"
        onclick="aufstellungPreset(${k})">${a.n}</button>`).join("");
    setTimeout(()=>zeichneAufstellung("aufVorschau", G._aufE, G._aufW, G._aufFarbe, G._aufRechts), 30);
    return `
      <h2>🗡️ Aufstellung · ${titelName(p)} ${p.name} gegen ${titelName(gegner)} ${gegner.name}</h2>
      <div class="card"><p class="small">${text}</p>
      <p class="muted small" style="margin-top:6px">Erkundetes Gelände:
        ⛰️ Hügel schützen den Verteidiger · 🌊 Furten bremsen den Vormarsch · 🌲 Wald behindert Kavallerie und Artillerie.</p>
      ${saison().n==="Winter"?`<p class="small" style="margin-top:4px;color:var(--red)">❄️ Winterfeldzug: der Anmarsch durch Schnee kostet die Angreifer vorab rund 4 % der Truppen.</p>`:""}</div>
      <div class="grid g2">
        <div class="card">
          <h3>Gewichtung der Abschnitte</h3>
          ${zeilen}
          <div style="margin-top:6px">${presets}</div>
          <div style="margin-top:12px">
            <span class="small">🥁 Reserve zurückhalten:</span>
            ${[0,0.2,0.35].map(rv=>`<button class="btn-sm ${(G._aufRes||0)===rv?'btn-primary':''}"
              onclick="aufstellungReserve(${rv})">${rv?Math.round(rv*100)+" %":"Keine"}</button>`).join("")}
          </div>
          <p class="muted small" style="margin-top:4px">Die Reserve (ohne Artillerie) rückt erst ein,
          wenn die eigene Linie wankt, und hebt dann die Moral. Bis dahin kämpft sie nicht mit.</p>
        </div>
        <div class="card">
          <h3>Vorschau Eurer Schlachtordnung</h3>
          <p class="muted small">Die Vorschau zeigt das Schlachtfeld wie im Gefecht:
          oberste Zeile = Nordflanke, unterste = Südflanke. Beide Seiten sehen dieselben Abschnitte.</p>
          <canvas id="aufVorschau" width="440" height="330" style="width:100%;border-radius:10px;border:1px solid var(--border)"></canvas>
          <p class="muted small">⚔️ Infanterie · große Punkte Kavallerie · blasse Punkte Miliz/Aufgebot · Quadrate Artillerie</p>
        </div>
      </div>
      <button class="btn-danger btn-lg" onclick="${fertigFn}">${knopf}</button>`;
  },

  schlacht(){
    const s = G._s, kr = G._kr;
    const ang = G.spieler[kr.a], ver = G.spieler[kr.d];
    const restA = sRest(s,"A"), restD = sRest(s,"D");
    const pctA = clamp(restA/s.startG.A*100,0,100);
    const pctD = clamp(restD/s.startG.D*100,0,100);
    const seite = (key, t, helfer, moral, wer) => `
      <div class="armee ${s.tick>0 && !s.fertig ? 'shake':''}">
        <h4>${t}</h4>
        <p class="muted small" style="margin:2px 0 6px">${RANG_ICO[heerRang(wer)]} ${RANG_NAMEN[heerRang(wer)]}${feldherrArt(wer)?` · ${feldherrArt(wer).ico} ${feldherrArt(wer).n}`:""}</p>
        <div class="u"><span>⚔️ Infanterie</span><b>${fmt(sRestTyp(s,key,"inf"))}</b></div>
        <div class="u"><span>🐎 Kavallerie</span><b>${fmt(sRestTyp(s,key,"kav"))}</b></div>
        <div class="u"><span>💣 Artillerie</span><b>${fmt(sRestTyp(s,key,"art"))}</b></div>
        <div class="u"><span>🛡️ Miliz</span><b>${fmt(sRestTyp(s,key,"miliz"))}</b></div>
        ${s.start[key].auf?`<div class="u"><span>🔥 Volksaufgebot</span><b>${fmt(sRestTyp(s,key,"auf"))}</b></div>`:""}
        ${s["res"+key]?`<div class="u"><span>🥁 in Reserve</span><b>${fmt(resGroesse(s["res"+key]))}</b></div>`:""}
        <div class="u muted small"><span>Moral</span><span>${Math.round(moral)} %</span></div>
        <div class="moral"><div style="width:${moral}%;background:${moral>60?'var(--green)':moral>32?'var(--gold)':'var(--red)'};${moral<=32?'animation:moralPuls .9s ease-in-out infinite;':''}"></div></div>
        ${helfer.length?`<p class="muted small" style="margin-top:6px">Verbündete: ${helfer.map(i=>G.spieler[i].name).join(", ")}</p>`:""}
      </div>`;
    return `
      <h2>⚔️ Schlacht um ${ver.name}s Land</h2>
      <span class="phasebadge">Gefecht ${Math.min(s.tick,s.maxTicks)}/${s.maxTicks}${s.regen?" · 🌧️ Regen: Artillerie geschwächt":""}${s.nebel?" · 🌫️ Nebel: Kanonen blind, rascher Vormarsch":""}${(s.festung||1)>1?` · 🏰 Festung ×${(s.festung||1).toFixed(2)}`:""}${s.belagerung?` · ${s.belagerung==="sturm"?"⚔️ Sturmangriff":s.belagerung==="beschuss"?"💣 nach Beschuss":"⏳ nach Aushungern"}`:""}</span>
      <canvas id="feld" width="900" height="380"></canvas>
      <div class="battlefield">
        <div>
          ${seite("A", `Angreifer: ${ang.name}`, s.helferA, s.moralA, ang)}
          <div class="strbar a"><div style="width:${pctA}%"></div></div>
          <p class="muted small center">Truppenstärke ${Math.round(pctA)} %</p>
        </div>
        <div class="vs">⚔️</div>
        <div>
          ${seite("D", `Verteidiger: ${ver.name}`, s.helferD, s.moralD, ver)}
          <div class="strbar d"><div style="width:${pctD}%"></div></div>
          <p class="muted small center">Truppenstärke ${Math.round(pctD)} %</p>
        </div>
      </div>
      <div class="card battlelog">${s.log.map(l=>`<p>${l}</p>`).join("")||'<p class="muted">Die Linien rücken vor …</p>'}</div>
      ${s.fertig
        ? `<div class="card" style="border-color:${s.sieger==='A'?'var(--green)':'var(--red)'}">
             <p class="${s.sieger==='A'?'green':'red'}" style="font-size:17px;font-weight:700">${s.ergebnis}</p>
             ${s.plünder?`<p class="small" style="margin-top:6px">🔥 ${s.plünder}</p>`:""}
             <table style="margin-top:10px">
               <tr><th></th><th class="r">Angreifer</th><th class="r">Verteidiger</th></tr>
               <tr><td>Ausgerückt</td><td class="r">${fmt(s.startG.A)}</td><td class="r">${fmt(s.startG.D)}</td></tr>
               <tr><td>Gefallen</td>
                   <td class="r red">${fmt(s.startG.A-restA)}</td>
                   <td class="r red">${fmt(s.startG.D-restD)}</td></tr>
             </table>
           </div>
           <button class="btn-primary btn-lg" onclick="schlachtWeiter()">Weiter</button>
           <button class="btn-lg" onclick="replayStarten()">🎞️ Replay ansehen</button>`
        : `<button class="btn-lg" onclick="schlachtUeberspringen()">Schlacht überspringen ⏩</button>`}`;
  },

  bilanz(){
    const p = cur(), r = p.report;
    const evHtml = r.ereignisse.length
      ? r.ereignisse.map(e=>`<div class="event ${e.c}">${e.t}</div>`).join("") : "";
    const row = (lbl,val,cls="") => `<tr><td>${lbl}</td><td class="r ${cls}">${val}</td></tr>`;
    return `
      ${stepper("Bilanz")}
      <h2>Jahresbilanz Anno ${G.jahr}</h2>
      <div style="position:relative;margin-bottom:10px">
        <canvas id="wetterBild" width="920" height="180" style="display:block;width:100%;border-radius:12px;border:1px solid var(--border)"></canvas>
        <div class="anno-pop" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.8)">
          <div style="font-family:Georgia,serif;font-weight:bold;font-size:clamp(20px,4.6vw,32px);color:#f2ecd9;text-align:center;padding:0 12px">${r.wetter.ico} ${r.wetter.t}</div>
          <div style="font-size:clamp(13px,3vw,17px);margin-top:6px;color:${r.wetter.f>=1.1?'var(--green)':r.wetter.f<=0.85?'var(--red)':'var(--gold)'}">Ernte-Ertrag ×${r.wetter.f.toFixed(2)}</div>
        </div>
      </div>
      ${evHtml}
      <div class="grid g2">
        <div class="card">
          <h3>Wirtschaft</h3>
          <table>
            ${row("Ernte ("+fmt(Math.min(p.pop*4,anbau(p)))+" ha bestellt)", `+<span data-cnt="${r.ernte}"> </span> Fuder`, "delta-pos")}
            ${row("Kornspeicher jetzt", fmt(p.korn)+" Fuder")}
            ${r.holzErtrag||r.steinErtrag?row("Forst & Steinbruch", "+"+fmt(r.holzErtrag||0)+" 🪵, +"+fmt(r.steinErtrag||0)+" 🪨", "delta-pos"):""}
            ${r.erfindung?row("⚙️ Erfindung des Ingenieurs", "Ernte kräftig gesteigert", "delta-pos"):""}
            ${r.auftragErfuellt?row(r.auftragErfuellt.ico+" Reichsauftrag „"+r.auftragErfuellt.n+"\u201C erfüllt", "+"+fmt(r.auftragErfuellt.lohn)+" Taler", "delta-pos"):""}
            ${r.auftragVerfallen?row(r.auftragVerfallen.ico+" Reichsauftrag „"+r.auftragVerfallen.n+"\u201C", "Frist verstrichen, der Hof ist verstimmt", "delta-neg"):""}
            ${row("Steuern & Wirtschaft", "+"+fmt(r.steuern)+" Taler", "delta-pos")}
            ${r.routenGeld?row("Zoll aus "+routenVon(G.spieler.indexOf(p)).length+" Handelsroute"+(routenVon(G.spieler.indexOf(p)).length>1?"n":""), "+"+fmt(r.routenGeld)+" Taler", "delta-pos"):""}
            ${r.unterhalt?row("Heer-Unterhalt", "−"+fmt(r.unterhalt)+" Taler", "delta-neg"):""}
            ${r.gehaelter?row("Berater-Gehälter", "−"+fmt(r.gehaelter)+" Taler", "delta-neg"):""}
            ${r.spione?row("🛡️ Gegenspione", "−"+fmt(r.spione)+" Taler", "delta-neg"):""}
            ${row("Vermögen jetzt", `<span data-cnt="${Math.round(p.geld)}" data-suf=" Taler">${fmt(p.geld)} Taler</span>`, p.geld<0?"red":"")}
          </table>
        </div>
        <div class="card">
          <h3>Reich</h3>
          <table>
            ${row("Untertanen", fmt(p.pop))}
            ${row("Stimmung", p.stimmung+"/100")}
            ${row("Städte", staedte(p))}
            ${row("Heer", fmt(heerGroesse(p.heer))+" Mann")}
          </table>
        </div>
      </div>
      ${r.ueberzeit>0?`<div class="event bad">Ihr habt ${Math.round(r.ueberzeit)} Sekunden zu lange regiert, die Sorgen nagen an Eurer Gesundheit.</div>`:""}
      <button class="btn-primary btn-lg" onclick="nachBilanz()">Weiter</button>`;
  },

  befoerderung(){
    const p = cur();
    if(p.titel===8){ G.sieger = p; mpSync(); }
    setTimeout(()=>{ konfetti(p.titel===8?140:70); (p.titel===8?sKroenung:sFanfare)(); }, 150);
    return `
      <div class="hero" style="padding-top:34px">
        <p class="gold" style="font-size:17px;letter-spacing:2px">🎺 Trompeten erschallen!</p>
        <div style="margin:18px auto 6px;width:220px">
          <canvas id="portraitB" width="220" height="272" style="border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.5)"></canvas>
        </div>
        <p class="muted small">${titelName(p)} ${p.name}, ${alterJahre(p)} Jahre, im neuen Ornat</p>
        <h1 style="font-size:30px;margin:14px 0">${p.name} wird zu${p.w?"r":"m"} <span class="gold">${titelName(p)}</span> erhoben!</h1>
        ${PRIVILEGIEN[p.titel] ? `
        <div class="pergament" style="max-width:480px;margin:6px auto 0;padding:14px 18px">
          <p class="gold" style="font-weight:700">${PRIVILEGIEN[p.titel].ico} Neues Privileg: ${PRIVILEGIEN[p.titel].n}</p>
          <p class="small" style="margin-top:4px">${PRIVILEGIEN[p.titel].d}</p>
        </div>` : ""}
        ${p.titel===8
          ? `<p class="green" style="font-size:16px">Die Kathedrale ist vollendet, das Reich hat einen neuen ${titelName(p)}!</p>
             <div style="margin-top:22px"><button class="btn-primary btn-lg" onclick="G._kroenStart=null; zeige('kroenung')">Zur Krönung</button></div>`
          : `<div style="margin-top:22px"><button class="btn-primary btn-lg" onclick="naechsterSpieler()">Weiter</button></div>`}
      </div>`;
  },

  tod(){
    const p = cur();
    return `
      <div class="hero" style="padding-top:36px">
        <span class="crown">🕯️</span>
        <h1 class="red" style="font-size:28px">Die Glocken läuten …</h1>
        <div style="width:170px;margin:16px auto 6px;filter:grayscale(.8) brightness(.8)">
          <canvas id="portraitT" width="170" height="210" style="border-radius:12px"></canvas>
        </div>
        <p style="font-size:17px;margin:12px 0">${titelName(p)} ${p.name} ist Anno ${G.jahr}
          im Alter von ${alterJahre(p)} Jahren verstorben.</p>
        <p class="muted">Höchster Rang: ${titelName(p)} · ${fmt(p.land)} ha · ${fmt(p.pop)} Untertanen</p>
        <div style="margin-top:22px">
          ${G.opt && G.opt.dynastie
            ? `<button class="btn-primary btn-lg" onclick="erben(cur()); zeige('handoff')">👶 ${p.erbe && (G.jahr-p.erbe.geb)>=14 ? `Thronfolge: ${p.erbe.name} (${G.jahr-p.erbe.geb} J.)` : "Erbfolge antreten"}</button>
               <p class="muted small" style="margin-top:8px">Der Erbstreit kostet 20 % des Vermögens, 8 % des Landes und eine Titelstufe.</p>`
            : ""}
          ${G.kampagne?`<button class="btn-lg" onclick="kampagneStartDirekt(G.kampagne.k)">📖 Kapitel erneut versuchen</button>`:""}
          <button class="btn-lg" onclick="naechsterSpieler()">${G.opt && G.opt.dynastie ? "Die Linie endet hier" : "Weiter"}</button>
        </div>
      </div>`;
  },

  sieg(){
    const p = G.sieger;
    G._fw = null;
    setTimeout(()=>{ konfetti(160); sKroenung(); }, 600);
    return `
      <canvas id="feuerwerk" width="920" height="500"
        style="position:absolute;left:50%;transform:translateX(-50%);max-width:96vw;pointer-events:none;opacity:.9"></canvas>
      <div class="hero" style="padding-top:30px;position:relative">
        <p class="gold zer z1" style="font-size:17px;letter-spacing:3px">DIE KRÖNUNG</p>
        <div class="zer z2" style="position:relative;width:240px;margin:14px auto 6px">
          <span class="krone-fall">👑</span>
          <canvas id="portraitK" width="240" height="296" style="border-radius:14px;box-shadow:0 14px 50px rgba(0,0,0,.55)"></canvas>
        </div>
        <h1 class="zer z3" style="font-size:34px;margin:14px 0">Heil ${p.w?"der Kaiserin":"dem Kaiser"} ${p.name}!</h1>
        <p class="zer z4" style="margin:10px 0">Anno ${G.jahr} · ${alterJahre(p)} Jahre · ${fmt(p.pop)} Untertanen · ${fmt(p.land)} ha · ${fmt(p.geld)} Taler</p>
        <div class="monu zer z4" style="margin:10px 0">${svgPalast(p.palast)}${svgDom(p.dom)}</div>
        <p class="muted zer z5">Vom einfachen ${p.w?"Fräulein":"Herrn"} zur Herrschaft über das Reich, das Spiel ist gewonnen.</p>
        <div class="zer z5" style="margin-top:22px"><button class="btn-primary btn-lg" onclick="zeige('ende')">Schlusswertung</button></div>
      </div>`;
  },

  welt(){
    const p = cur();
    const kk = kannKrieg(p);
    const ausBauen = G._vorWelt === "bauen";
    const nb = nachbarn(G.aktiv);
    const zeilen = G.spieler.map((s,i)=>{
      if(s===p) return "";
      const adj = nb.includes(i);
      const angriff = ausBauen && kk.ok && !s.tot
        ? `<button class="btn-danger btn-sm" onclick="angreifenAus(${i})">⚔️ Angreifen</button>`
        : "";
      const w = bezWert(p, s);
      return `<tr>
        <td><span class="dot" style="background:${s.farbe}"></span>${s.wappen} ${titelName(s)} ${s.name}${s.tot?" †":""}${s.ki?` <span class="muted small">(${KI_TYP_NAMEN[s.kiTyp]||"KI"})</span>`:""}</td>
        <td class="r">${fmt(s.land)} ha</td>
        <td class="r">${fmt(s.pop)}</td>
        <td class="r ${w>10?'green':w<-10?'red':''}">${w>0?"+":""}${w}${paktAktiv(p,s)?" 🕊️":""}</td>
        <td>${s.tot?"—":adj?'<span class="green">Nachbar</span>':'<span class="muted">Durchmarsch nötig</span>'}</td>
        <td class="r">${angriff}</td>
      </tr>`;
    }).join("");
    return `
      <h2>🗺️ Die bekannte Welt. Anno ${G.jahr}</h2>
      <div class="card">
        <canvas id="welt" width="920" height="430" onclick="weltKlick(event)" style="cursor:pointer"></canvas>
        <p class="muted small">Die Sitzreihenfolge bildet den Nachbarschaftskreis, blasse Wege verbinden
        Nachbarn, <span class="gold">goldene Wege mit Karawanen</span> sind aktive Handelsrouten (jährlicher
        Zoll für beide Seiten). Euer Reich trägt den goldenen Ring.</p>
      </div>
      <div class="card">
        <h3>Die Konkurrenz</h3>
        <table>
          <tr><th>Regent</th><th class="r">Land</th><th class="r">Untertanen</th><th class="r">Verhältnis</th><th>Lage</th><th></th></tr>
          ${zeilen}
        </table>
        ${!ausBauen?'<p class="muted small">Feldzüge lassen sich in der Bauphase beginnen (Landkarte &amp; Bauen → Gesamtkarte).</p>':
          !kk.ok?`<p class="muted small">Für einen Feldzug fehlt Euch noch: ${kk.fehlt.join(" · ")}.</p>`:""}
      </div>
      ${G._dossier!=null && G.spieler[G._dossier] ? (()=>{
        const d = G.spieler[G._dossier], di = G._dossier;
        if(di === G.aktiv) return `
        <div class="card" style="border-color:rgba(224,180,88,.5)">
          <h3>${d.wappen} Euer eigenes Reich</h3>
          <p class="small">${fmt(d.land)} ha · ${fmt(d.pop)} Untertanen · ${fmt(heerGroesse(d.heer))} Mann unter Waffen
            · ${staedte(d)} St${staedte(d)===1?"adt":"ädte"} · Routen: ${routenVon(di).length}/3</p>
        </div>`;
        const w = bezWert(p, d);
        const vertr = [
          buendnisAktiv(p,d) ? `🛡️ Bündnis bis ${p.buendnisse[di]}` : "",
          eheAktiv(p,d) ? `💍 Ehe bis ${p.ehen[di]}` : "",
          paktAktiv(p,d) ? `🕊️ Pakt bis ${p.pakte[di]}` : "",
          routeAktiv(G.aktiv,di) ? "🚚 Handelsroute" : ""
        ].filter(Boolean).join(" · ") || "keine Verträge";
        return `
        <div class="card" style="border-color:${d.farbe}66">
          <h3>${d.wappen} Dossier: ${titelName(d)} ${d.name}${d.tot?" †":""}
            ${d.ki?`<span class="muted small">(${KI_TYP_NAMEN[d.kiTyp]||"KI"})</span>`:""}</h3>
          <p class="small">${fmt(d.land)} ha · ${fmt(d.pop)} Untertanen · ${staedte(d)} St${staedte(d)===1?"adt":"ädte"}
            · Festung ${(d.mauer||0)}/${(d.burg||0)} (Mauer/Burg) · Titelstufe ${d.titel}</p>
          <p class="small" style="margin-top:4px">Verhältnis:
            <b class="${w>10?'green':w<-10?'red':''}">${w>0?"+":""}${w}</b> · ${vertr}</p>
          ${spionBericht(p, di) || '<p class="muted small">🕵️ Kein Geheimbericht. Ein Spion könnte Heer und Kasse ausspähen.</p>'}
          ${!d.tot?`<div class="rowflex" style="margin-top:8px">
            <button class="btn-sm" onclick="G._dipZielMerk=${di}; zeige('diplo')">🤝 Diplomatie mit ${d.name}</button>
            ${G._vorWelt==="bauen" && kk.ok ? `<button class="btn-danger btn-sm" onclick="angreifenAus(${di})">⚔️ Angreifen</button>`:""}
          </div>`:""}
        </div>`; })() : `<p class="muted small">💡 Klickt ein Reich auf der Karte an, um sein Dossier zu öffnen.</p>`}
      <button class="btn-primary btn-lg" onclick="weltZu()">Zurück</button>
      <button class="btn-lg" onclick="statAuf()">📈 Statistik</button>`;
  },

  ruhm(){
    const liste = ruhmesliste();
    const zeilen = liste.map((e,i)=>`
      <tr style="${i===0?'color:var(--gold);font-weight:700':''}">
        <td>${i+1}.</td>
        <td><span class="dot" style="background:${e.f||'#8b96a8'}"></span>${e.w||""} ${TITEL[e.t]?TITEL[e.t][e.g?1:0]:""} ${e.n}</td>
        <td class="r">Anno ${e.j}</td>
        <td class="r">${fmt(e.s)}</td>
        <td class="r muted small">${e.d||""}</td>
      </tr>`).join("");
    return `
      <h2>🏆 Ruhmeshalle</h2>
      ${liste.length ? `
      <div class="card">
        <table>
          <tr><th></th><th>Regent</th><th class="r">Endjahr</th><th class="r">Punkte</th><th class="r">Datum</th></tr>
          ${zeilen}
        </table>
      </div>
      <p class="muted small">Die zehn ruhmreichsten Regentschaften auf diesem Gerät.</p>`
      : `<div class="card"><p class="muted">Noch keine vollendete Regentschaft, die Geschichte wartet auf Euch.</p></div>`}
      <button class="btn-primary btn-lg" onclick="zeige(G._vorRuhm || 'title')">Zurück</button>`;
  },

  hilfe(){
    return `
      <h2>❓ Spielhilfe</h2>
      <div class="grid g2">
        <div class="card">
          <h3>Ziel & Aufstieg</h3>
          <p class="small">Steigt in 8 Beförderungen vom Herrn zum Kaiser auf. Jede Stufe verlangt
          Einwohner, Bauwerke oder Vermögen (im Status stets angezeigt), und einen positiven
          Kontostand. Für den Kaiser braucht Ihr die vollendete Kathedrale, 5 Städte,
          25.000 ha und 100.000 Taler. Eure Lebenszeit ist begrenzt; wer über 90 Sekunden
          pro Zug braucht, altert schneller.</p>
        </div>
        <div class="card">
          <h3>Wirtschaft</h3>
          <p class="small">Gebt dem Volk mehr als das nötige Korn, das lockt Einwanderer.
          Kauft Korn und Land billig, verkauft teuer (10 % Provision). Märkte bringen
          Steuern und Miliz, Mühlen steigern die Ernte, Städte (5 Märkte + 3 Mühlen)
          kurbeln die Wirtschaft kräftig an. Achtung: Bebauung verringert die Anbaufläche,
          und das Wetter macht jede Ernte zum Glücksspiel.</p>
        </div>
        <div class="card">
          <h3>Steuern & Volk</h3>
          <p class="small">Zölle, Einkommen- und Mehrwertsteuer füllen die Kasse, drücken aber
          die Stimmung, unzufriedene Untertanen wandern ab, hungernde sterben. Die Justiz
          wirkt ebenso auf die Stimmung. Hohe Stimmung bedeutet Geburten und Zuzug.</p>
        </div>
        <div class="card">
          <h3>Krieg & Diplomatie</h3>
          <p class="small">Ab Baron dürft Ihr Krieg führen. Unterhaltet ein stehendes Heer
          (der Sold steigt mit dem Rang). Die Sitzreihenfolge ist der Nachbarschaftskreis.
          Nicht-Nachbarn erreicht Ihr nur mit Durchmarschrechten. Vor der Schlacht stellen

/* ---------- Aktionen ---------- */
function setupAnzahl(){
  const n = +$("#anz").value;
  for(let i=0;i<9;i++){
    const on = i<n;
    $("#prow"+i).style.opacity = on?1:.3;
    $("#pname"+i).disabled = !on;
    $("#pw"+i).disabled = !on;
    $("#pki"+i).disabled = !on;
    if($("#pwap"+i)) $("#pwap"+i).disabled = !on;
    if($("#pfarbe"+i)) $("#pfarbe"+i).disabled = !on;
  }
}
/* Live-Vorschau des Wappenschilds im Setup */
function setupVorschau(i){
  const schild = $("#pschild"+i);
  if(!schild) return;
  const w2 = wappenFrei()[+($("#pwap"+i)?$("#pwap"+i).value:i)] || WAPPEN[i];
  const f2 = FARBEN[+($("#pfarbe"+i)?$("#pfarbe"+i).value:i)] || FARBEN[i];
  schild.textContent = w2;
  schild.style.borderColor = f2;
  schild.style.boxShadow = `inset 0 0 9px ${f2}55`;
}
function setupStart(){
  const n = +$("#anz").value;
  const namen=[], w=[], kis=[], wapArr=[], farbArr=[];
  for(let i=0;i<n;i++){
    namen.push(($("#pname"+i).value.trim()||("Spieler "+(i+1))));
    w.push($("#pw"+i).value==="1");
    kis.push($("#pki"+i).value==="1");
    wapArr.push(wappenFrei()[+($("#pwap"+i)?$("#pwap"+i).value:i)] || WAPPEN[i]);
    farbArr.push(FARBEN[+($("#pfarbe"+i)?$("#pfarbe"+i).value:i)] || FARBEN[i]);
  }
  if(kis.every(k=>k)){ alertMsg("Mindestens ein Reich braucht einen menschlichen Regenten."); return; }
  starteSpiel(n, namen, w, +$("#tempo").value, kis, {
    vergleich: $("#optVergleich").checked,
    tutorial:  $("#optTutorial").checked,
    diff: +$("#diff").value,
    szenario: $("#szenario").value,
    dynastie: $("#optDynastie").checked,
    wappen: wapArr, farben: farbArr
  });
}
function kornAusgeben(){
  const p = cur();
  const a = clamp(Math.floor(+$("#ausg").value||0), 0, p.korn);
  p.ausgabe = a; p.korn -= a;
  zeige("handel");
}
function handelFertig(){
  zwischenbilanz(cur());
  zeige("zwbilanz");
}
function nachZwischenbilanz(){
  if(cur().tot){ naechsterSpieler(); return; }
  const folge = faelligeFolge(cur());
  if(folge){ G._ereignis = folge; zeige("entscheidung"); return; }
  const e = ereignisWuerfeln(cur());
  if(e){ G._ereignis = e; zeige("entscheidung"); }
  else zeige("steuern");
}
function handelKorn(dir){
  const p = cur();
  if(dir>0){
    const m = Math.floor(+$("#kkauf").value||0);
    const kosten = m*p.kornPreis;
    if(m<=0) return;
    if(kosten>p.geld){ $("#hmsg").textContent="Zu wenig Taler!"; return; }
    p.geld -= kosten; p.korn += m; sMuenze();
    if(G.lehre && G.aktiv === 0) G.lehre.flags.gehandelt = true;
    G.marktDruck = (G.marktDruck||0) - m;
  } else {
    const m = clamp(Math.floor(+$("#kverk").value||0),0,p.korn);
    if(m<=0) return;
    let provision = p.haefen > 0 ? 0.95 : 0.9;     /* Häfen halbieren die Provision */
    if(p.zug === "haendlerisch") provision = Math.min(0.99, provision + 0.03);
    p.korn -= m; p.geld += Math.round(m*p.kornPreis*provision); sMuenze();
    G.marktDruck = (G.marktDruck||0) + m;
    p.stat.kornErloes += Math.round(m*p.kornPreis*provision);
    if(p.kornPreis >= 300) erfolg("spekulant");
  }
  render();
}
function handelLand(dir){
  const p = cur();
  if(dir>0){
    const wunsch = Math.floor(+$("#lkauf").value||0);
    if(wunsch<=0) return;
    if(wunsch > (p.landAngebot||0)){
      $("#hmsg").textContent = `Der Markt bietet heuer nur ${fmt(p.landAngebot||0)} ha an!`;
      return;
    }
    const m = wunsch;
    const kosten = m*p.landPreis;
    if(kosten>p.geld){ $("#hmsg").textContent="Zu wenig Taler!"; return; }
    p.geld -= kosten; p.land += m; p.landAngebot -= m; sMuenze();
    if(G.lehre && G.aktiv === 0) G.lehre.flags.gehandelt = true;
    if(p.land >= 25000) erfolg("land");
  } else {
    const m = clamp(Math.floor(+$("#lverk").value||0),0,freiLand(p));
    if(m<=0) return;
    const prov = hatPrivileg(p,2) ? 0.95 : 0.9;        /* Landgräfliches Marktrecht */
    p.land -= m; p.geld += Math.round(m*p.landPreis*prov); sMuenze();
    p.landAngebot = (p.landAngebot||0) + m;            /* verkauftes Land kommt in den Markt */
  }
  render();
}
function handelMaterial(art, dir){
  const p = cur();
  const feld = art === "holz" ? "#hkauf" : "#skauf";
  const preis = art === "holz" ? (p.holzPreis||12) : (p.steinPreis||20);
  const m = Math.floor(+$(feld).value||0);
  if(m<=0) return;
  if(dir>0){
    const kosten = m*preis;
    if(kosten>p.geld){ $("#hmsg").textContent="Zu wenig Taler!"; return; }
    p.geld -= kosten; p[art] = (p[art]||0) + m; sMuenze();
  } else {
    const echt = Math.min(m, p[art]||0);
    if(echt<=0) return;
    p[art] -= echt; p.geld += Math.round(echt*preis*0.5); sMuenze();
  }
  render();
}

function karteKlick(ev){
  const p = cur();
  const c = document.getElementById("karte");
  if(!c) return;
  if(!G._bauModus){ G._karteGross = !G._karteGross; render(); return; }
  /* Klick-Position in Territoriumskoordinaten umrechnen (wie in zeichneKarte) */
  const rect = c.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (c.width / rect.width);
  const y = (ev.clientY - rect.top) * (c.height / rect.height);
  const W = c.width, H = c.height;
  const cx = W/2, cy = H/2 + 8;
  const rr = territoriumsRadius(p.land) * (H/430);
  const dx = (x - cx) / (rr * 1.25), dy = (y - cy) / (rr * 0.75);
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > 0.92){ toast("⚠️ Dieser Platz liegt außerhalb Eures Territoriums.", 3000); return; }
  const typ = G._bauModus === "markt" ? "m" : "k";
  const kosten = bauKosten(p, G._bauModus);
  if(p.geld < kosten || !hatMaterial(p, G._bauModus)) { G._bauModus = null; render(); return; }
  p.geld -= kosten;
  zahleMaterial(p, G._bauModus);
  if(typ==="m") p.maerkte++; else p.muehlen++;
  if(p._ruinen > 0){ p._ruinen--; toast("🧹 Eine Brandruine ist wieder aufgebaut."); }
  p.gebaeude.push({ t:typ, ang:Math.atan2(dy, dx), dist:clamp(dist, 0.08, 0.9) });
  p._neu = p.gebaeude.length - 1;
  p.stat.bauten++;
  if(staedte(p)>=1) erfolg("stadt");
  G._bauModus = null;
  sMuenze();
  render();
}
function platziereGebaeude(p, typ){

  p.gebaeude.push({ t:typ, ang:Math.random()*6.2832, dist:0.34 + Math.random()*0.58 });

function entferneGebaeude(p, typ){

}
function baue(was){
  const p = cur();
  const platz = (p.maerkte+p.muehlen) < bauplaetze(p);
  /* Markt & Mühle: erst wählen, dann auf die Karte klicken */
  if((was==="markt" || was==="muehle") && G.screen==="bauen" && !p.ki){
    const kosten = bauKosten(p, was);
    if(p.geld < kosten || !platz || !hatMaterial(p, was)) return;
    G._bauModus = (G._bauModus === was) ? null : was;
    if(G._bauModus) toast(`🏗️ Klickt auf die Karte, um den Bauplatz für ${was==="markt"?"den Markt":"die Mühle"} zu wählen.`, 3500);
    render();
    return;
  }
  const bk = w2 => bauKosten(p, w2);
  if(was==="markt"  && p.geld>=bk("markt")  && platz && hatMaterial(p,"markt")){ p.geld-=bk("markt"); zahleMaterial(p,"markt"); p.maerkte++; platziereGebaeude(p,"m"); if(p._ruinen>0){ p._ruinen--; toast("🧹 Eine Brandruine ist wieder aufgebaut."); } }
  if(was==="muehle" && p.geld>=bk("muehle") && platz && hatMaterial(p,"muehle")){ p.geld-=bk("muehle"); zahleMaterial(p,"muehle"); p.muehlen++; platziereGebaeude(p,"k"); if(p._ruinen>0){ p._ruinen--; toast("🧹 Eine Brandruine ist wieder aufgebaut."); } }
  if(was==="palast" && p.palast<PALAST_TEILE && p.geld>=bk("palastTeil") && p.land>=LAND.palast && hatMaterial(p,"palastTeil")){ p.geld-=bk("palastTeil"); zahleMaterial(p,"palastTeil"); p.palast++; p._neu="palast"; }
  if(was==="dom"    && p.dom<DOM_TEILE && p.geld>=bk("domTeil") && p.land>=LAND.dom && hatMaterial(p,"domTeil")){ p.geld-=bk("domTeil"); zahleMaterial(p,"domTeil"); p.dom++; p._neu="dom"; }
  if(was==="hafen"  && (p.haefen||0)<2 && p.geld>=bk("hafen") && p.land>=12000 && hatMaterial(p,"hafen")){ p.geld-=bk("hafen"); zahleMaterial(p,"hafen"); p.haefen=(p.haefen||0)+1; p._neu="hafen"; }
  if(was==="forst"  && (p.forst||0)<FORST_MAX && p.geld>=bk("forst") && p.land>=3000){ p.geld-=bk("forst"); p.forst=(p.forst||0)+1; platziereGebaeude(p,"f"); }
  if(was==="bruch"  && (p.bruch||0)<BRUCH_MAX && p.geld>=bk("bruch") && p.land>=5000 && hatMaterial(p,"bruch")){ p.geld-=bk("bruch"); zahleMaterial(p,"bruch"); p.bruch=(p.bruch||0)+1; platziereGebaeude(p,"s"); }
  if(was==="mauer"  && (p.mauer||0)<MAUER_MAX && p.geld>=bk("mauer") && p.maerkte>=2 && hatMaterial(p,"mauer")){ p.geld-=bk("mauer"); zahleMaterial(p,"mauer"); p.mauer=(p.mauer||0)+1; p._neu="mauer"; if(p.mauer>=MAUER_MAX) erfolg("festung"); }
  if(was==="burg"   && (p.burg||0)<BURG_MAX && p.geld>=bk("burg") && (p.mauer||0)>=1 && p.land>=8000 && hatMaterial(p,"burg")){ p.geld-=bk("burg"); zahleMaterial(p,"burg"); p.burg=(p.burg||0)+1; p._neu="burg"; erfolg("festung"); }
  p.stat.bauten++;
  if(staedte(p)>=1) erfolg("stadt");
  if(p.palast>=PALAST_TEILE) erfolg("palast");
  if(p.dom>=DOM_TEILE) erfolg("dom");
  sMuenze();
  render();
}
function werbe(art, n){
  const p = cur();
  const kosten = KOSTEN[art]*n;
  if(p.geld < kosten) return;
  const alt = heerGroesse(p.heer);
  p.geld -= kosten; p.heer[art] += n; sMuenze();
  /* Frische Rekruten verwässern die Kampferfahrung des Heeres */
  if(alt > 0) p.heerXp = (p.heerXp||0) * alt / (alt + n);
  render();
}

function turnierStarten(){
  const p = cur();
  if(p.turnierJahr === G.jahr){ alertMsg("Heuer fand bereits ein Turnier statt."); return; }
  if(p.titel < 2){ alertMsg("Ein Turnier ziemt sich erst ab dem Rang Graf."); return; }
  if(p.geld < 2000){ alertMsg("Tribünen, Preise und Bankett kosten 2.000 Taler."); return; }
  p.geld -= 2000;
  p.turnierJahr = G.jahr;
  const gaeste = lebende().map(x=>x.p).filter(z=>z!==p);
  gaeste.forEach(z=>bezAendern(p, z, 4));
  const teilnehmer = [p].concat(gaeste);
  const staerke = z => (z.heer.kav||0)*2 + heerGroesse(z.heer)*0.1
    + (feldherrArt(z) ? 30*feldherrSkala(z) : 0) + (z.zug==="kriegerisch"?20:0) + rf(0, 60);
  let sieger = teilnehmer[0], best = -1;
  for(const z of teilnehmer){ const s2 = staerke(z); if(s2 > best){ best = s2; sieger = z; } }
  if(sieger === p){
    p.stimmung = clamp(p.stimmung + 5, 5, 100);
    p.heerXp = clamp((p.heerXp||0) + 5, 0, 100);
    geschichte("🏇", `${p.name} richtet ein Turnier aus und gewinnt die Tjost vor allen Höfen!`);
  } else {
    bezAendern(p, sieger, 3);
    geschichte("🏇", `${p.name} richtet ein Turnier aus, ${sieger.name} gewinnt die Tjost.`);
  }
  G._turnier = { gast: G.spieler.indexOf(sieger === p ? (gaeste[0]||p) : sieger),
                 sieger: G.spieler.indexOf(sieger), start: performance.now() };
  sTrommel();
  zeige("turnier");
}

function chronikExport(){
  const eintraege = (G.geschichte||[]).slice(-40);
  const W = 840, H = 150 + eintraege.length*26;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#1a2233"); bg.addColorStop(1,"#0e1117");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#e0b458"; ctx.lineWidth = 3; ctx.strokeRect(8,8,W-16,H-16);
  ctx.fillStyle = "#e0b458"; ctx.font = "bold 30px Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText("👑 KAISER. Chronik der Partie", W/2, 52);
  ctx.fillStyle = "#8b96a8"; ctx.font = "14px Georgia, serif";
  ctx.fillText(`1700–${G.jahr} · ${G.spieler.map(p=>p.name).join(" · ")}`, W/2, 78);
  ctx.strokeStyle = "#2a3446"; ctx.beginPath(); ctx.moveTo(40,94); ctx.lineTo(W-40,94); ctx.stroke();
  ctx.textAlign = "left"; ctx.font = "14px sans-serif";
  eintraege.forEach((e,i)=>{
    const y = 120 + i*26;
    ctx.fillStyle = "#e0b458"; ctx.fillText(String(e.j), 40, y);

  });
  const a = document.createElement("a");

   rundenbasierte Zustands-Synchronisation
   ============================================================ */
/* Eingebettete Vorschauen (z. B. Artefakt-Sandbox) sperren WebSocket-Verbindungen */
function inSandbox(){
  try{
    const h = location.hostname || "";
    return /claudeusercontent|claude\.ai|sandpack|webcontainer/i.test(h);
  }catch(e){ return false; }
}
/* Erreichbarkeits-Ampel für den Online-Bildschirm */
function serverPing(){
  const jetzt = Date.now();
  if(G._srvPingZeit && jetzt - G._srvPingZeit < 30000) return;
  G._srvPingZeit = jetzt;
  const url = ($("#mpUrl") && $("#mpUrl").value.trim()) || G._mpUrlMerk || MP_STANDARD;
  if(url.indexOf("wss://") !== 0){ G._srvStatus = "ok"; return; }
  G._srvStatus = "weckt";
  fetch(url.replace("wss://","https://"), { mode:"no-cors" })
    .then(()=>{ G._srvStatus = "ok"; if(G.screen === "online") render(); })
    .catch(()=>{ G._srvStatus = "fehler"; if(G.screen === "online") render(); });
}
const MP_STANDARD = (location.protocol.indexOf("http")===0 &&
  ["localhost","127.0.0.1"].includes(location.hostname))
  ? "ws://localhost:8081"
  : "wss://kaiser-mp.onrender.com";
let MP = null;

/* Verbindungsaufbau mit Aufweck-Ping und automatischen Wiederholungen:
   Gratis-Server schlafen bei Inaktivität und brauchen bis zu einer Minute. */
function mpVerbinden(url, beiOffen){
  const ziel = (url && url.trim()) || MP_STANDARD;
  try{
    if(ziel.indexOf("wss://") === 0)
      fetch(ziel.replace("wss://","https://"), { mode:"no-cors" }).catch(()=>{});
  }catch(e){}
  let versuch = 0;
  const WARTEN = [0, 7000, 15000, 30000];
  const naechster = () => {
    if(!MP || MP.abbruch) return;
    versuch++;
    if(versuch > 4){
      alertMsg(
        `<b>Keine Verbindung zum Spielserver.</b><br><span class="small">Checkliste:
        1) Habt Ihr Internet? ·
        ${inSandbox() ? "2) <b>Ihr seid in einer eingebetteten Vorschau, dort sind Verbindungen gesperrt. Öffnet die Spiel-Adresse direkt im Browser!</b> ·" : ""}
        3) Alle nutzen dieselbe Server-Adresse (Standard: ${MP_STANDARD}) ·
        4) Der Gratis-Server braucht nach längerer Pause bis zu einer Minute zum Aufwachen, gleich noch einmal versuchen ·
        5) Jeder Mitspieler braucht einen eigenen Regentennamen.</span>`, 15000);
      MP = null;
      return;
    }
    if(versuch > 1) toast(`🌐 Server wird geweckt. Versuch ${versuch}/4 …`, 6500);
    let offen = false;
    let ws;
    try{ ws = new WebSocket(ziel); }
    catch(e){ alertMsg("WebSocket nicht verfügbar, in dieser Umgebung ist Online-Spiel womöglich blockiert. Nutzt die Spiel-URL im Browser."); MP = null; return; }
    ws.onopen = () => { offen = true; if(MP){ MP.ws = ws; beiOffen(ws); toast("🌐 Mit dem Spielserver verbunden."); } };
    ws.onmessage = ev => { try{ mpNachricht(JSON.parse(ev.data)); }catch(e){} };
    ws.onerror = () => {};
    ws.onclose = () => {
      if(offen){ if(MP && MP.aktiv) alertMsg("Verbindung zum Spielserver verloren."); return; }
      setTimeout(naechster, WARTEN[Math.min(versuch, WARTEN.length-1)]);
    };
  };
  naechster();
}
function mpHost(){
  const url = $("#mpUrl") ? $("#mpUrl").value : "";
  const name = ($("#mpName").value.trim() || "Gastgeber");
  const pass = $("#mpPass") ? $("#mpPass").value.trim() : "";

  MP = { name, host:true, roster:[], code:null, id:null, aktiv:false };

  mpVerbinden(url, ws => ws.send(JSON.stringify({t:"beitritt", code, name, pass, zuschauer: !!zuschauer})));
}
/* Merkliste laufender Partien auf diesem Gerät */
function meinePartien(){
  try{ return JSON.parse(window.localStorage.getItem("kaiser_partien")||"[]"); }catch(e){ return []; }
}
function partieMerken(){
  if(!MP || !MP.code || MP.zuschauer) return;
  const liste = meinePartien().filter(x => x.code !== MP.code);
  liste.unshift({ code: MP.code, name: MP.name, url: ($("#mpUrl") && $("#mpUrl").value.trim()) || "", zeit: Date.now() });
  try{ window.localStorage.setItem("kaiser_partien", JSON.stringify(liste.slice(0,6))); }catch(e){}
}
function partieVergessen(code){
  try{ window.localStorage.setItem("kaiser_partien", JSON.stringify(meinePartien().filter(x=>x.code!==code))); }catch(e){}
  render();
}
function partieFortsetzen(code){
  const e = meinePartien().find(x=>x.code===code);
  if(!e) return;
  G._mpUrlMerk = e.url || "";
  mpBeitritt(false, e.code, e.name);
}
/* Partien-Browser: öffentliche Räume vom Server holen */
function partienAuf(){
  G._vorPartien = G.screen;
  G._partienListe = null;
  /* Server-Adresse VOR dem Bildschirmwechsel lesen, danach ist das Feld weg */
  G._mpUrlMerk = ($("#mpUrl") && $("#mpUrl").value.trim()) || G._mpUrlMerk || "";
  zeige("partien");
  try{
    const url = G._mpUrlMerk || MP_STANDARD;
    if(url.indexOf("wss://") === 0) fetch(url.replace("wss://","https://"), {mode:"no-cors"}).catch(()=>{});
    const ws = new WebSocket(url);
    ws.onopen = () => ws.send(JSON.stringify({t:"raeume"}));
    ws.onmessage = ev => {
      try{
        const m = JSON.parse(ev.data);
        if(m.t === "raeume"){ G._partienListe = m.liste || []; if(G.screen==="partien") render(); ws.close(); }
      }catch(e){}
    };
    ws.onerror = () => { G._partienListe = "fehler"; if(G.screen==="partien") render(); };
  }catch(e){ G._partienListe = "fehler"; render(); }
}
function partieBeitreten(code, zuschauer){
  const name = ($("#pbName") && $("#pbName").value.trim()) || "";
  if(!name){ alertMsg("Bitte erst Euren Regentennamen eintragen."); return; }
  mpBeitritt(zuschauer, code, name);
}
function einladungKopieren(){
  if(!MP || !MP.code) return;
  const istWeb = location.protocol.indexOf("http") === 0;
  const adresse = istWeb ? (location.origin + location.pathname) : "eure Kaiser-Spieladresse";
  const text = `Spielt Kaiser mit mir! Öffnet ${adresse} im Browser, wählt „Online spielen" und tretet mit dem Raum-Code ${MP.code} bei. Wählt einen eigenen Regentennamen.`;
  const fallback = () => { try{ window.prompt("Einladung zum Kopieren:", text); }catch(e){} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>toast("📋 Einladung kopiert! Schickt sie Euren Mitspielern."))
      .catch(fallback);
  } else fallback();
}
function mpVerlassen(){
  if(MP){ MP.abbruch = true; MP.aktiv = false; if(MP.ws){ try{ MP.ws.close(); }catch(e){} } }
  MP = null;
  G.spieler = [];
  zeige("title");
}
function mpNachricht(m){
  if(!MP) return;
  if(m.t === "raum"){
    MP.code = m.code; MP.id = m.id; MP.roster = m.roster;
    const ich = (m.roster||[]).find(r=>r.id===m.id);
    if(ich) MP.host = !!ich.host && !MP.zuschauer;
    partieMerken();
    zeige("lobby");
  }
  else if(m.t === "roster"){
    MP.roster = m.roster;
    /* Rückkehrer: wieder verbundene Namen aus der Getrennt-Liste streichen */
    if(MP.aktiv && MP.zuordnung){
      MP.getrennt = MP.getrennt || {};
      const da = new Set((m.roster||[]).map(r=>r.name));
      for(const idx of Object.keys(MP.getrennt))
        if(da.has(MP.zuordnung[idx])) delete MP.getrennt[idx];
    }
    if(G.screen === "lobby" || G.screen === "warten") render();
  }
  else if(m.t === "fehler"){ alertMsg("<b>Der Spielserver meldet:</b> " + m.text, 9000); }
  else if(m.t === "start"){ mpStartEmpfangen(m); }
  else if(m.t === "sync"){ mpSyncEmpfangen(m); }
  else if(m.t === "weg"){
    MP.getrennt = MP.getrennt || {};
    if(MP.zuordnung && m.name){
      for(const [idx, wer] of Object.entries(MP.zuordnung))
        if(wer === m.name && G.spieler[+idx] && !G.spieler[+idx].ki) MP.getrennt[+idx] = true;
    }
    toast("⚠️ Ein Mitspieler hat die Verbindung verloren, er kann jederzeit mit Code und Namen zurückkehren." + (MP.host?" Oder Ihr übergebt sein Reich der KI.":""));
    if(G.screen === "warten" || G.screen === "lobby") render();
  }
  else if(m.t === "rangliste"){
    G._weltrang = m.liste || [];
    if(G.screen === "weltrang") render();
  }
  else if(m.t === "chat"){
    MP.chat = (MP.chat || []).concat({ name: m.name, text: m.text }).slice(-30);
    if(G.screen === "lobby" || G.screen === "warten") render();
    else toast(`💬 <b>${m.name}:</b> ${m.text}`, 5000);
  }
}
/* Weltrangliste vom Server holen (eigene Kurzverbindung) */
function weltrangAuf(){
  G._vorRang = G.screen;
  G._weltrang = null;
  zeige("weltrang");
  if(MP && MP.ws && MP.ws.readyState === 1){
    try{ MP.ws.send(JSON.stringify({t:"rangliste"})); }catch(e){}
    return;
  }
  try{
    const url = ($("#mpUrl") && $("#mpUrl").value.trim()) || MP_STANDARD;
    if(url.indexOf("wss://") === 0) fetch(url.replace("wss://","https://"), {mode:"no-cors"}).catch(()=>{});
    const ws = new WebSocket(url);
    ws.onopen = () => ws.send(JSON.stringify({t:"rangliste"}));
    ws.onmessage = ev => {
      try{
        const m = JSON.parse(ev.data);
        if(m.t === "rangliste"){ G._weltrang = m.liste || []; if(G.screen==="weltrang") render(); ws.close(); }
      }catch(e){}
    };
    ws.onerror = () => { G._weltrang = "fehler"; if(G.screen==="weltrang") render(); };
  }catch(e){ G._weltrang = "fehler"; render(); }
}
function ergebnisMelden(){
  /* beste menschliche Leistung an die Weltrangliste melden (nur online) */
  if(!MP || !MP.ws || MP.ws.readyState !== 1 || !MP.host) return;
  for(const p of G.spieler){
    if(p.ki) continue;
    try{ MP.ws.send(JSON.stringify({t:"ergebnis", name:p.name, wappen:p.wappen, titel:p.titel, jahr:G.jahr, punkte:Math.round(score(p))})); }catch(e){}
  }
}
function chatSenden(){
  const feld = $("#chatText");
  if(!MP || !MP.ws || !feld) return;
  const text = feld.value.trim().substring(0, 200);
  if(!text) return;
  MP.chat = (MP.chat || []).concat({ name: MP.name, text }).slice(-30);
  try{ MP.ws.send(JSON.stringify({ t:"chat", name: MP.name, text })); }catch(e){}
  feld.value = "";
  render();
  setTimeout(()=>{ const f=$("#chatText"); if(f) f.focus(); }, 50);
}
function chatBox(){
  if(!MP) return "";
  const zeilen = (MP.chat || []).map(c=>`<p class="small" style="padding:1px 0"><b>${c.name}:</b> ${c.text}</p>`).join("");
  return `
    <div class="card" style="max-width:640px;margin:14px auto 0">
      <h3>💬 Feldpost</h3>
      <div class="battlelog" style="max-height:130px">${zeilen || '<p class="muted small">Noch keine Nachrichten.</p>'}</div>
      <div class="rowflex" style="margin-top:8px">
        <input type="text" id="chatText" maxlength="200" placeholder="Nachricht …" style="flex:1;min-width:120px"
          onkeydown="if(event.key==='Enter'){event.preventDefault();chatSenden();}">
        <button class="btn-sm" onclick="chatSenden()">Senden</button>
      </div>
    </div>`;
}
function kiUebernehmen(idx){
  const p = G.spieler[idx];
  if(!p || p.ki) return;
  p.ki = true;
  p.kiTyp = "baumeister";
  /* Offene Angriffe gegen diesen Sitz werden still ausgefochten */
  const offene = (G._angriffe||[]).filter(x => x.kr.d === idx);
  G._angriffe = (G._angriffe||[]).filter(x => x.kr.d !== idx);
  for(const a of offene){ try{ kiSchlacht(a.kr.a, idx); }catch(e){} }
  if(MP){ MP.zuordnung[idx] = null; if(MP.getrennt) delete MP.getrennt[idx]; }
  toast(`🤖 ${titelName(p)} ${p.name} wird fortan von der KI regiert.`);
  const pend = G._pend;
  if(pend && pend.fuer === idx){
    G._pend = null;
    if(pend.typ === "diplo"){
      const kr = G._kr;
      kr.wahl[kr.fragen[kr.frageIdx]] = kiDiploWahl(p, kr);
      kr.frageIdx++;
      diploWeiter();
    } else if(pend.typ === "aufD"){
      G._kr.aufD = kiAufstellung(G.spieler[G._kr.d].heer);
      if(mpMein(G._kr.a)) schlachtStarten(); else mpPend("schlacht", G._kr.a);
    } else if(pend.typ === "schlacht" || pend.typ === "schlachtplan" || pend.typ === "belagerung" || pend.typ === "kriegAbbruch"){
      G.spieler[G._kr.a].kriegGefuehrt = true;
      naechsterSpieler();
    }
  } else if(G.aktiv === idx){
    G.aktiv = idx - 1;
    naechsterSpieler();
  } else { mpSync(); render(); }
}
function mpStart(){
  if(!MP || !MP.host) return;
  const sitze = (MP.roster||[]).filter(r=>!r.z);
  const m = { t:"start", tempo:+$("#mpTempo").value, diff:+$("#mpDiff").value,
              szenario: $("#mpSzenario").value,
              kis: clamp(+($("#mpKis").value||0), 0, 9-sitze.length), roster: MP.roster };
  MP.ws.send(JSON.stringify(m));
  mpStartEmpfangen(m);
}
function mpStartEmpfangen(m){
  MP.aktiv = true;
  MP.zuordnung = {};
  const namen=[], w=[], kis=[];
  m.roster.filter(r=>!r.z).forEach((r,i)=>{ namen.push(r.name); w.push(i%2===1); kis.push(false); MP.zuordnung[i]=r.name; });
  for(let k=0;k<(m.kis||0);k++){
    const i = namen.length;
    namen.push(NAMEN[i%NAMEN.length]); w.push(i%2===1); kis.push(true); MP.zuordnung[i]=null;
  }
  starteSpiel(namen.length, namen, w, m.tempo, kis, {vergleich:true, tutorial:true, diff:m.diff, szenario:m.szenario||"frei"});
  G._pend = null;
  /* Intro läuft auf allen Geräten; der Weiter-Knopf routet dann über mpRoute() */
}
/* Sitz i gehört mir, wenn mein Regentenname dort eingetragen ist,
   so überlebt die Zuordnung auch Trennung und Wiedereinstieg (asynchrone Partien). */
const mpMein = i => !MP || !MP.aktiv || (MP.zuordnung && MP.zuordnung[i] === MP.name);
let _mpTimer = null;
function mpSync(){
  if(!MP || !MP.aktiv || !G.spieler.length) return;
  clearTimeout(_mpTimer);
  _mpTimer = setTimeout(()=>{
    if(!MP || !MP.aktiv) return;
    try{
      MP.ws.send(JSON.stringify({
        t:"sync", state: spielstand(), kr: G._kr || null, pend: G._pend || null,
        hint: (G.screen==="ende"||G.screen==="sieg") ? G.screen : null,
        sieger: G.sieger ? G.spieler.indexOf(G.sieger) : -1,
        zuordnung: MP.zuordnung
      }));
    }catch(e){}
  }, 120);
}
function mpSyncEmpfangen(m){
  if(!MP) return;
  MP.aktiv = true;
  MP._anwenden = true;
  try{
    const d = JSON.parse(m.state);
    G.jahr = d.jahr; G.tempo = d.tempo; G.aktiv = d.aktiv; G.spieler = d.spieler;
    G.opt = d.opt || G.opt; G.diff = d.diff || 2; G.tipps = d.tipps || {};
    G.kornMarkt = d.kornMarkt || G.kornMarkt; G.marktDruck = d.marktDruck || 0;
    G.angebote = d.angebote || []; G.szenario = d.szenario || "frei";
    G.geschichte = d.geschichte || [];
    G.routen = d.routen || []; G.marktHist = d.marktHist || [];
    G.reichstag = d.reichstag || null; G.reichsfrieden = d.reichsfrieden || 0;
    G.handelsprivileg = d.handelsprivileg || 0;
    G._angriffe = d.angriffe || [];
  G.botschaften = d.botschaften || [];
    G.spieler.forEach((p,i)=>{
      if(!p.heer) p.heer = {inf:0,kav:0,art:0};
      if(!p.gebaeude) p.gebaeude = [];
      if(!p.chronik) p.chronik = [];
      if(!p.kornHist) p.kornHist = [];
      if(!p.ehen) p.ehen = {};
      if(p.holz===undefined) p.holz = 120;
      if(p.stein===undefined) p.stein = 60;
      ["forst","bruch","mauer","burg"].forEach(k=>{ if(p[k]===undefined) p[k]=0; });
    });
    if(m.zuordnung) MP.zuordnung = m.zuordnung;
    G._kr = m.kr || null;
    G._pend = m.pend || null;
    G.sieger = (m.sieger>=0) ? G.spieler[m.sieger] : null;
    if(m.hint){ zeige(m.hint); MP._anwenden = false; return; }
    mpRoute();
  }finally{ MP._anwenden = false; }
}
function mpRoute(){
  if(!MP || !MP.aktiv) return;
  const pend = G._pend;
  if(pend){
    if(mpMein(pend.fuer)){
      G._pend = null;
      if(pend.typ === "diplo") zeige("diplomatie");
      else if(pend.typ === "belagerung") zeige("belagerung");
      else if(pend.typ === "schlachtplan"){ G._aufW = [2,2,2,2,2]; G._aufRes = 0; zeige("aufstellungA"); }
      else if(pend.typ === "aufD"){ G._aufW = [2,2,2,2,2]; G._aufRes = 0; zeige("aufstellungD"); }
      else if(pend.typ === "schlacht") schlachtStarten();
      else if(pend.typ === "kriegAbbruch") zeige("kriegAbbruch");
    } else zeige("warten");
    return;
  }
  if(alleTot()){ zeige("ende"); return; }
  if(mpMein(G.aktiv)) zeige(cur().tot ? "tod" : "handoff");
  else zeige("warten");
}
function mpPend(typ, fuer){
  G._pend = { typ, fuer };
  mpSync();
  zeige("warten");
}

/* ---------- Gamepad: Steuerkreuz navigiert, A drückt ---------- */
setInterval(()=>{
  try{
    const gp = navigator.getGamepads && navigator.getGamepads()[0];
    if(!gp) return;
    const jetzt = performance.now();
    if(jetzt < (G._padCd||0)) return;
    const knoepfe = [...document.querySelectorAll("#screen button:not(:disabled)")];
    if(!knoepfe.length) return;
    const idx = knoepfe.indexOf(document.activeElement);
    const l = (gp.buttons[14]&&gp.buttons[14].pressed) || gp.axes[0] < -0.6;
    const r = (gp.buttons[15]&&gp.buttons[15].pressed) || gp.axes[0] >  0.6;
    const o = (gp.buttons[12]&&gp.buttons[12].pressed) || gp.axes[1] < -0.6;
    const u = (gp.buttons[13]&&gp.buttons[13].pressed) || gp.axes[1] >  0.6;
    if(r || u){ knoepfe[(idx+1+knoepfe.length)%knoepfe.length].focus(); G._padCd = jetzt+220; }
    else if(l || o){ knoepfe[(idx-1+knoepfe.length)%knoepfe.length].focus(); G._padCd = jetzt+220; }
    else if(gp.buttons[0] && gp.buttons[0].pressed){
      const ziel = knoepfe.includes(document.activeElement)
        ? document.activeElement : $("#screen .btn-primary");
      if(ziel && !ziel.disabled){ ziel.click(); G._padCd = jetzt+380; }
    }
  }catch(e){}
}, 60);

/* ---------- Tastatur: Enter = Hauptaktion, Ziffern wählen Entscheidungen ---------- */
document.addEventListener("keydown", e => {
  if(G.screen === "entscheidung" && ["1","2","3"].includes(e.key)){
    const k = +e.key - 1;
    if(G._ereignis && G._ereignis.wahl[k]){ e.preventDefault(); ereignisWahl(k); }
    return;
  }
  if(e.key !== "Enter") return;
  if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName) &&
     document.activeElement.type === "text") return;
  const b = $("#screen .btn-primary");
  if(b && !b.disabled){ e.preventDefault(); b.click(); }
});

/* ---------- Animations-Loop: belebt Karten, Titelbild und Schlachtfeld ---------- */
let _animLast = 0;
function animLoop(t){
  requestAnimationFrame(animLoop);
  if(t - _animLast < 40) return;   /* ~25 fps genügen */
  _animLast = t;
  if(document.hidden) return;
  if(G.screen === "title")        zeichneTitel(t);
  else if(G.screen === "bauen")   zeichneKarte(cur(), "karte", t);
  else if(G.screen === "status"){ zeichneKarte(cur(), "karteS", t); zeichnePortraet("portraitS", cur(), t); }
  else if(G.screen === "schlacht"){ if(!(G._s && G._s.replayAktiv)) zeichneFeld(t); }
  else if(G.screen === "welt")    zeichneWelt(t);
  else if(G.screen === "bilanz")  zeichneWetter(t);
  else if(G.screen === "replay")  zeichnePartieReplay(t);
  else if(G.screen === "sieg")    zeichneFeuerwerk(t);
  else if(G.screen === "handoff") zeichneSaisonband(t);
  else if(G.screen === "turnier") zeichneTjost(t);
  else if(G.screen === "kroenung") zeichneKroenung(t);
}
requestAnimationFrame(animLoop);

/* PWA: Installationshinweis, einmalig, wenn der Browser es anbietet */
let _installEv = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  _installEv = e;
  let gezeigt = false;
  try{ gezeigt = !!window.localStorage.getItem("kaiser_install_hint"); }catch(err){}
  if(gezeigt) return;
  setTimeout(()=>{
    if(!_installEv) return;
    const d = document.createElement("div");
    d.className = "toast";
    d.innerHTML = `📲 <b>Kaiser als App installieren?</b><br>
      <span class="small muted">Eigenes Symbol, Vollbild, auch offline spielbar.</span><br>
      <button class="btn-sm btn-primary" style="margin-top:6px" id="pwaJa">Installieren</button>
      <button class="btn-sm" style="margin-top:6px" id="pwaNein">Später</button>`;
    $("#toasts").appendChild(d);
    const weg = () => { try{ window.localStorage.setItem("kaiser_install_hint","1"); }catch(err){} d.remove(); };
    d.querySelector("#pwaJa").onclick = () => { if(_installEv) _installEv.prompt(); weg(); };
    d.querySelector("#pwaNein").onclick = weg;
    setTimeout(()=>{ if(d.parentNode) weg(); }, 20000);
  }, 2500);
});

/* PWA: Service Worker registrieren (nur wenn über HTTP(S) ausgeliefert) */
try{
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}catch(e){}

try{ $("#lautMusik").value = LAUT.musik; $("#lautFx").value = LAUT.fx; }catch(e){}
render();
