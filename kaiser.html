      && routenVon(i).length < 3 && bezWert(p, G.spieler[i]) >= 0)
      .sort((a,b)=>bezWert(p,G.spieler[b])-bezWert(p,G.spieler[a]))[0];
    if(partner !== undefined){
      const z = G.spieler[partner];
      if(z.ki){
        if(z.kiTyp === "haendler" || bezWert(z, p) >= 10){
          p.geld -= 1500;
          routeEroeffnen(idx, partner);
          bericht.push(`eröffnet eine Handelsroute mit ${z.name}`);
        }
      } else if(!(G.angebote||[]).some(x=>x.von===idx && x.an===partner && x.richtung==="route")){
        G.angebote.push({ von:idx, an:partner, richtung:"route", menge:0, preis:0, jahr:G.jahr });
      }
    }
  }
  /* Heiratspolitik unter KI-Häusern */
  if(Math.random() < 0.06 && p.geld > 12000){
    const partner = lebende().map(x=>x.p).filter(z=>z!==p && z.ki && bezWert(p,z)>=25 && !eheAktiv(p,z))[0];
    if(partner){
      eheSchliessen(p, partner, ri(2000,4000));
      bericht.push(`vermählt sein Haus mit ${partner.name}`);
    }
  }
  if(p.kiTyp==="haendler" && p.korn > noetigKorn(p)*2.5 && p.kornPreis > 130){
    const m = p.korn - Math.ceil(noetigKorn(p)*2);
    p.korn -= m; p.geld += Math.round(m*p.kornPreis*0.9);
    G.marktDruck = (G.marktDruck||0) + m;
  }
  /* Krieg? Charakter, Beziehungen und Pakte entscheiden */
  const kriegslust = p.kiTyp==="aggressor" ? 0.24 : p.kiTyp==="haendler" ? 0.04 : 0.08;
  if(p.titel>=1 && !(G.reichsfrieden && G.reichsfrieden >= G.jahr) && Math.random() < kriegslust){
    const nb = nachbarn(idx).filter(i=>!G.spieler[i].tot);
    const eigen = heerStaerke(p.heer) + miliz(p)*0.8;
    const schwelle = p.kiTyp==="aggressor" ? 1.3 : 1.6;
    const ziel = nb.map(i=>G.spieler[i])
      .filter(z => !paktAktiv(p,z) && !buendnisAktiv(p,z) && bezWert(p,z) < 35
                && eigen > (heerStaerke(z.heer) + miliz(z)*0.8 + z.pop*0.025)*schwelle)
      .sort((x,y)=>heerStaerke(x.heer)-heerStaerke(y.heer))[0];
    if(ziel && eigen > 150){
      const di = G.spieler.indexOf(ziel);
      if(ziel.ki){
        const s = kiSchlacht(idx, di);
        if(s) bericht.push(s.sieger==="A"
          ? `führt siegreich Krieg gegen ${ziel.name}` + (s.tiefe>=2 ? ` und plündert das Hinterland` : "")
          : `verliert einen Feldzug gegen ${ziel.name}`);
      } else if(!G.lehre && !(G._angriffe||[]).some(x=>x.kr.a===idx && x.kr.d===di)){
        /* Menschlicher Verteidiger: Krieg wird erklärt, die Schlacht schlägt
           der Verteidiger selbst zu Beginn seines nächsten Zuges */
        const kr = { a:idx, d:di, weg:wegZwischen(idx,di), fragen:[], wahl:{},
                     aufA: kiAufstellung(p.heer), resA: p.kiTyp==="aggressor" ? 0 : 0.2,
                     gelaende: wuerfleGelaende() };
        kr.fragen = lebende().map(x=>x.i).filter(i2=>i2!==idx && i2!==di);
        for(const i2 of kr.fragen){
          const s2 = G.spieler[i2];
          kr.wahl[i2] = buendnisAktiv(s2, ziel) ? "def" : s2.ki ? kiDiploWahl(s2, kr) : "frei";
        }
        if(!kr.weg.some(i2=>!["atk","frei"].includes(kr.wahl[i2]))){
          if(routeAktiv(idx, di)) routeTrennen(idx, di, "durch die Kriegserklärung zerbrochen");
          if(((ziel.mauer||0) + (ziel.burg||0)) > 0)
            belagerungAnwenden(kr, p.heer.art >= 2 ? "beschuss" : "sturm");
          p.kriegGefuehrt = true;
          G._angriffe = (G._angriffe||[]).concat({ kr });
          geschichte("⚔️", `${p.name} erklärt ${ziel.name} den Krieg, die Heere marschieren!`);
          bericht.push(`erklärt ${ziel.name} den Krieg!`);
        }
      }
    }
  }
  /* Eigeninitiative: Botschaften und Forderungen an menschliche Höfe */
  if(!G.lehre && Math.random() < 0.30){
    const menschen = lebende().map(x=>x.p).filter(z=>!z.ki);
    const zielM = menschen.length ? menschen[ri(0, menschen.length-1)] : null;
    if(zielM){
      const mi = G.spieler.indexOf(zielM);
      const bez = bezWert(p, zielM);
      const meineS = heerStaerke(p.heer) + miliz(p)*0.8;
      const seineS = heerStaerke(zielM.heer) + miliz(zielM)*0.8;
      G.botschaften = G.botschaften || [];
      if(G.botschaften.filter(b=>b.an===mi).length < 2){
        if(p.kiTyp==="aggressor" && meineS > seineS*1.3 && bez < 5 && p.titel >= 1
           && !paktAktiv(p,zielM) && !eheAktiv(p,zielM) && !buendnisAktiv(p,zielM)){
          const betrag = Math.max(400, Math.round(Math.max(0,zielM.geld)*0.06/100)*100);
          G.botschaften.push({ von:idx, an:mi, jahr:G.jahr, art:"forderung", betrag,
            text:`„Euer Reich gedeiht nur, weil meine Heere es dulden. ${fmt(betrag)} Taler, und Ihr habt ein weiteres Jahr Ruhe.“` });
          bericht.push(`sendet ${zielM.name} eine Tributforderung`);
        } else if(bez > 40 && Math.random() < 0.5){
          G.botschaften.push({ von:idx, an:mi, jahr:G.jahr, text: botAntwortText(p, "freundlich") });
          bezAendern(p, zielM, 2);
        } else if(bez < -30){
          G.botschaften.push({ von:idx, an:mi, jahr:G.jahr, text: botAntwortText(p, "trotzig") });
        } else if(p.kiTyp==="haendler" && !routeAktiv(idx, mi) && bez >= 10 && Math.random() < 0.5){
          G.botschaften.push({ von:idx, an:mi, jahr:G.jahr,
            text:"„Zwischen unseren Reichen läge eine gute Straße. Bietet mir eine Handelsroute an, und beide Kassen klingen.“" });
        }
      }
    }
  }
  jahresschluss(p);
  const r = p.report;
  for(const e of r.ereignisse) bericht.push(e.t.toLowerCase().replace(/!.*$/,""));
  const titelVorher = titelName(p);
  if(pruefeBefoerderung(p)){
    bericht.push(`wird zu${p.w?"r":"m"} ${titelName(p)} erhoben!`);
    if(p.titel===8){ G.sieger = p; }
  }
  G._kiBerichte = (G._kiBerichte||[]).concat(
    `${p.wappen} ${titelVorher} ${p.name} ` + (bericht.length? bericht.join(", ") : "regiert still sein Reich") + ".");
  G._kiBerichte = G._kiBerichte.slice(-12);
}

/* ---------- Speichern & Laden ---------- */
function storageOK(){
  try{ const t="__kaiser_t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
function spielstand(){ return JSON.stringify({v:8, jahr:G.jahr, tempo:G.tempo, aktiv:G.aktiv, spieler:G.spieler, opt:G.opt||{vergleich:true}, diff:G.diff||2, tipps:G.tipps||{}, kornMarkt:G.kornMarkt||100, marktDruck:G.marktDruck||0, angebote:G.angebote||[], szenario:G.szenario||"frei", geschichte:G.geschichte||[], routen:G.routen||[], marktHist:G.marktHist||[], kampagne:G.kampagne||null, reichstag:G.reichstag||null, reichsfrieden:G.reichsfrieden||0, handelsprivileg:G.handelsprivileg||0, lehre:G.lehre||null, angriffe:G._angriffe||[], botschaften:G.botschaften||[]}); }
function ladeSpielstand(json){
  const d = JSON.parse(json);
  if(!d || !Array.isArray(d.spieler) || !d.spieler.length) throw new Error("ungültig");
  G.jahr = d.jahr; G.tempo = d.tempo; G.aktiv = clamp(d.aktiv||0,0,d.spieler.length-1);
  G.spieler = d.spieler;
  G.opt = d.opt || { vergleich:true };
  G.diff = d.diff || 2;
  G.tipps = d.tipps || {};
  G.kornMarkt = d.kornMarkt || 100;
  G.marktDruck = d.marktDruck || 0;
  G.angebote = d.angebote || [];
  G.szenario = d.szenario || "frei";
  G.geschichte = d.geschichte || [];
  G.routen = d.routen || [];
  G.marktHist = d.marktHist || [];
  G.kampagne = d.kampagne || null;
  G.reichstag = d.reichstag || null;
  G.reichsfrieden = d.reichsfrieden || 0;
  G.handelsprivileg = d.handelsprivileg || 0;
  G.lehre = d.lehre || null;
  G._angriffe = d.angriffe || [];
  G.botschaften = d.botschaften || [];
  G._kiBerichte = [];
  G.spieler.forEach((p,i)=>{
    if(!p.heer) p.heer = {inf:0,kav:0,art:0};
    if(!p.kornHist) p.kornHist = [];
    if(p.snap===undefined) p.snap = null;
    if(p.delta===undefined) p.delta = null;
    if(!p.farbe) p.farbe = FARBEN[i%FARBEN.length];
    if(!p.wappen) p.wappen = WAPPEN[i%WAPPEN.length];
    if(!p.chronik) p.chronik = [];
    if(p.ki===undefined) p.ki = false;
    if(!p.startAlter) p.startAlter = ri(22,30);
    if(!p.bez) p.bez = {};
    if(!p.pakte) p.pakte = {};
    if(!p.stat) p.stat = { steuern:0, kornErloes:0, siege:0, niederlagen:0, bauten:0 };
    if(!p.gen) p.gen = 1;
    if(p.haefen===undefined) p.haefen = 0;
    if(!p.berater) p.berater = {};
    if(!p.spionage) p.spionage = {};
    if(!p.ehen) p.ehen = {};
    if(!p.folgen) p.folgen = [];
    if(!p.zug) p.zug = wuerfleZug();
    if(p.holz===undefined) p.holz = 120;
    if(p.stein===undefined) p.stein = 60;
    if(p.forst===undefined) p.forst = 0;
    if(p.bruch===undefined) p.bruch = 0;
    if(p.mauer===undefined) p.mauer = 0;
    if(p.burg===undefined) p.burg = 0;
    if(!p.holzPreis) p.holzPreis = ri(8,16);
    if(!p.steinPreis) p.steinPreis = ri(14,26);
    if(!p.gebaeude){
      p.gebaeude = [];
      for(let m=0;m<p.maerkte;m++) p.gebaeude.push({t:"m",ang:Math.random()*6.2832,dist:0.34+Math.random()*0.58});
      for(let k=0;k<p.muehlen;k++) p.gebaeude.push({t:"k",ang:Math.random()*6.2832,dist:0.34+Math.random()*0.58});
    }
  });
  G.sieger = null;
  zeige("handoff");
}
function exportSpielstand(){
  const blob = new Blob([spielstand()], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kaiser-anno-${G.jahr}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function importSpielstand(inp){
  const file = inp.files && inp.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { try{ ladeSpielstand(rd.result); }catch(e){ alertMsg("Diese Datei ist kein gültiger Kaiser-Spielstand."); } };
  rd.readAsText(file);
  inp.value = "";
}
function slotRoh(n){
  try{ const raw = window.localStorage.getItem("kaiser_slot_"+n); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function slotSpeichern(n){
  if(!G.spieler.length){ alertMsg("Es läuft keine Partie, die man speichern könnte."); return; }
  const p = cur();
  const meta = { name:`${titelName(p)} ${p.name}`, wappen:p.wappen, jahr:G.jahr,
                 punkte:score(p), zeit:Date.now() };
  try{
    window.localStorage.setItem("kaiser_slot_"+n, JSON.stringify({ meta, stand: spielstand() }));
    toast(`💾 Partie in Platz ${n} gespeichert.`);
  }catch(e){ alertMsg("Speichern fehlgeschlagen, der Browser-Speicher ist voll oder gesperrt."); }
  render();
}
function slotLaden(n){
  const roh = n === "auto" ? { stand: window.localStorage.getItem("kaiser_save") } : slotRoh(n);
  if(!roh || !roh.stand){ alertMsg("Dieser Platz ist leer."); return; }
  try{ ladeSpielstand(roh.stand); }catch(e){ alertMsg("Dieser Spielstand ist beschädigt."); }
}
function slotLoeschen(n){
  try{ window.localStorage.removeItem("kaiser_slot_"+n); }catch(e){}
  render();
}
function staendeAuf(){ G._vorStaende = G.screen; zeige("staende"); }
function quicksave(){
  if(!storageOK() || !G.spieler.length) return;
  try{ window.localStorage.setItem("kaiser_save", spielstand()); }catch(e){}
}
function quickload(){
  try{ const s = window.localStorage.getItem("kaiser_save"); if(s) ladeSpielstand(s); }catch(e){}
}
function hatQuicksave(){
  try{ return storageOK() && !!window.localStorage.getItem("kaiser_save"); }catch(e){ return false; }
}

  { t:"Kauft am Markt Korn oder Land. Spekulation ist Eure wichtigste Einnahmequelle.",

  { t:"Setzt maßvolle Steuern: Einkommen- und Mehrwertsteuer zusammen unter 45 %.",
    ok:(p,f)=> !!f.steuern },
  { t:"Baut Euren ersten Markt (1.000 T + 20 🪵), er bringt Zölle und Miliz.",
    ok:(p,f)=> p.maerkte >= 1 },
  { t:"Legt einen Forsthof an (800 T), er liefert jedes Jahr 30 🪵 Holz.",
    ok:(p,f)=> (p.forst||0) >= 1 },
  { t:"Schließt das Jahr ab und lest die Jahresbilanz aufmerksam.",
    ok:(p,f)=> G.jahr > 1700 },
  { t:"Baut eine Mühle (2.000 T + Material), sie steigert Eure Ernte um 5 %.",

  { t:"Sendet Meister Konrad ein Geschenk (Bauen → Diplomatie). Freunde sind Gold wert.",
    ok:(p,f)=> !!f.geschenk },
  { t:"Werbt mindestens 10 Infanteristen an (Bauen → Militär), ganz ohne Schutz geht es nicht.",
    ok:(p,f)=> p.heer.inf >= 10 },
  { t:"Schließt ein weiteres Jahr ab, dann seid Ihr bereit für die Kampagne!",
    ok:(p,f)=> G.jahr > 1701 }
];
function lehreStart(){
  const f = kampagneFortschritt();
  const name = f.name || "Friedrich";
  starteSpiel(2, [name, "Meister Konrad"], [!!f.w, false], 1.8, [false, true],
    { vergleich:true, tutorial:true, diff:1, szenario:"frei" });
  G.spieler[1].kiTyp = "baumeister";
  G.lehre = { schritt:0, flags:{} };
  zeige("lehreIntro");
}
function lehreCheck(){
  const L = G.lehre;
  if(!L || L.schritt >= LEHRE.length || !G.spieler.length || G.aktiv !== 0 || G.spieler[0].ki) return;
  const t = LEHRE[L.schritt];
  if(t && t.ok(G.spieler[0], L.flags || {})){
    L.schritt++;
    sMuenze();
    if(L.schritt >= LEHRE.length){
      setTimeout(()=>zeige("lehreFertig"), 500);
    } else {
      toast(`🎓 <b>Aufgabe erfüllt!</b><br><span class="small">Als Nächstes: ${LEHRE[L.schritt].t}</span>`, 6500);
      setTimeout(()=>{ if(G.lehre) render(); }, 250);
    }
    quicksave();
  }
}

/* ============================================================
   Der Reichstag: alle zehn Jahre stimmen die Regenten ab.
   Stimmgewicht nach Titel, die KI stimmt nach Interesse.
   ============================================================ */
const REICHSTAG_VORSCHLAEGE = [
  { id:"frieden", ico:"🕊️", n:"Reichsfrieden",
    d:"Zwei Jahre lang sind alle Feldzüge im Reich verboten.",
    kiJa:p => heerStaerke(p.heer) < 200 || p.kiTyp !== "aggressor" },
  { id:"steuer", ico:"🪙", n:"Reichssteuer",
    d:"Jedes Reich zahlt 5 % seines Vermögens in die Reichskasse; sie wird dem ärmsten Reich zugesprochen.",
    kiJa:p => { const s = [...G.spieler].filter(x=>!x.tot).sort((a,b)=>a.geld-b.geld); return s[0] === p || p.geld < 12000; } },
  { id:"privileg", ico:"🚚", n:"Handelsprivileg",
    d:"Fünf Jahre lang bringen alle Handelsrouten die Hälfte mehr Zoll.",
    kiJa:p => p.kiTyp === "haendler" || routenVon(G.spieler.indexOf(p)).length > 0 }
];
function reichstagEinberufen(){
  const v = REICHSTAG_VORSCHLAEGE[ri(0, REICHSTAG_VORSCHLAEGE.length-1)];
  G.reichstag = { jahr:G.jahr, vorschlag:v.id, stimmen:{}, bestochen:{} };
  for(const {p,i} of lebende().map(x=>({p:x.p,i:x.i})))
    if(p.ki) G.reichstag.stimmen[i] = v.kiJa(p) ? "ja" : "nein";
  geschichte("🏛️", `Der Reichstag tritt zusammen, beraten wird: ${v.n}.`);
}
const reichstagVorschlag = () => REICHSTAG_VORSCHLAEGE.find(v=>v.id===G.reichstag.vorschlag);
const stimmgewicht = p => (p.titel||0) + 1 + (hatPrivileg(p,6) ? 3 : 0);
function reichstagOffen(){
  return G.reichstag && lebende().some(x => G.reichstag.stimmen[x.i] === undefined);
}
function reichstagStimme(wahl){
  const rt = G.reichstag;
  if(!rt) { zeige("status"); return; }
  rt.stimmen[G.aktiv] = wahl;
  mpSync();
  if(!reichstagOffen()) reichstagAuswerten();
  if(G.screen === "reichstag") beginneZugWeiter();
}
function reichstagBestechen(){
  const rt = G.reichstag, p = cur();
  if(!rt || rt.bestochen[G.aktiv] || p.geld < 2500) return;
  /* eine ablehnende KI-Stimme umstimmen (die mit dem besten Verhältnis) */
  const kandidat = lebende().filter(x => x.p.ki && rt.stimmen[x.i] === "nein")
    .sort((a,b)=>bezWert(b.p,p)-bezWert(a.p,p))[0];
  if(!kandidat){ toast("🏛️ Keine ablehnende Stimme, die sich kaufen ließe."); return; }
  p.geld -= 2500;
  rt.bestochen[G.aktiv] = true;
  rt.stimmen[kandidat.i] = "ja";
  bezAendern(p, kandidat.p, 4);
  toast(`🤫 ${kandidat.p.name} wird Eurem Anliegen plötzlich sehr gewogen …`);
  render();
}
function reichstagAuswerten(){
  const rt = G.reichstag, v = reichstagVorschlag();
  let ja = 0, nein = 0;
  for(const {p,i} of lebende().map(x=>({p:x.p,i:x.i}))){
    if(rt.stimmen[i] === "ja") ja += stimmgewicht(p); else nein += stimmgewicht(p);
  }
  const angenommen = ja > nein;
  if(angenommen){
    if(v.id === "frieden"){
      G.reichsfrieden = G.jahr + 2;
    } else if(v.id === "steuer"){
      const aermste = lebende().map(x=>x.p).sort((a,b)=>a.geld-b.geld)[0];
      let topf = 0;
      lebende().forEach(x => { const b = Math.max(0, Math.round(x.p.geld*0.05)); x.p.geld -= b; topf += b; });
      aermste.geld += topf;
      geschichte("🪙", `Die Reichssteuer (${fmt(topf)} T) geht an das ärmste Reich: ${aermste.name}.`);
    } else if(v.id === "privileg"){
      G.handelsprivileg = G.jahr + 5;
    }
  }
  geschichte("🏛️", `Der Reichstag ${angenommen?"beschließt":"verwirft"} „${v.n}" (${ja}:${nein} Stimmen).`);
  toast(`🏛️ Der Reichstag ${angenommen?"beschließt":"verwirft"} <b>${v.n}</b> · ${ja}:${nein} Stimmen.`, 7000);
  G.reichstag = null;
}

    bis:9999, ok:p=>p.titel>=8,

];
function kampagneFortschritt(){
  try{ return JSON.parse(window.localStorage.getItem("kaiser_kampagne")||"{}"); }catch(e){ return {}; }
}
function kampagneSpeichern(f){
  try{ window.localStorage.setItem("kaiser_kampagne", JSON.stringify(f)); }catch(e){}
}
function kampagneStart(k){

function kampagneStartDirekt(k){
  const K = KAMPAGNE[k];
  if(!K) return;
  const f = kampagneFortschritt();
  const name = f.name || "Friedrich", w = !!f.w;
  const namen = [name], geschl = [w], kis = [false];
  K.kis.forEach((typ,i)=>{ namen.push(NAMEN[(i+2)%NAMEN.length]); geschl.push(i%2===1); kis.push(true); });
  starteSpiel(namen.length, namen, geschl, 1.8, kis, {
    vergleich:true, tutorial:true, diff:K.diff, szenario:K.szenario, dynastie: !!K.dynastie
  });
  K.kis.forEach((typ,i)=>{ G.spieler[i+1].kiTyp = typ; });
  G.kampagne = { k };
  /* mitgebrachtes Vermögen aus dem letzten Kapitel */
  if(k > 0 && f.bonus){
    G.spieler[0].geld += f.bonus;
    G.spieler[0].holz = (G.spieler[0].holz||0) + 40;
  }
  geschichte("📖", `Kampagne, Kapitel ${k+1}: ${K.titel}.`);
  zeige("kapitelIntro");
}
function kampagneErfolg(){
  const p = cur();
  const k = G.kampagne.k;
  const f = kampagneFortschritt();
  const bonus = clamp(Math.round(Math.max(0, p.geld)*0.25), 0, 20000);
  kampagneSpeichern({ ...f, frei: Math.max(f.frei||0, k+1), bonus, name:p.name.replace(/ (II\.|III\.|IV\.|V\.|VI\.|VII\.|\d+\.)$/,""), w:p.w });
  if(k >= KAMPAGNE.length-1) erfolg("kampagne");
  zeige("kapitelSieg");
}

/* ---------- Ablauf ---------- */
function starteSpiel(anzahl, namen, geschlechter, tempo, kis, opts){
  opts = opts || {};
  G.tempo = tempo; G.spieler = [];
  G.opt = { vergleich: opts.vergleich!==false, tutorial: opts.tutorial!==false, dynastie: opts.dynastie!==false };
  G.geschichte = [];
  G.diff = opts.diff || 2;
  G.tipps = {};
  for(let i=0;i<anzahl;i++)
    G.spieler.push(neuerSpieler(namen[i]||("Spieler "+(i+1)), geschlechter[i], i, kis && kis[i]));
  /* Frei gewählte Wappen und Hausfarben aus dem Setup */
  if(opts.wappen) G.spieler.forEach((p,i)=>{ if(opts.wappen[i]) p.wappen = opts.wappen[i]; });
  if(opts.farben) G.spieler.forEach((p,i)=>{ if(opts.farben[i]) p.farbe = opts.farben[i]; });
  if(G.diff===1) for(const p of G.spieler){ p.geld = 25000; p.korn = 600; }
  if(G.diff===3) for(const p of G.spieler){ p.geld = 10000; p.korn = 300; }
  /* KI-Persönlichkeiten */
  const typen = ["aggressor","haendler","baumeister"];
  let tIdx = ri(0,2);
  for(const p of G.spieler) if(p.ki){ p.kiTyp = typen[tIdx % 3]; tIdx++; }
  /* Szenario anwenden */
  G.szenario = opts.szenario || "frei";
  if(G.szenario === "erbe"){
    for(const p of G.spieler){ p.geld = -4000; p.korn = 250; }
  } else if(G.szenario === "kriegstreiber"){
    for(const p of G.spieler){ if(p.ki){ p.kiTyp = "aggressor"; p.heer = {inf:ri(80,140), kav:ri(10,25), art:ri(2,6)}; p.titel = Math.max(p.titel,1); p.pop = 3200; }
      else p.heer = {inf:60, kav:5, art:2}; }
  } else if(G.szenario === "kornkrise"){
    for(const p of G.spieler){ p.korn = 120; }
    G.kornMarkt = 240;
  }
  G.kornMarkt = G.kornMarkt || ri(85,120);
  G.marktDruck = 0;
  G.angebote = [];
  G.routen = [];
  G.jahr = 1700; G.aktiv = 0; G.sieger = null; G._kiBerichte = []; G._ruhmFertig = false;
  G.kampagne = null; G.marktHist = [];
  G.reichstag = null; G.reichsfrieden = 0; G.handelsprivileg = 0; G.lehre = null;
  G._angriffe = []; G._nachSchlacht = null; G.botschaften = []; G._parley = [];
  if(cur().ki){ G.aktiv = -1; naechsterSpieler(); }
  else zeige("intro");
}
const diffFaktor = () => G.diff===1 ? 0.6 : G.diff===3 ? 1.35 : 1;
function beginneZug(){
  const p = cur();
  p.kornPreis = saisonKornPreis();
  p.landPreis = ri(16,70);
  p.landAngebot = ri(800, 2600);
  p.holzPreis = ri(8,16); p.steinPreis = ri(14,26);
  p.kornHist = (p.kornHist||[]).concat(p.kornPreis).slice(-32);
  if(p.snap){
    p.delta = { geld:p.geld-p.snap.geld, land:p.land-p.snap.land,
                korn:p.korn-p.snap.korn, pop:p.pop-p.snap.pop };
  }
  p.snap = { geld:p.geld, land:p.land, korn:p.korn, pop:p.pop };
  p.kriegGefuehrt = false;
  p.diploZaehler = 0;
  p.spionGenutzt = false;
  p.ausgabe = 0;
  p.turnStart = Date.now();
  G._kiBerichte = [];
  G._donnerte = false;
  /* Feindliche Heere im Anmarsch? Erst wird verteidigt! */
  if(!p.ki && (G._angriffe||[]).some(x=>x.kr.d === G.aktiv)){ sTrommel(); zeige("verteidigung"); return; }
  beginneZugFortsetzen();
}
/* Zugbeginn nach einer Verteidigungsschlacht (oder direkt) fortsetzen */
function forderungZahlen(i){
  const b = (G.botschaften||[])[i];
  if(!b || b.an !== G.aktiv || b.art !== "forderung") return;
  const p = cur(), von = G.spieler[b.von];
  const betrag = Math.min(b.betrag, Math.max(0, p.geld));
  p.geld -= betrag; von.geld += betrag;
  bezAendern(p, von, 4);
  geschichte("💰", `${p.name} zahlt ${von.name} ${fmt(betrag)} Taler Tribut.`);
  toast(`💰 Ihr zahlt ${fmt(betrag)} Taler. ${von.name} gibt Ruhe, vorerst.`);
  G.botschaften.splice(i,1); mpSync(); render();
}
function forderungAblehnen(i){
  const b = (G.botschaften||[])[i];
  if(!b || b.an !== G.aktiv || b.art !== "forderung") return;
  const p = cur(), von = G.spieler[b.von];
  G.botschaften.splice(i,1);
  bezAendern(p, von, -8);
  if(von.ki && Math.random() < 0.4 && botKriegserklaerung(b.von, G.aktiv)){
    toast(`⚔️ ${von.name} nimmt die Absage nicht hin und erklärt Euch den Krieg!`, 8000);
    sTrommel();
  } else {
    toast(`😠 ${von.name} tobt über Eure Absage, doch die Heere bleiben vorerst daheim.`);
  }
  mpSync(); render();
}
function beginneZugFortsetzen(){
  if((G.botschaften||[]).some(b=>b.an===G.aktiv)){
    for(const b of G.botschaften.filter(x=>x.an===G.aktiv && x.art==="forderung"))
      bezAendern(cur(), G.spieler[b.von], -4);          /* ignorierte Forderung kränkt */
    G.botschaften = G.botschaften.filter(b=>b.an!==G.aktiv);
  }
  const p = cur();
  if(!p.ki && !p.auftrag && !G.lehre && G.jahr > 1702 && Math.random() < 0.18) auftragErteilen(p);
  if(G.reichstag && G.reichstag.stimmen[G.aktiv] === undefined && !p.ki){ zeige("reichstag"); return; }
  beginneZugWeiter();
}
function naechsterAngriff(){
  return (G._angriffe||[]).find(x => x.kr.d === G.aktiv) || null;
}
function verteidigungStarten(){
  const idx = (G._angriffe||[]).findIndex(x => x.kr.d === G.aktiv);
  if(idx < 0){ beginneZugFortsetzen(); return; }
  G._kr = G._angriffe.splice(idx, 1)[0].kr;
  G._nachSchlacht = "zugstart";
  G._aufW = [2,2,2,2,2]; G._aufRes = 0;
  mpSync();
  zeige("aufstellungD");
}
/* Nach der Schlacht: zurück in die Bauphase oder weiter im eigenen Zugbeginn */
function schlachtWeiter(){
  if(G._siegEroberung && G.sieger){
    G._siegEroberung = false;
    if(!G.sieger.ki && mpMein(G.spieler.indexOf(G.sieger))){ G._kroenStart = null; zeige("kroenung"); }
    else zeige("sieg");
    return;
  }
  if(G._nachSchlacht === "zugstart"){
    G._nachSchlacht = null;
    if((G._angriffe||[]).some(x => x.kr.d === G.aktiv)){ zeige("verteidigung"); return; }
    beginneZugFortsetzen();
    return;
  }
  zeige("bauen");
}
function beginneZugWeiter(){
  if((G.angebote||[]).some(a => a.an === G.aktiv)) zeige("angebote");
  else zeige("status");
}
function naechsterSpieler(){
  quicksave();
  for(let schutz=0; schutz<200; schutz++){
    G.aktiv++;
    if(G.aktiv >= G.spieler.length){
      G.aktiv = 0; G.jahr++;
      /* Gemeinsamer Markt: Verkäufe drücken, Käufe treiben den Kurs */
      let kp = G.kornMarkt + (110 - G.kornMarkt)*0.15 + rf(-38,38) - (G.marktDruck||0)*0.02;
      if(Math.random() < 0.06) kp *= rf(1.5,2.4);
      G.kornMarkt = clamp(Math.round(kp), 20, 430);
      G.marktDruck = Math.round((G.marktDruck||0)*0.4);
      G.marktHist = (G.marktHist||[]).concat({ j:G.jahr, k:G.kornMarkt }).slice(-100);
      /* Alle zehn Jahre: der Reichstag tritt zusammen */
      if(G.jahr % 10 === 0 && lebende().length > 1 && !G.lehre) reichstagEinberufen();
    }
    const p = cur();
    if(alleTot()){ zeige("ende"); return; }
    if(G.spieler.some(z=>!z.ki) && G.spieler.filter(z=>!z.ki).every(z=>z.tot)){ zeige("ende"); return; }
    if(p.tot) continue;
    if(G.jahr >= p.todesJahr){
      p.tot = true;
      geschichte("🕯️", `${titelName(p)} ${p.name} stirbt im Alter von ${alterJahre(p)} Jahren.`);
      mpSync();
      if(p.ki){
        if(G.opt && G.opt.dynastie){ erben(p); G._kiBerichte = (G._kiBerichte||[]).concat(`👶 In ${p.name}s Reich tritt die nächste Generation an.`); }
        else G._kiBerichte = (G._kiBerichte||[]).concat(`🕯️ ${titelName(p)} ${p.name} ist Anno ${G.jahr} verstorben.`);
        if(p.tot) continue;
        G.aktiv--; continue;   /* der Erbe ist sofort am Zug */
      }
      if(mpMein(G.aktiv)){ sTrauer(); zeige("tod"); } else zeige("warten");
      return;
    }
    if(p.ki){
      kiZug(p);
      if(G.sieger && G.sieger.ki){ mpSync(); zeige("sieg"); return; }
      continue;
    }
    mpSync();
    if(mpMein(G.aktiv)) zeige("handoff"); else zeige("warten");
    return;
  }
  mpSync();
  zeige("ende");
}
const alleTot = () => G.spieler.every(p=>p.tot);

/* ---------- Anzeige ---------- */
let timerIv = null;
const PHASEN_WIPE = ["status","korn","handel","zwbilanz","steuern","bauen","bilanz"];

const PHASEN_ICON = { "Status":"👑", "Korn":"🌾", "Handel":"💰", "Zw.-Bilanz":"📜", "Steuern":"⚖️", "Bauen":"🏗️", "Bilanz":"📊" };
function stepper(akt){
  const i = PHASEN.indexOf(akt);
  return `<div class="stepper">` + PHASEN.map((ph,j)=>
    `<span class="step ${j===i?'act':j<i?'done':''}">${j<i?'✓':PHASEN_ICON[ph]||''} ${ph}</span>`).join("") + `</div>`;
}

/* Mini-Trend: die letzten Chronikjahre als winzige Linie unter der Kachel */
function miniTrend(p, key){
  const c = (p.chronik||[]).slice(-12);
  if(c.length < 3) return "";
  const werte = c.map(e=>e[key]||0);
  const min = Math.min(...werte), max = Math.max(...werte);
  const sp = Math.max(1, max-min);
  const steigt = werte[werte.length-1] >= werte[0];
  const pts = werte.map((v,i)=>`${(i/(werte.length-1)*58).toFixed(1)},${(14-2-(v-min)/sp*10).toFixed(1)}`);
  return `<svg viewBox="0 0 58 14" style="width:58px;height:14px;display:block;margin-top:5px;opacity:.8">
    <polyline points="${pts.join(" ")}" fill="none" stroke="${steigt?'var(--green)':'var(--red)'}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}
function statKarten(p){

    <div class="stat"><span class="ico">🌍</span><div class="lbl">Land</div>

    <div class="stat"><span class="ico">🌾</span><div class="lbl">Kornspeicher</div>

      ${deltaBadge(d.korn)}</div>

    <div class="stat" ${p.stimmung<15?'style="border-color:var(--red);animation:unruhePuls 1.6s ease-in-out infinite"':''}>
      <span class="ico">${p.stimmung>=80?'😄':p.stimmung>=60?'😊':p.stimmung>=45?'😐':p.stimmung>=25?'😟':p.stimmung>=15?'😠':'🤬'}</span><div class="lbl">Stimmung</div>

  el.innerHTML = R ? R() : "<p>Unbekannter Bildschirm.</p>";
  /* Lehrjahre: aktuelle Aufgabe als Banner über dem Bildschirm */

       ${LEHRE[G.lehre.schritt].t}</div>`);

  }
  if(G.screen === "schlacht") zeichneFeld();

    if(f > 0.85 || f <= 0.6) G._donnerte = false;

/* Zahlen zählen weich hoch (Statuskarten) */
function zaehlerAnimieren(){
  document.querySelectorAll("[data-cnt]").forEach(el=>{
    const ziel = +el.dataset.cnt, suf = el.dataset.suf || "";
    if(!isFinite(ziel)) return;
    const start = ziel * 0.85, t0 = performance.now(), dauer = 450;
    const step = t => {
      const q = Math.min(1,(t-t0)/dauer), e = 1-Math.pow(1-q,3);
      el.textContent = fmt(start + (ziel-start)*e) + suf;
      if(q<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
/* Krönungs-Szene: Prozession durch das Kirchenschiff, die Krone senkt sich */
function zeichneKroenung(t){
  const c = document.getElementById("kroenBild");
  if(!c || !G._kroenStart) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  const seit = performance.now() - G._kroenStart;
  const p = G.sieger || cur();
  ctx.clearRect(0,0,W,H);
  /* Dunkles Kirchenschiff */
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#141019"); bg.addColorStop(0.5,"#1c1622"); bg.addColorStop(1,"#0f0c13");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  /* Rosette: buntes Glasfenster über dem Altar */
  const rx = W/2, ry = H*0.20, rr2 = 52;
  const glas = ["#8a2f3f","#3f5d8a","#7a3f8a","#c79a3d","#3f7a5d","#5d3f8a"];
  for(let g2=0; g2<12; g2++){
    ctx.fillStyle = glas[g2 % glas.length] + "cc";
    ctx.beginPath(); ctx.moveTo(rx, ry);
    ctx.arc(rx, ry, rr2, g2*Math.PI/6, (g2+1)*Math.PI/6); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#e8d9a0";
  ctx.beginPath(); ctx.arc(rx, ry, 10, 0, 7); ctx.fill();
  ctx.strokeStyle = "#0f0c13"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rx, ry, rr2, 0, 7); ctx.stroke();
  /* Lichtkegel aus der Rosette auf den Altar */
  const licht = ctx.createLinearGradient(rx, ry, rx, H*0.72);
  licht.addColorStop(0, "rgba(232,217,160,.28)"); licht.addColorStop(1, "rgba(232,217,160,0)");
  ctx.fillStyle = licht;
  ctx.beginPath(); ctx.moveTo(rx-20, ry+rr2); ctx.lineTo(rx+20, ry+rr2);
  ctx.lineTo(rx+90, H*0.75); ctx.lineTo(rx-90, H*0.75); ctx.closePath(); ctx.fill();
  /* Säulenreihen mit Wappenbannern */
  for(const seite of [-1,1]){
    for(let s2=0; s2<4; s2++){
      const q2 = s2/4;
      const sx = W/2 + seite*(W*0.16 + q2*W*0.26);
      const sw2 = 16 + q2*14, sh = H*(0.30 + q2*0.34);
      const sgrad = ctx.createLinearGradient(sx-sw2/2,0,sx+sw2/2,0);
      sgrad.addColorStop(0,"#2e2937"); sgrad.addColorStop(0.5,"#4a4258"); sgrad.addColorStop(1,"#262230");
      ctx.fillStyle = sgrad;
      ctx.fillRect(sx-sw2/2, H*0.14, sw2, sh);
      ctx.fillStyle = "#4a4258";
      ctx.fillRect(sx-sw2/2-4, H*0.14 + sh, sw2+8, 8);
      /* Banner mit Wappen */
      ctx.fillStyle = p.farbe + "dd";
      ctx.fillRect(sx-9, H*0.20, 18, 40 + Math.sin(t/500 + s2)*2);
      ctx.font = "12px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(p.wappen, sx, H*0.20 + 24);
    }
  }
  /* Roter Teppich */
  ctx.fillStyle = "#6e1f2b";
  ctx.beginPath(); ctx.moveTo(W/2-26, H*0.55); ctx.lineTo(W/2+26, H*0.55);
  ctx.lineTo(W/2+110, H); ctx.lineTo(W/2-110, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#c79a3d"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-24, H*0.55); ctx.lineTo(W/2-100, H); ctx.moveTo(W/2+24, H*0.55); ctx.lineTo(W/2+100, H); ctx.stroke();
  /* Hofstaat als Silhouetten, wiegen sich leicht */
  for(let hz=0; hz<26; hz++){
    const seite = hz%2 ? 1 : -1;
    const q2 = (hz%13)/13;
    const hx = W/2 + seite*(60 + q2*W*0.3);
    const hy = H*(0.62 + q2*0.3);
    ctx.fillStyle = GEWAND[hz % GEWAND.length] + "bb";
    ctx.beginPath(); ctx.arc(hx, hy + Math.sin(t/420 + hz)*1.2, 6 + q2*5, 0, 7); ctx.fill();
  }
  /* Altar und Bischof */
  ctx.fillStyle = "#3a3344"; ctx.fillRect(W/2-40, H*0.47, 80, 12);
  ctx.fillStyle = "#e8e0cf";
  ctx.beginPath(); ctx.arc(W/2 + 34, H*0.43, 7, 0, 7); ctx.fill();
  ctx.fillRect(W/2 + 27, H*0.44, 14, 22);
  ctx.fillStyle = "#c79a3d"; ctx.fillRect(W/2 + 31, H*0.36, 6, 8);
  /* Kerzen flackern */
  for(const kx of [W/2-56, W/2+56]){
    ctx.fillStyle = "#d8d0bd"; ctx.fillRect(kx-1.5, H*0.41, 3, 12);
    ctx.fillStyle = `rgba(255,200,90,${0.7 + Math.sin(t/90 + kx)*0.3})`;
    ctx.beginPath(); ctx.arc(kx, H*0.40, 2.6, 0, 7); ctx.fill();
  }
  /* Der Regent schreitet zum Altar (0-5 s), kniet, die Krone senkt sich (5-7 s) */
  const gehQ = Math.min(1, seit/5000);
  const ge = gehQ*gehQ*(3-2*gehQ);
  const ky = H*0.92 - ge*(H*0.35);
  const skal = 1.5 - ge*0.6;
  ctx.save();
  ctx.translate(W/2, ky);
  ctx.scale(skal, skal);
  const schritt = gehQ < 1 ? Math.sin(seit/130)*1.4 : 0;
  ctx.fillStyle = p.farbe;
  ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(0, -26 - schritt*0.4, 9, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#caa07a";
  ctx.beginPath(); ctx.arc(0, -30 - schritt*0.4, 6, 0, 7); ctx.fill();
  /* Hermelin-Umhang */
  ctx.strokeStyle = "rgba(240,236,224,.85)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-9, -4); ctx.quadraticCurveTo(0, 4, 9, -4); ctx.stroke();
  ctx.restore();
  /* Die Krone senkt sich mit goldenem Glanz */
  if(seit > 5000){
    const kq = Math.min(1, (seit-5000)/1800);
    const ke = kq*kq*(3-2*kq);
    const kyy = H*0.30 + ke*(H*0.22);
    const glanz = ctx.createRadialGradient(W/2, kyy, 2, W/2, kyy, 34);
    glanz.addColorStop(0, "rgba(255,225,130,.5)"); glanz.addColorStop(1, "rgba(255,225,130,0)");
    ctx.fillStyle = glanz;
    ctx.beginPath(); ctx.arc(W/2, kyy, 34, 0, 7); ctx.fill();
    ctx.font = "30px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("👑", W/2, kyy);
    if(kq >= 1){
      const pq = 0.75 + Math.sin(t/260)*0.08;
      ctx.save(); ctx.globalAlpha = Math.min(1, (seit-6800)/600);
      ctx.font = `bold ${Math.round(24*pq+8)}px Georgia, serif`; ctx.fillStyle = "#e0b458";
      ctx.fillText(`${p.name}, von Gottes Gnaden Kaiser!`, W/2, H*0.86);
      ctx.restore();
    }
  }
  /* Weihrauch-Schleier */
  for(let wr2=0; wr2<3; wr2++){
    const q2 = ((t/5200) + wr2*0.33) % 1;
    ctx.fillStyle = `rgba(216,208,189,${0.10*(1-q2)})`;
    ctx.beginPath();
    ctx.arc(W/2 + Math.sin(q2*6 + wr2*2)*70, H*0.6 - q2*H*0.4, 18 + q2*30, 0, 7);
    ctx.fill();
  }
}
/* Tjost-Szene: zwei Reiter sprengen aufeinander zu */
function zeichneTjost(t){
  const c = document.getElementById("tjost");
  const t2 = G._turnier;
  if(!c || !t2) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  const seit = performance.now() - t2.start;
  const ich = cur(), gast = G.spieler[t2.gast] || ich;
  ctx.clearRect(0,0,W,H);
  /* Turnierplatz: Rasen, Schranke, Tribüne mit Wimpeln */
  const gras = ctx.createLinearGradient(0,0,0,H);
  gras.addColorStop(0,"#2b3444"); gras.addColorStop(0.35,"#31402a"); gras.addColorStop(1,"#24331f");
  ctx.fillStyle = gras; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#3a2f22"; ctx.fillRect(0, H*0.30, W, 10);
  for(let tb=0; tb<12; tb++){
    ctx.fillStyle = tb%2 ? "#4a3a28" : "#544232";
    ctx.fillRect(20 + tb*(W-40)/12, H*0.14, (W-40)/12 - 4, H*0.15);
  }
  /* Zuschauer wippen */
  for(let z=0; z<24; z++){
    ctx.fillStyle = GEWAND[z % GEWAND.length];
    const zx = 34 + z*(W-70)/24, zy = H*0.20 + Math.sin(t/260 + z)*1.6;
    ctx.beginPath(); ctx.arc(zx, zy, 5, 0, 7); ctx.fill();
  }
  /* Wimpelkette */
  for(let wp=0; wp<16; wp++){
    ctx.fillStyle = wp%2 ? ich.farbe : gast.farbe;
    const wx = 20 + wp*(W-40)/16;
    const wy = H*0.09 + Math.sin(wp*1.2)*3 + Math.sin(t/300 + wp)*1.2;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx+10, wy); ctx.lineTo(wx+5, wy+9); ctx.closePath(); ctx.fill();
  }
  /* Tjost-Schranke */
  ctx.fillStyle = "#5a4a30"; ctx.fillRect(W*0.1, H*0.66, W*0.8, 6);
  /* Ritt: 0..2200ms aufeinander zu, Zusammenprall, dann hält der Sieger */
  const q = Math.min(1, seit/2200);
  const ease = q*q*(3-2*q);
  const rx1 = W*0.08 + ease*(W*0.40);
  const rx2 = W*0.92 - ease*(W*0.40);
  const hop = Math.abs(Math.sin(seit/90))*3*(q<1?1:0);
  const reiter = (x, farbe, richt, lanze) => {
    ctx.save(); ctx.translate(x, H*0.60 - hop);
    if(richt<0) ctx.scale(-1,1);
    ctx.fillStyle = "#6a4a2a";
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 9, 0, 0, 7); ctx.fill();          /* Ross */
    ctx.beginPath(); ctx.moveTo(18,-3); ctx.quadraticCurveTo(27,-8,26,-16); ctx.quadraticCurveTo(21,-12,17,-9); ctx.fill(); /* Hals */
    ctx.strokeStyle = "#4a331d"; ctx.lineWidth = 2.5;
    for(const bx of [-12,-5,5,12]){
      const schw = q<1 ? Math.sin(seit/70 + bx)*4 : 0;
      ctx.beginPath(); ctx.moveTo(bx, 7); ctx.lineTo(bx + schw, 16); ctx.stroke();
    }
    ctx.fillStyle = farbe;
    ctx.beginPath(); ctx.arc(2, -16, 6.5, 0, 7); ctx.fill();                 /* Reiter */
    ctx.fillStyle = "#d8d0bd";
    ctx.beginPath(); ctx.arc(2, -24, 3.6, 0, 7); ctx.fill();                 /* Helm */
    if(lanze){ ctx.strokeStyle = "#c8beab"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(6,-15); ctx.lineTo(34,-9); ctx.stroke(); }
    ctx.restore();
  };
  reiter(rx1, ich.farbe, 1, q<1);
  reiter(rx2, gast.farbe, -1, q<1);
  /* Zusammenprall */
  if(seit > 2050 && seit < 2650){
    const bq = (seit-2050)/600;
    ctx.fillStyle = `rgba(255,235,160,${0.9*(1-bq)})`;
    ctx.beginPath(); ctx.arc(W/2, H*0.56, 8 + bq*36, 0, 7); ctx.fill();
    /* Lanzensplitter */
    ctx.strokeStyle = `rgba(200,190,171,${1-bq})`; ctx.lineWidth = 2;
    for(let sp=0; sp<6; sp++){
      const sa = sp*1.05 + 0.3;
      const sd = 10 + bq*44;
      ctx.beginPath();
      ctx.moveTo(W/2 + Math.cos(sa)*sd, H*0.56 + Math.sin(sa)*sd - bq*20);
      ctx.lineTo(W/2 + Math.cos(sa)*(sd+9), H*0.56 + Math.sin(sa)*(sd+9) - bq*20);
      ctx.stroke();
    }
  }
  /* Ergebnis einblenden */
  if(seit > 2600){
    const sieger = G.spieler[t2.sieger];
    const eq = Math.min(1, (seit-2600)/500);
    ctx.save(); ctx.globalAlpha = eq;
    ctx.textAlign = "center";
    ctx.font = "26px sans-serif"; ctx.fillText("🏆", W/2, H*0.36 - (1-eq)*10);
    ctx.font = "bold 17px Georgia, serif"; ctx.fillStyle = "#e0b458";
    ctx.fillText(`${sieger.wappen} ${sieger.name} siegt in der Tjost!`, W/2, H*0.45);
    ctx.restore();
    const erg = document.getElementById("tjostErgebnis");
    if(erg && erg.style.display === "none"){ erg.style.display = ""; konfetti(60); sFanfare();
      const tt = document.getElementById("tjostText"); if(tt) tt.style.display = "none"; }
  }
}
/* Die Reichsgeschichte als gezeichneter Zeitstrahl */
function zeichneZeitstrahl(cid){
  const c = document.getElementById(cid);
  if(!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#1b212b"); bg.addColorStop(1,"#141922");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  const ev = G.geschichte || [];
  const j0 = 1700, j1 = Math.max(G.jahr, j0 + 4);
  const x = j => 44 + (j - j0)/(j1 - j0) * (W - 88);
  const y0 = H * 0.56;
  /* Achse mit Jahresmarken */
  ctx.strokeStyle = "rgba(224,180,88,.55)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(32, y0); ctx.lineTo(W-32, y0); ctx.stroke();
  ctx.font = "11px Georgia, serif"; ctx.textAlign = "center";
  const schritt = (j1 - j0) > 40 ? 10 : 5;
  for(let j = j0; j <= j1; j += schritt){
    ctx.strokeStyle = "rgba(219,226,238,.3)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(j), y0-4); ctx.lineTo(x(j), y0+4); ctx.stroke();
    ctx.fillStyle = "rgba(219,226,238,.6)";
    ctx.fillText(j, x(j), y0 + 18);
  }
  /* Ereignisse je Jahr stapeln, abwechselnd über und unter der Achse */
  const proJahr = {};
  ev.forEach(e => { (proJahr[e.j] = proJahr[e.j] || []).push(e); });
  ctx.font = "13px sans-serif";
  Object.keys(proJahr).map(Number).sort((a,b)=>a-b).forEach((j, ji) => {
    const liste = proJahr[j].slice(0, 5);
    const obenSeite = ji % 2 === 0;
    const xx = x(j);
    ctx.strokeStyle = "rgba(224,180,88,.3)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xx, y0 + (obenSeite ? -5 : 5));
    ctx.lineTo(xx, obenSeite ? y0 - 14 : y0 + 24); ctx.stroke();
    ctx.fillStyle = "#dbe2ee";
    liste.forEach((e, k) => {
      const yy = obenSeite ? y0 - 22 - k*16 : y0 + 34 + k*16;
      if(yy > 8 && yy < H - 4) ctx.fillText(e.ico || "•", xx, yy);
    });
  });
  ctx.fillStyle = "#e0b458"; ctx.font = "600 13px Georgia, serif"; ctx.textAlign = "left";
  ctx.fillText(`📜 Chronik des Reiches · Anno ${j0} bis ${G.jahr}`, 12, 18);
}

    const land = replayWert(r.daten[i], jz, "land", 10000);
    const pop  = replayWert(r.daten[i], jz, "pop", 2500);
    const heer = replayWert(r.daten[i], jz, "heer", 0);
    const dabei = (p.chronik||[]).some(e => e.j >= jz) || jz <= 1701;
    const rrW = 20 + 34*Math.sqrt(Math.min(land,50000)/50000);
    ctx.save();
    if(!dabei) ctx.globalAlpha = 0.35;
    const rngB = mulberry(i*97+5);
    ctx.beginPath();
    const bl = [];
    for(let k=0;k<10;k++){
      const a = k/10*6.2832;
      bl.push([px+Math.cos(a)*rrW*(0.8+rngB()*0.35)*1.25, py+Math.sin(a)*rrW*(0.8+rngB()*0.35)*0.8]);
    }
    ctx.moveTo((bl[0][0]+bl[9][0])/2,(bl[0][1]+bl[9][1])/2);
    for(let k=0;k<10;k++){
      const nx = bl[(k+1)%10];
      ctx.quadraticCurveTo(bl[k][0], bl[k][1], (bl[k][0]+nx[0])/2, (bl[k][1]+nx[1])/2);
    }
    ctx.closePath();
    ctx.fillStyle = dabei ? "#2c4527" : "#39404a"; ctx.fill();
    ctx.strokeStyle = p.farbe; ctx.lineWidth = 2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `${Math.round(rrW*0.6)}px sans-serif`; ctx.textAlign = "center";
    ctx.fillText(p.wappen, px, py + rrW*0.2);
    ctx.font = "600 12px sans-serif"; ctx.fillStyle = "#dbe2ee";
    ctx.fillText(`${p.name}${dabei?"":" †"}`, px, py + rrW*0.8 + 14);
    ctx.font = "10px sans-serif"; ctx.fillStyle = "#8b96a8";
    ctx.fillText(`${fmt(land)} ha · ${fmt(pop)} Einw.${heer?` · ⚔️${fmt(heer)}`:""}`, px, py + rrW*0.8 + 27);
    ctx.restore();
  });
  /* Chronik-Ticker: die Ereignisse des laufenden Jahres */
  const eintraege = (G.geschichte||[]).filter(e => e.j <= jz).slice(-3);
  ctx.fillStyle = "rgba(13,17,23,.82)"; ctx.fillRect(0, H-64, W, 64);
  ctx.textAlign = "left"; ctx.font = "12px sans-serif";
  eintraege.forEach((e,k)=>{
    ctx.fillStyle = e.j === jz ? "#dbe2ee" : "rgba(139,150,168,.75)";
    ctx.fillText(`${e.j}  ${e.ico} ${e.t}`.substring(0,110), 14, H-46 + k*17);
  });
  /* Jahresanzeige */
  ctx.fillStyle = "rgba(13,17,23,.78)"; ctx.fillRect(10, 10, 190, 34);
  ctx.strokeStyle = "#e0b458"; ctx.strokeRect(10, 10, 190, 34);
  ctx.fillStyle = "#e0b458"; ctx.font = "bold 20px Georgia, serif";
  ctx.fillText(`Anno ${jz}`, 20, 34);
  ctx.font = "10px sans-serif"; ctx.fillStyle = "#8b96a8";
  ctx.fillText(`${r.speed}×`, 168, 34);
  if(r.fertig){
    ctx.fillStyle = "rgba(224,180,88,.92)"; ctx.font = "bold 17px Georgia, serif"; ctx.textAlign = "center";
    ctx.fillText(`⏳ ${r.j0}–${r.j1}, die ganze Regentschaft im Zeitraffer`, W/2, 34);
  }
}

/* Statistik-Dashboard: Kennzahlen-Kurven aller Reiche über die Jahre */
function statChart(key, titel, einheit){
  const teilnehmer = G.spieler.filter(p=>(p.chronik||[]).length>=2 && p.chronik.some(e=>e[key]!==undefined));
  if(teilnehmer.length < 1) return "";
  const alle = teilnehmer.flatMap(p=>p.chronik.map(e=>e[key]||0));
  const max = Math.max(1, ...alle), min = Math.min(0, ...alle);
  const sp = Math.max(1, max-min);
  const j0 = Math.min(...teilnehmer.map(p=>p.chronik[0].j));
  const j1 = Math.max(...teilnehmer.map(p=>p.chronik[p.chronik.length-1].j));
  const w = 640, h = 150;
  const y0 = h-12 - (0-min)/sp*(h-28);
  const linien = teilnehmer.map(p=>{
    const pts = p.chronik.map(e=>
      `${((e.j-j0)/Math.max(1,j1-j0)*w).toFixed(1)},${(h-12-((e[key]||0)-min)/sp*(h-28)).toFixed(1)}`);
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${p.farbe}" stroke-width="2.2" stroke-linejoin="round" opacity=".92"/>`;
  }).join("");
  return `<div class="card">
    <h3>${titel} · ${j0}–${j1}</h3>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
      <line x1="0" y1="${y0.toFixed(1)}" x2="${w}" y2="${y0.toFixed(1)}" stroke="#2a3446"/>
      ${linien}
      <text x="2" y="12" font-size="10" fill="#8b96a8">${fmt(max)}${einheit}</text>
    </svg>
  </div>`;
}
function marktChart(){
  const h0 = G.marktHist || [];
  if(h0.length < 2) return "";
  const w = 640, h = 120;
  const max = Math.max(...h0.map(e=>e.k)), min = Math.min(...h0.map(e=>e.k));
  const sp = Math.max(1, max-min);
  const pts = h0.map((e,i)=>`${(i/(h0.length-1)*w).toFixed(1)},${(h-10-(e.k-min)/sp*(h-24)).toFixed(1)}`);
  return `<div class="card">
    <h3>Kornkurs des gemeinsamen Marktes · ${h0[0].j}–${h0[h0.length-1].j}</h3>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
      <polyline points="${pts.join(" ")}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="2" y="12" font-size="10" fill="#8b96a8">${fmt(max)} T</text>
      <text x="2" y="${h-2}" font-size="10" fill="#8b96a8">${fmt(min)} T</text>
    </svg>
  </div>`;
}
function statAuf(){
  if(G.screen === "statistik" || G.screen === "schlacht") return;
  G._vorStat = G.screen;
  zeige("statistik");
}
function deltaBadge(v, einheit=""){
  if(v===undefined || v===null || v===0 || !isFinite(v)) return "";
  return v>0 ? `<span class="up">▲ ${fmt(v)}${einheit}</span>` : `<span class="down">▼ ${fmt(Math.abs(v))}${einheit}</span>`;
}
function alertMsg(t, ms){
  const box = $("#toasts");
  if(!box) return;
  const div = document.createElement("div");
  div.className = "toast";
  div.style.borderColor = "var(--red)";
  div.innerHTML = `<p>⚠️ ${t}</p>`;
  box.appendChild(div);
  setTimeout(()=>{ div.style.opacity="0"; div.style.transition="opacity .4s"; setTimeout(()=>div.remove(),400); }, ms || 5000);
}

            <span>Raum <b class="gold">${e.code}</b> als <b>${e.name}</b>
              <span class="muted small">· ${new Date(e.zeit).toLocaleDateString("de-DE")}</span></span>
            <span>
              <button class="btn-sm btn-primary" onclick="partieFortsetzen('${e.code}')">Weiterspielen</button>
              <button class="btn-sm" onclick="partieVergessen('${e.code}')">✕</button>
            </span>
          </div>`).join("")}
      </div>`:""}
      <button class="btn-lg" onclick="partienAuf()">🔎 Offene Partien</button>
      <button class="btn-lg" onclick="weltrangAuf()">🌍 Weltrangliste</button>
      <button class="btn-lg" onclick="zeige('title')">Zurück</button>`;
  },

  partien(){
    const liste = G._partienListe;
    const inhalt = liste === null
      ? '<p class="muted blink">Offene Partien werden geladen …</p>'
      : liste === "fehler"
        ? '<p class="red">Der Spielserver ist gerade nicht erreichbar.</p>'
        : !liste.length
          ? '<p class="muted">Keine öffentlichen Räume, eröffnet den ersten (Häkchen „öffentlich listen")!</p>'
          : liste.map(r=>`
            <div class="rowflex" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:6px 0">
              <span><b class="gold">${r.code}</b>${r.pass?" 🔒":""} · ${(r.namen||[]).join(", ")||"—"}
                <span class="muted small">· ${r.gestartet?"läuft":"in der Lobby"}${r.zuschauer?` · ${r.zuschauer} 👁️`:""}</span></span>
              <span>
                ${r.pass
                  ? `<button class="btn-sm" onclick="$('#mpCode')&&($('#mpCode').value='${r.code}');zeige('online')">Mit Passwort beitreten</button>`
                  : `<button class="btn-sm btn-primary" onclick="partieBeitreten('${r.code}', false)">Beitreten</button>
                     <button class="btn-sm" onclick="partieBeitreten('${r.code}', true)">👁️ Beobachten</button>`}
              </span>
            </div>`).join("");
    return `
      <h2>🔎 Offene Partien</h2>
      <div class="card">
        <div class="rowflex">Euer Name: <input type="text" id="pbName" maxlength="14" value="${(MP&&MP.name)||""}" placeholder="Regentenname"></div>
        ${inhalt}
        <p class="muted small" style="margin-top:8px">Gelistet werden Räume, deren Gastgeber „öffentlich listen"
        angehakt hat. Beobachter sehen die Partie live, spielen aber nicht mit.</p>
      </div>
      <button class="btn-sm" onclick="partienAuf()">🔄 Aktualisieren</button>
      <button class="btn-primary btn-lg" onclick="zeige(G._vorPartien || 'online')">Zurück</button>`;
  },

  weltrang(){
    const liste = G._weltrang;
    const inhalt = liste === null
      ? '<p class="muted blink">Rangliste wird geladen …</p>'
      : liste === "fehler"
        ? '<p class="red">Der Spielserver ist gerade nicht erreichbar.</p>'
        : !liste.length
          ? '<p class="muted">Noch keine Einträge, spielt die erste Online-Partie zu Ende!</p>'
          : `<table>
              <tr><th></th><th>Regent</th><th class="r">Titel</th><th class="r">Endjahr</th><th class="r">Punkte</th></tr>
              ${liste.map((e,i)=>`<tr style="${i===0?'color:var(--gold);font-weight:700':''}">
                <td>${i+1}.</td><td>${e.wappen||""} ${e.name}</td>
                <td class="r">${TITEL[e.titel]?TITEL[e.titel][0]:"?"}</td>
                <td class="r">${e.jahr}</td><td class="r">${fmt(e.punkte)}</td></tr>`).join("")}
            </table>`;
    return `
      <h2>🌍 Weltrangliste</h2>
      <div class="card">${inhalt}
        <p class="muted small" style="margin-top:8px">Die besten Regentschaften aller Online-Partien
        auf diesem Server. Der Gastgeber meldet die Ergebnisse am Partie-Ende.</p>
      </div>
      <button class="btn-primary btn-lg" onclick="zeige(G._vorRang || 'online')">Zurück</button>`;
  },

  lobby(){
    const zeilen = (MP.roster||[]).map((r,i)=>`
      <tr style="${r.z?'opacity:.6':''}"><td>${r.z?"👁️":WAPPEN[i%WAPPEN.length]} ${r.name}</td>
      <td class="r muted small">${r.z?"Zuschauer":r.host?"Gastgeber":"bereit"}${r.id===MP.id?" · Ihr":""}</td></tr>`).join("");
    return `
      <h2>🌐 Lobby. Raum <span class="gold">${MP.code}</span></h2>
      <div class="grid g2">
        <div class="card">
          <h3>Angetreten (${(MP.roster||[]).length}/9)</h3>
          <table>${zeilen}</table>
          <p class="muted small" style="margin-top:8px">Gebt den Code <b class="gold">${MP.code}</b>
          an Eure Mitspieler weiter. Die Reihenfolge hier ist die Sitzordnung (= Nachbarschaft).</p>
          <button class="btn-sm" onclick="einladungKopieren()">📋 Einladung kopieren</button>
          <p class="muted small" style="margin-top:4px">Eure Mitspieler öffnen ${location.protocol.indexOf("http")===0 ? "dieselbe Adresse" : "dieselbe Spieldatei oder Eure Online-Adresse"},
          wählen „Online spielen" und tragen Code und einen <b>eigenen</b> Namen ein.</p>
        </div>
        <div class="card">
          <h3>Partie</h3>
          ${MP.host ? `
            <div class="rowflex"><select id="mpTempo" style="width:100%">
              <option value="1">Original, lange Partie</option>
              <option value="1.8" selected>Kurzspiel</option>
              <option value="2.6">Blitz, für einen Abend</option>
            </select></div>
            <div class="rowflex"><select id="mpDiff" style="width:100%">
              <option value="1">Leicht</option><option value="2" selected>Normal</option><option value="3">Schwer</option>
            </select></div>
            <div class="rowflex"><select id="mpSzenario" style="width:100%">
              <option value="frei" selected>Freies Spiel</option>
              <option value="erbe">Das verschuldete Erbe</option>
              <option value="kriegstreiber">Die Kriegstreiber</option>
              <option value="kornkrise">Die Kornkrise</option>
            </select></div>
            <div class="rowflex">KI-Regenten dazu:
              <input type="number" id="mpKis" min="0" max="7" value="0" style="width:70px">
            </div>
            <button class="btn-primary btn-lg" onclick="mpStart()" ${(MP.roster||[]).length<1?'disabled':''}>Partie starten</button>`
          : `<p class="muted">Der Gastgeber wählt die Regeln und startet die Partie …</p>`}
        </div>
      </div>
      <button onclick="mpVerlassen()">Lobby verlassen</button>
      ${chatBox()}`;
  },

  warten(){
    const pend = G._pend;
    const wer = pend ? G.spieler[pend.fuer] : cur();
    const was = pend
      ? (pend.typ==="diplo" ? "entscheidet über eine Kriegs-Botschaft"
        : pend.typ==="aufD" ? "stellt heimlich die Verteidigung auf"
        : pend.typ==="belagerung" ? "belagert eine Festung"
        : pend.typ==="schlacht" || pend.typ==="schlachtplan" ? "führt eine Schlacht"
        : "ist am Zug")
      : "ist am Zug";
    const rang = [...G.spieler].sort((a,b)=>score(b)-score(a));
    const zeilen = rang.map(s=>`
      <tr><td><span class="dot" style="background:${s.farbe}"></span>${s.wappen} ${titelName(s)} ${s.name}${s.tot?" †":""}</td>
      <td class="r">${fmt(s.land)} ha</td><td class="r">${fmt(s.pop)}</td><td class="r">${staedte(s)}</td></tr>`).join("");
    return `
      <div class="hero" style="padding-bottom:16px">
        <span class="schild" style="box-shadow:inset 0 0 26px ${wer?wer.farbe:'#888'}66">${wer?wer.wappen:"⏳"}</span>
        <h1 style="font-size:28px;margin-top:12px">Anno ${G.jahr}</h1>
        <p style="font-size:17px;margin:12px 0 4px"><b class="gold">${wer?titelName(wer)+" "+wer.name:"…"}</b> ${was} …</p>
        <p class="muted small blink">${MP && MP.zuschauer ? "Ihr beobachtet diese Partie." : "Bitte warten. Euer Zug kommt."}</p>
      </div>
      <div class="card" style="max-width:640px;margin:0 auto">
        <h3>Die Reiche im Vergleich</h3>
        <table><tr><th>Regent</th><th class="r">Land</th><th class="r">Untertanen</th><th class="r">Städte</th></tr>${zeilen}</table>
      </div>
      ${MP && MP.host && MP.getrennt && Object.keys(MP.getrennt).length ? `
      <div class="card" style="max-width:640px;margin:14px auto 0;border-color:var(--red)">
        <h3>⚠️ Getrennte Regenten</h3>
        ${Object.keys(MP.getrennt).map(i=>`<button class="btn-sm" onclick="kiUebernehmen(${i})">🤖 ${G.spieler[i].name} der KI übergeben</button>`).join("")}
      </div>`:""}
      ${chatBox()}
      <div class="center" style="margin-top:10px"><button class="btn-sm" onclick="mpVerlassen()">Partie verlassen</button></div>`;
  },

  handoff(){
    const p = cur();
    const rang = [...G.spieler].sort((a,b)=>score(b)-score(a));
    const zeilen = rang.map(s=>`
      <tr style="${s===p?'color:var(--gold);font-weight:600':''}">
        <td><span class="dot" style="background:${s.farbe}"></span>${s.wappen} ${titelName(s)} ${s.name}${s.tot?" †":""}${s.ki?' <span class="muted small">(KI)</span>':""}</td>
        <td class="r">${fmt(s.land)} ha</td>
        <td class="r">${fmt(s.pop)}</td>
        <td class="r">${staedte(s)}</td>
      </tr>`).join("");
    const berichte = (G._kiBerichte||[]);
    return `
      <div class="hero" style="padding-bottom:16px">
        <span class="schild" style="box-shadow:inset 0 0 26px ${p.farbe}66, 0 6px 22px rgba(0,0,0,.45)">${p.wappen}</span>
        <h1 class="anno-pop" style="font-size:32px;letter-spacing:2px;margin-top:12px">Anno ${G.jahr} <span class="muted" style="font-size:16px">· ${saison().n}</span></h1>
        <p style="font-size:19px;margin:14px 0 6px"><b class="gold">${titelName(p)} ${p.name}</b> ist am Zug.</p>
        <p class="muted">Bitte an das Gerät treten. Der 90-Sekunden-Zähler startet mit dem Zug.</p>
        <div style="margin-top:20px"><button class="btn-primary btn-lg" onclick="beginneZug()">Zug beginnen</button></div>
      </div>
      <div style="position:relative;max-width:680px;margin:0 auto 14px">
        <canvas id="saisonband" width="920" height="200"
          style="display:block;width:100%;border-radius:14px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.35)"></canvas>
        <div class="anno-pop" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.75)">
          <div style="font-family:Georgia,serif;font-weight:bold;font-size:clamp(26px,6vw,42px);letter-spacing:2px;color:#f2ecd9">${SAISON_DEKO[saison().n].ico} ${saison().n}</div>
          <div style="font-family:Georgia,serif;font-size:clamp(15px,3.2vw,20px);color:var(--gold);margin-top:2px">Anno ${G.jahr}</div>
          <div style="font-size:clamp(12px,2.6vw,15px);color:rgba(240,236,220,.85);margin-top:6px">${SAISON_DEKO[saison().n].t}</div>
          <div style="font-size:clamp(11px,2.4vw,14px);color:var(--gold);margin-top:4px;text-align:center;padding:0 10px">⚖️ ${saisonFx().txt||""}</div>
        </div>
      </div>
      ${(G.botschaften||[]).filter(b=>b.an===G.aktiv).length?`
      <div class="card" style="max-width:640px;margin:0 auto 14px;border-color:rgba(224,180,88,.5)">
        <h3>📨 Botschaften an Euren Hof</h3>
        ${(G.botschaften||[]).filter(b=>b.an===G.aktiv).map(b=>`
          <p class="small" style="padding:3px 0"><b>${G.spieler[b.von]?G.spieler[b.von].wappen+" "+G.spieler[b.von].name:"?"}</b>
          <span class="muted">(Anno ${b.jahr}):</span> ${b.text}</p>
          ${b.art==="forderung"?`<div style="margin:2px 0 6px">
            <button class="btn-sm btn-primary" onclick="forderungZahlen(${G.botschaften.indexOf(b)})">💰 ${fmt(b.betrag)} T zahlen</button>
            <button class="btn-sm" onclick="forderungAblehnen(${G.botschaften.indexOf(b)})">Ablehnen</button>
          </div>`:""}`).join("")}
      </div>`:""}
      ${berichte.length?`
      <div class="card kiber" style="max-width:640px;margin:0 auto 14px">
        <h3>Derweil in den anderen Reichen …</h3>
        ${berichte.map(b=>`<p class="small" style="padding:2px 0">${b}</p>`).join("")}
      </div>`:""}
      ${G.spieler.length>1 && (!G.opt || G.opt.vergleich)?`
      <div class="card" style="max-width:640px;margin:0 auto">
        <h3>Die Reiche im Vergleich</h3>
        <table>
          <tr><th>Regent</th><th class="r">Land</th><th class="r">Untertanen</th><th class="r">Städte</th></tr>
          ${zeilen}
        </table>
      </div>`:""}`;
  },

  status(){
    const p = cur();
    const ziel = p.titel<8 ? BEDINGUNGEN[p.titel+1] : null;
    const nb = nachbarn(G.aktiv).map(i=>G.spieler[i].name).join(", ") || "—";
    return `
      ${stepper("Status")}
      <div style="display:flex;gap:18px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
        <canvas id="portraitS" width="120" height="150" style="border-radius:12px;border:1px solid var(--border);flex:0 0 auto"></canvas>
        <div>
          <h2 style="margin-bottom:4px">${anrede(p)}, ${titelName(p)} ${p.name}</h2>
          <p class="muted">${alterJahre(p)} Jahre alt · Anno ${G.jahr} · ${saison().n}</p>
          <button class="btn-sm" onclick="weltAuf()" style="margin-top:8px">🗺️ Gesamtkarte</button>
          <button class="btn-sm" onclick="statAuf()" style="margin-top:8px">📈 Statistik</button>
        </div>
      </div>
      ${p.auftrag && auftragArt(p.auftrag) ? (()=>{ const art = auftragArt(p.auftrag); return `
      <div class="card" style="border-color:rgba(224,180,88,.5)">
        <p><b class="gold">${art.ico} Reichsauftrag: ${art.n}</b> · ${art.txt(p.auftrag.ziel)}</p>
        <p class="muted small" style="margin-top:4px">Belohnung: ${fmt(p.auftrag.lohn)} Taler · Frist: Anno ${p.auftrag.frist}
          ${art.ok(p, p.auftrag) ? ' · <span class="green">Bedingung derzeit erfüllt, am Jahresende wird abgerechnet.</span>' : ""}</p>
      </div>`; })() : ""}
      ${(p.unruheJahre||0)>=1 && p.stimmung<25 ? `
      <div class="event bad">🔥 <b>Im Volk gärt es${(p.unruheJahre||0)>=2?" gewaltig":""}!</b>
        ${(p.unruheJahre||0)>=2?"Die Speicher wurden schon geplündert, ein Volksaufstand steht bevor."
        :"Anhaltendes Elend (Stimmung unter 15) führt binnen weniger Jahre zum Aufstand."}
        Mehr Korn, weniger Steuern, mildere Justiz oder ein Volksfest schaffen Abhilfe.</div>`:""}
      ${statKarten(p)}
      <div class="grid g2">
        <div class="card">
          <h3>Reich</h3>
          <table>
            <tr><td>Märkte</td><td class="r">${p.maerkte}</td></tr>
            <tr><td>Kornmühlen</td><td class="r">${p.muehlen}</td></tr>
            <tr><td>Städte <span class="muted small">(5 Märkte + 3 Mühlen)</span></td><td class="r">${staedte(p)}</td></tr>
            <tr><td>Bauplätze <span class="muted small">(1 je 1.000 ha)</span></td><td class="r">${p.maerkte+p.muehlen} / ${bauplaetze(p)}</td></tr>
            <tr><td>Anbaufläche <span class="muted small">(Bebauung frisst Acker)</span></td><td class="r">${fmt(anbau(p))} ha</td></tr>
            <tr><td>Heer <span class="muted small">(Unterhalt ${fmt(unterhalt(p))} T/Jahr)</span></td><td class="r">${fmt(heerGroesse(p.heer))} Mann</td></tr>
            <tr><td>Befestigung</td><td class="r">${(p.mauer||0)>0||(p.burg||0)>0?`Mauer ${p.mauer||0}/${MAUER_MAX}${(p.burg||0)>0?` · Burg ${p.burg||0}/${BURG_MAX}`:""}`:"—"}</td></tr>
            <tr><td>Charakterzug</td><td class="r">${zugVon(p)?`<span title="${zugVon(p).d}">${zugVon(p).ico} ${zugVon(p).n}</span>`:"—"}</td></tr>
            <tr><td>Privilegien <span class="muted small">(wachsen mit dem Rang)</span></td>
              <td class="r">${p.titel>=1 ? PRIVILEGIEN.slice(1, p.titel+1).filter(Boolean).map(pr=>`<span title="${pr.n}: ${pr.d}">${pr.ico}</span>`).join(" ") : "—"}</td></tr>
            <tr><td>Baustoffe <span class="muted small">(${p.forst||0} Forsthöfe, ${p.bruch||0} Steinbrüche)</span></td><td class="r">${fmt(p.holz||0)} 🪵 · ${fmt(p.stein||0)} 🪨</td></tr>
            <tr><td>Nachbarreiche</td><td class="r">${nb}</td></tr>
          </table>
        </div>
        <div class="card">
          <h3>Monumente</h3>
          <div class="monu">${svgPalast(p.palast)}${svgDom(p.dom)}</div>
          <p class="center muted small">Palast ${p.palast}/${PALAST_TEILE} · Kathedrale ${p.dom}/${DOM_TEILE}</p>
        </div>
      </div>
      ${ziel?`<div class="card goal"><h3>Nächste Beförderung: ${TITEL[p.titel+1][p.w?1:0]}</h3>
        <p>${ziel.txt}</p>
        <p class="muted small" style="margin-top:6px">Beförderung nur bei positivem Kontostand.</p></div>`:""}
      <div class="card">
        <h3>Reichskarte</h3>
        <canvas id="karteS" width="920" height="330"></canvas>
      </div>
      ${(p.chronik||[]).length>=3?`<div class="card"><h3>Chronik des Reiches</h3>${chronikChart(p)}</div>`:""}
      <button class="btn-primary btn-lg" onclick="zeige('korn')">Weiter: Kornausgabe</button>`;
  },

  korn(){
    const p = cur(), n = noetigKorn(p);
    return `
      ${stepper("Korn")}
      <h2>Kornausgabe an das Volk</h2>
      <div class="grid g2">
        <div class="card">
          <table>
            <tr><td>Kornspeicher</td><td class="r"><b>${fmt(p.korn)} Fuder</b></td></tr>
            <tr><td>Nötiges Korn <span class="muted small">(${fmt(p.pop)} Untertanen)</span></td><td class="r"><b class="gold">${fmt(n)} Fuder</b></td></tr>
          </table>
          <p class="muted small" style="margin-top:10px">Wer mehr als das nötige Korn ausgibt,
          lockt Einwanderer an und hebt die Stimmung. Wer weniger ausgibt, lässt sein Volk hungern.</p>
        </div>
        <div class="card">
          <h3>Ausgabe festlegen</h3>
          <div class="rowflex">
            <input type="number" id="ausg" min="0" max="${p.korn}" value="${Math.min(n,p.korn)}"> Fuder
          </div>
          <div class="rowflex">
            <button class="btn-sm" onclick="$('#ausg').value=${Math.min(n,p.korn)}">Nötig</button>
            <button class="btn-sm" onclick="$('#ausg').value=${Math.min(Math.ceil(n*1.25),p.korn)}">+25 %</button>
            <button class="btn-sm" onclick="$('#ausg').value=${Math.min(Math.ceil(n*1.5),p.korn)}">+50 %</button>
            <button class="btn-sm" onclick="$('#ausg').value=${p.korn}">Alles</button>
          </div>
        </div>
      </div>
      <button class="btn-primary btn-lg" onclick="kornAusgeben()">Ausgeben &amp; weiter</button>`;
  },

  handel(){
    const p = cur();
    return `
      ${stepper("Handel")}
      <h2>Markt. Korn- und Landhandel</h2>
      <div class="grid g2">
        <div class="card">
          <h3>🌾 Korn · ${fmt(p.kornPreis)} Taler / Fuder</h3>
          ${sparkline(p.kornHist)}
          <p class="muted small">Gemeinsamer Markt aller Reiche: große Verkäufe drücken den Kurs des
          Folgejahres, Aufkäufe treiben ihn. Spanne 20–430 Taler, 10 % Provision auf Verkäufe.</p>
          <p style="margin-top:8px">Lager: <b>${fmt(p.korn)} Fuder</b></p>
          <div class="rowflex">Kaufen: <input type="number" id="kkauf" min="0" value="0">
            <button class="btn-sm" onclick="$('#kkauf').value=${Math.max(0,Math.floor(p.geld/p.kornPreis))}">Max</button>
            <button onclick="handelKorn(1)">Kauf</button></div>
          <div class="rowflex">Verkaufen: <input type="number" id="kverk" min="0" max="${p.korn}" value="0">
            <button class="btn-sm" onclick="$('#kverk').value=${p.korn}">Max</button>
            <button onclick="handelKorn(-1)">Verkauf</button></div>
        </div>
        <div class="card">
          <h3>🌍 Land · ${fmt(p.landPreis)} Taler / ha</h3>
          <p class="muted small">Schwankt zwischen 16 und 70 Talern. Auf Verkäufe werden 10 % Provision fällig.
          Land unter Euren Gebäuden ist unverkäuflich.</p>
          <p style="margin-top:8px">Angebot am Markt: <b>${fmt(p.landAngebot||0)} ha</b> · Euer verkäufliches Land: <b>${fmt(freiLand(p))} ha</b></p>
          <div class="rowflex">Kaufen: <input type="number" id="lkauf" min="0" max="${p.landAngebot||0}" value="0">
            <button class="btn-sm" onclick="$('#lkauf').value=${Math.max(0,Math.min(p.landAngebot||0,Math.floor(p.geld/p.landPreis)))}">Max</button>
            <button onclick="handelLand(1)">Kauf</button></div>
          <div class="rowflex">Verkaufen: <input type="number" id="lverk" min="0" max="${freiLand(p)}" value="0">
            <button class="btn-sm" onclick="$('#lverk').value=${freiLand(p)}">Max</button>
            <button onclick="handelLand(-1)">Verkauf</button></div>
        </div>
      </div>
      <div class="card">

          <button class="btn-sm" onclick="handelMaterial('stein',1)">Kauf</button>
          <button class="btn-sm" onclick="handelMaterial('stein',-1)">Verkauf</button></div>
      </div>
      <div class="card"><b>Vermögen: <span class="${p.geld<0?'red':'gold'}">${fmt(p.geld)} Taler</span></b>
        <span id="hmsg" class="red" style="margin-left:16px"></span></div>
      <button class="btn-primary btn-lg" onclick="handelFertig()">Weiter: Zwischenbilanz</button>`;
  },

  zwbilanz(){
    const p = cur(), r = p.zb;
    const evHtml = r.ereignisse.length
      ? r.ereignisse.map(e=>`<div class="event ${e.c}">${e.t}</div>`).join("") : "";
    const row = (lbl,val,cls="") => `<tr><td>${lbl}</td><td class="r ${cls}">${val}</td></tr>`;
    return `
      ${stepper("Zw.-Bilanz")}
      <h2>Zwischenbilanz</h2>
      ${evHtml}
      <div class="card">
        <table>
          ${row("Geburten", "+"+fmt(r.geburten), "delta-pos")}
          ${row("Natürliche Todesfälle", "−"+fmt(r.tote), "delta-neg")}
          ${r.verhungert?row("Verhungert", "−"+fmt(r.verhungert), "delta-neg"):""}
          ${row(r.migration>=0?"Einwanderung":"Abwanderung", (r.migration>=0?"+":"−")+fmt(Math.abs(r.migration)), r.migration>=0?"delta-pos":"delta-neg")}
          ${row("Untertanen jetzt", "<b>"+fmt(p.pop)+"</b>")}
          ${row("Stimmung des Volkes", p.stimmung+"/100" + (p.stimmung<15?' <span class="red">⚠️ Revolutionsgefahr!</span>':''))}
        </table>
      </div>
      ${r.verhungert?'<div class="event bad">Euer Volk hungert! Das spricht sich im Reich herum.</div>':""}
      ${p.erbe && !p.erbe.zug ? `
      <div class="card" style="border-color:rgba(224,180,88,.5)">
        <h3>🍼 Die Erziehung von ${p.erbe.name}</h3>
        <p class="muted small">Wem vertraut Ihr ${p.erbe.w?"Eure Tochter":"Euren Sohn"} an? Die Erziehung
        bestimmt den Charakterzug, mit dem ${p.erbe.name} dereinst das Erbe antritt.</p>
        ${ERZIEHUNG.map(e=>`
        <div class="rowflex" style="justify-content:space-between;margin-top:6px">
          <span>${e.ico} <b>${e.n}</b><br><span class="muted small">${e.d}</span></span>
          <button class="btn-sm" onclick="erziehen('${e.zug}')">Wählen</button>
        </div>`).join("")}
      </div>`:""}
      ${p.erbe && p.erbe.zug ? `<p class="muted small">🍼 Thronfolge: <b>${p.erbe.name}</b> (${G.jahr - p.erbe.geb} Jahre),
        erzogen ${(ERZIEHUNG.find(x=>x.zug===p.erbe.zug)||{n:""}).n.toLowerCase()}.</p>`:""}
      <button class="btn-primary btn-lg" onclick="nachZwischenbilanz()">Weiter: Steuern</button>`;
  },

  entscheidung(){
    const p = cur(), e = G._ereignis;
    if(!e){ setTimeout(()=>zeige("steuern"),10); return ""; }
    const knoepfe = e.wahl.map((w,k)=>{
      const label = typeof w.t === "function" ? w.t(p) : w.t;
      return `<button class="btn-lg wahl-knopf" onclick="ereignisWahl(${k})">
        <span class="wahl-nr">${k+1}</span> ${label}</button>`;
    }).join("");
    return `
      ${stepper("Zw.-Bilanz")}
      <div class="pergament" style="max-width:660px;margin:0 auto">
        <div class="center"><span class="ereignis-ico">${e.ico}</span></div>
        <h2 class="center" style="padding-bottom:4px">Eine Entscheidung, ${titelName(p)}!</h2>
        <div class="zierlinie"></div>
        <p style="font-size:16px;text-align:center;max-width:560px;margin:10px auto">${e.txt(p)}</p>
        <div class="rowflex center" style="justify-content:center;margin-top:12px">
          <span class="res-chip">💰 ${fmt(p.geld)} T</span>
          <span class="res-chip">🌾 ${fmt(p.korn)} Fuder</span>
          <span class="res-chip">👥 ${fmt(p.pop)}</span>
          <span class="res-chip">${p.stimmung>=60?'😊':p.stimmung>=35?'😐':'😠'} ${p.stimmung}/100</span>
        </div>
      </div>
      <div style="max-width:660px;margin:12px auto 0">${knoepfe}</div>`;
  },

  ereignisErgebnis(){
    const er = G._ereignisErgebnis;
    if(!er){ setTimeout(()=>zeige("steuern"),10); return ""; }
    const zeilen = er.deltas.map(d=>`
      <tr><td>${d.ico} ${d.name}</td>
        <td class="r ${d.d>0?'green':'red'}" style="font-weight:700">
          ${d.d>0?"+":"−"}${fmt(Math.abs(d.d))}${d.einheit}</td></tr>`).join("");
    return `
      ${stepper("Zw.-Bilanz")}
      <div class="pergament" style="max-width:660px;margin:0 auto">
        <div class="center"><span class="ereignis-ico" style="animation:none">${er.ico}</span></div>
        <h2 class="center" style="padding-bottom:4px">Die Folgen Eurer Entscheidung</h2>
        <div class="zierlinie"></div>
        <p class="muted small center" style="margin-top:8px">Ihr wähltet: „${er.wahl}"</p>
        <p style="font-size:16px;text-align:center;max-width:560px;margin:10px auto">${er.txt}</p>
        ${er.deltas.length
          ? `<table style="max-width:340px;margin:14px auto 4px">${zeilen}</table>`
          : `<p class="muted center" style="margin-top:12px">Diesmal bleibt Euer Reich unberührt, doch man wird sich Eure Wahl merken.</p>`}

      </div>

        <button class="btn-primary btn-lg" onclick="G._ereignisErgebnis=null;zeige('steuern')">Weiter: Steuern</button>
      </div>`;
  },

  steuern(){
    const p = cur();
    const slider = (id,lbl,min,max,val) => `
      <div class="sliderrow">
        <span>${lbl}</span>
        <input type="range" id="${id}" min="${min}" max="${max}" value="${val}"
          oninput="$('#${id}v').textContent=this.value+' %'">
        <span class="v" id="${id}v">${val} %</span>
      </div>`;
    return `
      ${stepper("Steuern")}
      <h2>Steuern &amp; Justiz</h2>
      <div class="card">
        ${slider("zoll","Zölle",0,40,p.zoll)}
        ${slider("einkSt","Einkommensteuer",0,99,p.einkSt)}
        ${slider("mwSt","Mehrwertsteuer",0,40,p.mwSt)}
        <div class="sliderrow">
          <span>Justiz</span>
          <select id="justiz">
            ${[1,2,3,4].map(j=>`<option value="${j}" ${p.justiz===j?'selected':''}>${JUSTIZ[j]}</option>`).join("")}
          </select><span></span>
        </div>
        <p class="muted small">Hohe Steuern füllen die Kasse, aber drücken die Stimmung,
        unzufriedene Untertanen wandern ab. Gierige Justiz vergrämt das Volk.</p>
      </div>
      <button class="btn-primary btn-lg" onclick="steuernSetzen()">Weiter: Landkarte &amp; Bauen</button>`;
  },

    const p = cur();

    const bBtn = (label,fn,ok) => `<button onclick="${fn}" ${ok?'':'disabled'}>${label}</button>`;
    const gegner = lebende().filter(x=>x.i!==G.aktiv);
    const kriegOk = p.titel>=1 && !p.kriegGefuehrt && gegner.length>0
      && (heerGroesse(p.heer)>0 || miliz(p)>0);
    return `
      ${stepper("Bauen")}

          ${bBtn(`Forsthof ${p.forst||0}/${FORST_MAX} · ${fmt(KOSTEN.forst)} T <span class="muted small">(+30 🪵/J)</span>`,"baue('forst')",
              (p.forst||0)<FORST_MAX && p.geld>=KOSTEN.forst && p.land>=3000)}
          ${bBtn(`Steinbruch ${p.bruch||0}/${BRUCH_MAX} · ${fmt(KOSTEN.bruch)} T${matText('bruch')} <span class="muted small">(+20 🪨/J)</span>`,"baue('bruch')",
              (p.bruch||0)<BRUCH_MAX && p.geld>=KOSTEN.bruch && p.land>=5000 && hatMaterial(p,'bruch'))}
          ${bBtn(`Hafen ${p.haefen||0}/2 · ${fmt(KOSTEN.hafen)} T${matText('hafen')}`,"baue('hafen')",
              (p.haefen||0)<2 && p.geld>=KOSTEN.hafen && p.land>=12000 && hatMaterial(p,'hafen'))}
          ${bBtn(`Stadtmauer ${p.mauer||0}/${MAUER_MAX} · ${fmt(KOSTEN.mauer)} T${matText('mauer')}`,"baue('mauer')",
              (p.mauer||0)<MAUER_MAX && p.geld>=KOSTEN.mauer && p.maerkte>=2 && hatMaterial(p,'mauer'))}
          ${bBtn(`Burg ${p.burg||0}/${BURG_MAX} · ${fmt(KOSTEN.burg)} T${matText('burg')}`,"baue('burg')",
              (p.burg||0)<BURG_MAX && p.geld>=KOSTEN.burg && (p.mauer||0)>=1 && p.land>=8000 && hatMaterial(p,'burg'))}
          ${(p.mauer||0)<MAUER_MAX && p.maerkte<2?`<p class="muted small">Die Stadtmauer verlangt mindestens 2 Märkte.</p>`:""}
          ${bBtn(`Palast-Teil ${p.palast}/${PALAST_TEILE} · ${fmt(KOSTEN.palastTeil)} T${matText('palastTeil')}`,"baue('palast')",
              p.palast<PALAST_TEILE && p.geld>=KOSTEN.palastTeil && p.land>=LAND.palast && hatMaterial(p,'palastTeil'))}
          ${bBtn(`Dom-Teil ${p.dom}/${DOM_TEILE} · ${fmt(KOSTEN.domTeil)} T${matText('domTeil')}`,"baue('dom')",
              p.dom<DOM_TEILE && p.geld>=KOSTEN.domTeil && p.land>=LAND.dom && hatMaterial(p,'domTeil'))}
          ${p.land<LAND.palast?`<p class="muted small">Für den Palast fehlen Euch noch ${fmt(LAND.palast-p.land)} ha Land.</p>`:
            p.land<LAND.dom && p.palast>=PALAST_TEILE?`<p class="muted small">Für die Kathedrale fehlen Euch noch ${fmt(LAND.dom-p.land)} ha Land.</p>`:""}
        </div>
        <div class="card">
          <h3>⚔️ Militär <span class="muted small">· stehendes Heer</span></h3>
          <table>
            <tr><td>Infanterie <span class="muted small">${fmt(KOSTEN.inf)} T, Sold 10 T/J</span></td>
                <td class="r">${fmt(p.heer.inf)}</td>
                <td class="r"><button class="btn-sm" onclick="werbe('inf',10)" ${p.geld>=KOSTEN.inf*10?'':'disabled'}>+10</button></td></tr>
            <tr><td>Kavallerie <span class="muted small">${fmt(KOSTEN.kav)} T, Sold 25 T/J</span></td>
                <td class="r">${fmt(p.heer.kav)}</td>

            <p class="muted small">Überstandene Schlachten härten das Heer, frische Rekruten verwässern die Erfahrung.</p>
          </div>`:""}
          <p class="muted small" style="margin-top:6px">Unterhalt: <b>${fmt(unterhalt(p))} T/Jahr</b>
           , der Sold steigt mit Eurem Rang (+10 % je Titel)${p.feldherr?" · darin 500 T Feldherren-Sold":""}.</p>
          ${p.titel<1?`<div class="event bad" style="margin-top:8px">⚠️ Als einfache${p.w?"":"r"} ${titelName(p)} dürft
            Ihr noch keinen Krieg erklären, erst ab dem Rang <b>Baron</b> (${BEDINGUNGEN[1].txt}).
            Söldner kosten bis dahin nur Sold!</div>`:""}
          ${heerGroesse(p.heer)>0?`<button class="btn-sm" onclick="entlassen()">Heer auflösen</button>`:""}
        </div>
        <div class="card">
          <h3>🎖️ Feldherr</h3>
          ${p.feldherr ? (()=>{ const fa = feldherrArt(p); return `
            <p><b>${fa.ico} ${fa.n}</b> · ${fa.t}
              ${"⭐".repeat(Math.min(p.feldherr.ruhm||0,5)) || '<span class="muted small">noch ohne Ruhm</span>'}</p>
            <p class="muted small" style="margin-top:4px">${fa.d}
              ${p.feldherr.ruhm?` · Jeder Siegesruhm (bis 5) verstärkt seine Boni.`:""}</p>
            <p class="muted small">Sold: 500 T/Jahr · fällt er in einer verlorenen Schlacht, ist er verloren.</p>
            <button class="btn-sm" onclick="feldherrEntlassen()">Aus dem Dienst entlassen</button>`; })() : `
            <p class="muted small">Ein Feldherr führt Eure Truppen mit eigener Handschrift.
              Antrittsgeld 2.500 T, Sold 500 T/Jahr. Siege mehren seinen Ruhm und seine Wirkung.</p>
            ${FELDHERREN.map(f=>`
              <div class="rowflex" style="justify-content:space-between;margin-top:6px">
                <span>${f.ico} <b>${f.n}</b> · ${f.t}<br><span class="muted small">${f.d}</span></span>
                <button class="btn-sm" onclick="feldherrAnwerben('${f.id}')" ${p.geld>=2500?'':'disabled'}>Anwerben</button>
              </div>`).join("")}`}
        </div>
      </div>
      <div class="card">
        <h3>🎪 Hof, Feste & Fahrten</h3>
        <div class="rowflex">
          <button onclick="volksfest()" ${p.festJahr===G.jahr?'disabled':''}>${p.festJahr===G.jahr?"🎉 Volksfest gegeben (+10 Stimmung)":"🎪 Volksfest geben (800 T, +10 Stimmung)"}</button>
          <button onclick="turnierStarten()" ${p.turnierJahr===G.jahr||p.titel<2?'disabled':''}>${p.turnierJahr===G.jahr?"🏇 Turnier fand heuer statt":`🏇 Ritterturnier ausrichten (2.000 T${p.titel<2?", ab Graf":""})`}</button>
          <button onclick="expeditionStarten()" ${p.expedition?'disabled':''}>⛵ Expedition ausrüsten (2.500 T)</button>
        </div>
        <p class="muted small" style="margin-top:6px">Das Turnier lädt alle Höfe (+4 Verhältnis); wer die Tjost
        gewinnt, erntet Ruhm. Die Expedition kehrt nach 2 bis 4 Jahren zurück, mit Schätzen, Waren,
        Seekarten, oder gar nicht${(p.haefen||0)>0?" · Euer Hafen verbessert die Aussichten":""}.
        ${p.expedition?`<b class="gold">Eure Expedition ist seit Anno ${p.expedition.start} auf See (Rückkehr ~Anno ${p.expedition.start+p.expedition.dauer}).</b>`:""}

  },

  diplo(){
    setTimeout(eheAussicht, 40);
    const p = cur();
    const ziele = lebende().filter(x=>x.i!==G.aktiv);
    const opts = ziele.map(z=>`<option value="${z.i}" ${z.i===G._dipZielMerk?"selected":""}>${z.p.wappen} ${titelName(z.p)} ${z.p.name}${z.p.ki?` (${KI_TYP_NAMEN[z.p.kiTyp]||"KI"})`:""}</option>`).join("");
    const zielIdx = ziele.length ? ziele[0].i : -1;
    const bezZeilen = ziele.map(z=>{
      const w = bezWert(p, z.p);
      const lbl = w>40?"freundschaftlich":w>10?"wohlwollend":w>-10?"neutral":w>-40?"kühl":"feindselig";
      return `<tr><td>${z.p.wappen} ${z.p.name}</td>
        <td class="r ${w>10?'green':w<-10?'red':''}">${w>0?"+":""}${w} · ${lbl}</td>
        <td class="r">${routeAktiv(G.aktiv,z.i)?"🚚 ":""}${buendnisAktiv(p,z.p)?`🛡️ Bündnis bis ${p.buendnisse[z.i]}`:eheAktiv(p,z.p)?`💍 Ehe bis ${p.ehen[z.i]}`:paktAktiv(p,z.p)?`🕊️ Pakt bis ${p.pakte[z.i]}`:"—"}</td></tr>`;
    }).join("");

          <p class="muted small" style="margin-top:6px">Geschenke und faire Geschäfte verbessern das

        </div>
        <div class="card">
          <h3>${diploLimit(p)} Aktion${diploLimit(p)>1?"en":""} pro Jahr ${(p.diploZaehler||0)>=diploLimit(p)?'<span class="red small">(aufgebraucht)</span>':''}</h3>
          <div class="rowflex">Partner: <select id="dipZiel" onchange="G._dipZielMerk=+this.value;eheAussicht()">${opts}</select></div>
