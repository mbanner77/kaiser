    ctx.fillStyle = "rgba(240,190,210,.7)";
    for(let i=0;i<12;i++){
      const seedX = ((i*59)%87)/87, seedS = ((i*37)%79)/79;
      const fx2 = cx - rr*1.3 + ((seedX*rr*2.6 + Math.sin(t/700 + i)*24 + t/(90+seedS*60)) % (rr*2.6));
      const fy2 = cy - rr*0.85 + ((t/(45+seedS*35) + i*61) % (rr*1.7));
      ctx.beginPath(); ctx.ellipse(fx2, fy2, 2.2, 1.3, t/600+i, 0, 7); ctx.fill();
    }
  }
  /* Wolkenschatten ziehen über das Land */
  for(let w=0;w<2;w++){
    const wx2 = cx - rr*1.4 + (((t/95) + w*rr*1.7) % (rr*3.2));
    ctx.fillStyle = "rgba(0,0,10,.07)";
    ctx.beginPath(); ctx.ellipse(wx2, cy + (w?rr*0.3:-rr*0.25), rr*0.5, rr*0.22, 0.3, 0, 7); ctx.fill();
  }
  ctx.restore();
  /* Sandiger Uferstreifen entlang der Grenze */
  ctx.save();
  malBlob(ctx, pts);
  ctx.strokeStyle = sn.schnee ? "rgba(210,215,222,.35)" : "rgba(196,172,120,.38)";
  ctx.lineWidth = 7; ctx.stroke();
  ctx.restore();
  /* Vogelschwarm zieht in V-Formation über das Land (nicht im Winter) */
  if(!sn.schnee){
    const zug = ((t/38) % (W + 260)) - 130;
    const zy = H*0.16 + Math.sin(t/900)*10;
    ctx.strokeStyle = "rgba(30,34,44,.55)"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
    for(let v=0; v<7; v++){
      const reihe = Math.ceil(v/2), seite = v%2 ? 1 : -1;
      const vx = zug - reihe*13, vy = zy + seite*reihe*7 + Math.sin(t/160 + v)*1.5;
      const fl = Math.sin(t/110 + v*1.3)*2.6;      /* Flügelschlag */
      ctx.beginPath();
      ctx.moveTo(vx-4, vy - fl); ctx.quadraticCurveTo(vx, vy+1.5, vx+4, vy - fl);
      ctx.stroke();
    }
  }
  /* Grenze */
  malBlob(ctx, pts);
  ctx.strokeStyle = p.farbe; ctx.lineWidth = 2.5; ctx.setLineDash([9,6]);
  ctx.stroke(); ctx.setLineDash([]);
  /* Grenzbanner (wehen im Wind) */
  for(const bi of [2,7,12]){
    const [bx,by] = pts[bi];
    ctx.fillStyle = "#6b5433"; ctx.fillRect(bx-1, by-20, 2.5, 20);
    ctx.fillStyle = p.farbe;
    const wf = Math.sin(t/260 + bi)*2.5;
    ctx.beginPath(); ctx.moveTo(bx+1.5,by-20);
    ctx.quadraticCurveTo(bx+7, by-18.5+wf, bx+13, by-16.5+wf);
    ctx.quadraticCurveTo(bx+7, by-14.5+wf*0.5, bx+1.5, by-13);
    ctx.closePath(); ctx.fill();
  }
  /* Kartusche */
  ctx.fillStyle = "rgba(13,17,23,.78)";
  ctx.fillRect(10, H-34, 240, 26);
  ctx.strokeStyle = "#2a3446"; ctx.strokeRect(10, H-34, 240, 26);
  ctx.fillStyle = "#dbe2ee"; ctx.font = "600 13px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`${p.wappen} ${titelName(p)} ${p.name}s Reich · ${fmt(p.land)} ha · ${sn.n}`, 18, H-16);
  /* Kompass */
  ctx.strokeStyle = "#8b96a8"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(W-30, 30, 13, 0, 7); ctx.stroke();
  ctx.fillStyle = "#e0b458";
  ctx.beginPath(); ctx.moveTo(W-30,18); ctx.lineTo(W-26,32); ctx.lineTo(W-30,29); ctx.lineTo(W-34,32); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8b96a8"; ctx.font = "10px sans-serif"; ctx.textAlign="center";
  ctx.fillText("N", W-30, 14);
  malKartenRahmen(ctx, W, H);
}
/* Goldener Doppelrahmen mit Eckzier, wie auf alten Stichen */
function malKartenRahmen(ctx, W, H){
  ctx.save();
  ctx.strokeStyle = "rgba(224,180,88,.45)"; ctx.lineWidth = 2;
  ctx.strokeRect(5, 5, W-10, H-10);
  ctx.strokeStyle = "rgba(224,180,88,.18)"; ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, W-20, H-20);
  ctx.strokeStyle = "rgba(224,180,88,.45)"; ctx.lineWidth = 1.5;
  ctx.fillStyle = "rgba(224,180,88,.45)";
  for(const [ecx, ecy, sx, sy] of [[5,5,1,1],[W-5,5,-1,1],[5,H-5,1,-1],[W-5,H-5,-1,-1]]){
    ctx.beginPath();
    ctx.moveTo(ecx + sx*20, ecy);
    ctx.quadraticCurveTo(ecx + sx*4, ecy + sy*4, ecx, ecy + sy*20);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ecx + sx*9, ecy + sy*9, 1.8, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- Gesamtkarte: alle Reiche im Nachbarschaftskreis ---------- */
function zeichneWelt(t=0){
  const c = document.getElementById("welt");
  if(!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  /* Das Weltmeer: tiefes Blau mit Strömungslinien */
  const meer = ctx.createLinearGradient(0,0,0,H);
  meer.addColorStop(0,"#0e1826"); meer.addColorStop(0.55,"#12202f"); meer.addColorStop(1,"#0d1622");
  ctx.fillStyle = meer; ctx.fillRect(0,0,W,H);
  const wr = mulberry(999);
  /* Wellenlinien wandern gemächlich */
  ctx.strokeStyle = "rgba(120,160,200,.07)"; ctx.lineWidth = 1.2;
  for(let wl=0; wl<9; wl++){
    const wy2 = (wl+0.5)*H/9 + Math.sin(t/1400 + wl)*3;
    ctx.beginPath();
    for(let x2=0; x2<=W; x2+=18)
      ctx.lineTo(x2, wy2 + Math.sin(x2/46 + t/700 + wl*1.7)*2.6);
    ctx.stroke();
  }
  /* Seeglitzern */
  ctx.fillStyle = "rgba(200,225,250,.10)";
  for(let i=0;i<16;i++){
    const gx2 = (wr()*W + t/(40+wr()*40)) % W;
    ctx.beginPath(); ctx.arc(gx2, wr()*H, 1+wr()*1.1, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "rgba(46,70,56,.16)";
  for(let i=0;i<30;i++){ ctx.beginPath(); ctx.arc(wr()*W, wr()*H, wr()*30+8, 0, 7); ctx.fill(); }
  /* Wal: taucht periodisch auf und bläst eine Fontäne */
  {
    const walP = (t % 16000) / 16000;
    if(walP > 0.1 && walP < 0.4){
      const q = (walP - 0.1) / 0.3;
      const auf = Math.sin(q * Math.PI);
      const wx3 = W*0.16, wy3 = H*0.82;
      ctx.save(); ctx.globalAlpha = Math.min(1, auf*1.6);
      ctx.fillStyle = "#2c3a4a";
      ctx.beginPath(); ctx.ellipse(wx3, wy3 - auf*4, 16, 5.5*auf + 1, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(wx3+15, wy3-2); ctx.quadraticCurveTo(wx3+24, wy3-9*auf, wx3+27, wy3-2);
      ctx.quadraticCurveTo(wx3+23, wy3-1, wx3+15, wy3-1); ctx.fill();
      if(q > 0.3 && q < 0.75){
        const fq = (q-0.3)/0.45;
        ctx.strokeStyle = `rgba(200,230,250,${0.7*(1-fq)})`; ctx.lineWidth = 1.4;
        for(const sw of [-1,0,1]){
          ctx.beginPath(); ctx.moveTo(wx3-6, wy3 - auf*4 - 2);
          ctx.quadraticCurveTo(wx3-6 + sw*5, wy3 - auf*4 - 8 - fq*7, wx3-6 + sw*8, wy3 - auf*4 - 5 - fq*10);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  }
  /* Seeschlange nach Art alter Karten, samt Warnung */
  {
    const sx6 = W*0.845, sy6 = H*0.155;
    ctx.save();
    ctx.strokeStyle = "rgba(120,160,150,.5)"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    for(let b3=0; b3<3; b3++){
      const ph3 = t/900 + b3*1.1;
      ctx.beginPath();
      ctx.arc(sx6 + b3*15 - 15, sy6 + Math.sin(ph3)*1.5, 6, Math.PI*1.1, Math.PI*1.9);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(120,160,150,.55)";
    ctx.beginPath(); ctx.moveTo(sx6+24, sy6-3); ctx.lineTo(sx6+31, sy6-7); ctx.lineTo(sx6+30, sy6+1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(139,150,168,.55)"; ctx.font = "italic 10px Georgia, serif"; ctx.textAlign = "center";
    ctx.fillText("Hic sunt dracones", sx6 + 5, sy6 + 18);
    ctx.restore();
  }
  const n = G.spieler.length;
  const cx = W/2, cy = H/2 + 4, ex = W*0.36, ey = H*0.32;
  const pos = G.spieler.map((_,i)=>{
    const a = -Math.PI/2 + i/n*6.2832;
    return [cx + Math.cos(a)*ex*(n>1?1:0), cy + Math.sin(a)*ey*(n>1?1:0)];
  });
  /* Handelswege zwischen lebenden Nachbarn */
  const leb = lebende().map(x=>x.i);
  if(leb.length > 1){
    ctx.strokeStyle = "rgba(209,187,138,.25)"; ctx.lineWidth = 2; ctx.setLineDash([5,7]);
    const paare = leb.length===2 ? [[leb[0],leb[1]]] : leb.map((a,k)=>[a, leb[(k+1)%leb.length]]);
    for(const [a,b] of paare){
      ctx.beginPath(); ctx.moveTo(pos[a][0], pos[a][1]);
      ctx.quadraticCurveTo(cx, cy, pos[b][0], pos[b][1]); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  /* Aktive Handelsrouten: goldene Wege mit wandernden Karawanen */
  for(const r of (G.routen||[])){
    const A = pos[r.a], B = pos[r.b];
    if(!A || !B || G.spieler[r.a].tot || G.spieler[r.b].tot) continue;
    ctx.strokeStyle = "rgba(224,180,88,.55)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]);
    ctx.quadraticCurveTo(cx, cy, B[0], B[1]); ctx.stroke();
    /* Karawane pendelt auf der Kurve */
    const phase = (Math.sin(t/1400 + (r.a*3+r.b)) + 1) / 2;
    const q = 1-phase;
    const kx = q*q*A[0] + 2*q*phase*cx + phase*phase*B[0];
    const ky = q*q*A[1] + 2*q*phase*cy + phase*phase*B[1];
    ctx.fillStyle = "#e0b458";
    ctx.fillRect(kx-4, ky-3, 8, 5);
    ctx.fillStyle = "#8a5a2a";
    ctx.beginPath(); ctx.arc(kx-2.5, ky+3, 1.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(kx+2.5, ky+3, 1.6, 0, 7); ctx.fill();
  }
  /* Ehen und Bündnisse als Verbindungslinien mit Siegel in der Mitte */
  const siegel = [];
  for(let a2=0; a2<n; a2++) for(let b2=a2+1; b2<n; b2++){
    const A2 = G.spieler[a2], B2 = G.spieler[b2];
    if(A2.tot || B2.tot) continue;
    const ehe = eheAktiv(A2, B2), bnd = buendnisAktiv(A2, B2);
    if(!ehe && !bnd) continue;
    const mx2 = (pos[a2][0]+pos[b2][0])/2*0.62 + cx*0.38;
    const my2 = (pos[a2][1]+pos[b2][1])/2*0.62 + cy*0.38;
    ctx.strokeStyle = bnd ? "rgba(140,180,220,.5)" : "rgba(220,140,170,.45)";
    ctx.lineWidth = 2;
    ctx.setLineDash(bnd ? [] : [2,5]);
    ctx.beginPath(); ctx.moveTo(pos[a2][0], pos[a2][1]);
    ctx.quadraticCurveTo(mx2, my2, pos[b2][0], pos[b2][1]); ctx.stroke();
    ctx.setLineDash([]);
    const qm = 0.5;
    const zx = (1-qm)*(1-qm)*pos[a2][0] + 2*(1-qm)*qm*mx2 + qm*qm*pos[b2][0];
    const zy = (1-qm)*(1-qm)*pos[a2][1] + 2*(1-qm)*qm*my2 + qm*qm*pos[b2][1];
    siegel.push([zx, zy, bnd ? "🛡️" : "💍"]);
  }
  /* Anrückende Heere: rote Marschlinie mit wandernden Truppenpunkten */
  for(const ag of (G._angriffe||[])){
    const A2 = pos[ag.kr.a], B2 = pos[ag.kr.d];
    if(!A2 || !B2) continue;
    ctx.strokeStyle = "rgba(219,90,90,.6)"; ctx.lineWidth = 2.5; ctx.setLineDash([8,6]);
    ctx.lineDashOffset = -t/40;
    ctx.beginPath(); ctx.moveTo(A2[0], A2[1]);
    ctx.quadraticCurveTo(cx, cy, B2[0], B2[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
    for(let tr=0; tr<3; tr++){
      const q2 = ((t/2600) + tr*0.18) % 1;
      const iq = 1-q2;
      const tx = iq*iq*A2[0] + 2*iq*q2*cx + q2*q2*B2[0];
      const ty = iq*iq*A2[1] + 2*iq*q2*cy + q2*q2*B2[1];
      ctx.fillStyle = "rgba(219,90,90,.85)";
      ctx.beginPath(); ctx.arc(tx, ty, 2.4, 0, 7); ctx.fill();
    }
    const mxk = (A2[0]+B2[0])/2*0.5 + cx*0.5, myk = (A2[1]+B2[1])/2*0.5 + cy*0.5;
    const puls2 = 1 + Math.sin(t/220)*0.12;
    ctx.save(); ctx.translate(mxk, myk); ctx.scale(puls2, puls2);
    ctx.font = "15px sans-serif"; ctx.textAlign = "center"; ctx.fillText("⚔️", 0, 5);
    ctx.restore();
  }
  /* Reiche */
  G.spieler.forEach((p,i)=>{
    const [px,py] = pos[i];
    const rrW = 24 + 34*Math.sqrt(Math.min(p.land,50000)/50000);
    const rngB = mulberry(i*97+5);
    ctx.save();
    if(p.tot) ctx.globalAlpha = 0.45;
    const bl = [];
    for(let k=0;k<10;k++){
      const a = k/10*6.2832;
      bl.push([px+Math.cos(a)*rrW*(0.8+rngB()*0.35)*1.25, py+Math.sin(a)*rrW*(0.8+rngB()*0.35)*0.8]);
    }
    ctx.beginPath();
    ctx.moveTo((bl[0][0]+bl[9][0])/2,(bl[0][1]+bl[9][1])/2);
    for(let k=0;k<10;k++){
      const nx = bl[(k+1)%10];
      ctx.quadraticCurveTo(bl[k][0], bl[k][1], (bl[k][0]+nx[0])/2, (bl[k][1]+nx[1])/2);
    }
    ctx.closePath();
    /* Flachwasser-Halo um die Küste */
    ctx.save();
    ctx.strokeStyle = "rgba(120,170,210,.16)"; ctx.lineWidth = 9; ctx.stroke();
    ctx.strokeStyle = "rgba(120,170,210,.10)"; ctx.lineWidth = 16; ctx.stroke();
    ctx.restore();
    ctx.fillStyle = p.tot ? "#39404a" : saison().g2;
    ctx.fill();
    /* Sandsaum und Terrain im Inselinneren */
    ctx.save(); ctx.clip();
    ctx.strokeStyle = p.tot ? "rgba(90,95,105,.5)" : "rgba(196,177,144,.4)"; ctx.lineWidth = 5;
    ctx.stroke();
    if(!p.tot){
      const sn2 = saison();
      ctx.fillStyle = sn2.f1 + "55";
      for(let f2=0; f2<3; f2++){
        ctx.fillRect(px - rrW*0.7 + f2*rrW*0.5, py + rrW*0.32, rrW*0.38, rrW*0.2);
      }
      if(p.land > 12000){
        for(let b4=0; b4<3; b4++){
          const bx4 = px - rrW*0.5 + b4*rrW*0.5, by4 = py - rrW*0.42;
          ctx.fillStyle = "rgba(122,130,144,.75)";
          ctx.beginPath(); ctx.moveTo(bx4-rrW*0.2, by4); ctx.lineTo(bx4, by4-rrW*0.26); ctx.lineTo(bx4+rrW*0.2, by4);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "rgba(230,235,242,.8)";
          ctx.beginPath(); ctx.moveTo(bx4-rrW*0.06, by4-rrW*0.17); ctx.lineTo(bx4, by4-rrW*0.26); ctx.lineTo(bx4+rrW*0.06, by4-rrW*0.17);
          ctx.closePath(); ctx.fill();
        }
      }
      malBaum(ctx, px - rrW*0.72, py + rrW*0.05, rrW*0.1, sn2.b1, sn2.b2, sn2.schnee);
      malBaum(ctx, px + rrW*0.68, py - rrW*0.1, rrW*0.09, sn2.b1, sn2.b2, sn2.schnee);
      const st = Math.min(staedte(p), 4);
      for(let s2=0; s2<st; s2++){
        malHaus(ctx, px - rrW*0.4 + s2*rrW*0.28, py + rrW*0.12 + (s2%2)*rrW*0.1, rrW*0.13, "#c4b190", "#96543c", t);
      }
      if((p.mauer||0) + (p.burg||0) > 0){
        const fx2 = px + rrW*0.42, fy2 = py - rrW*0.16;
        ctx.fillStyle = "#7d7568";
        ctx.fillRect(fx2 - rrW*0.07, fy2 - rrW*0.22, rrW*0.14, rrW*0.24);
        for(let z2=0; z2<3; z2++) ctx.fillRect(fx2 - rrW*0.08 + z2*rrW*0.06, fy2 - rrW*0.27, rrW*0.04, rrW*0.06);
        ctx.fillStyle = p.farbe;
        ctx.fillRect(fx2 - rrW*0.008, fy2 - rrW*0.38, rrW*0.02, rrW*0.12);
        ctx.beginPath(); ctx.moveTo(fx2 + rrW*0.01, fy2 - rrW*0.38);
        ctx.lineTo(fx2 + rrW*0.1, fy2 - rrW*0.35); ctx.lineTo(fx2 + rrW*0.01, fy2 - rrW*0.32);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
    ctx.strokeStyle = p.farbe; ctx.lineWidth = 2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
    if(i===G.aktiv && !p.tot){
      ctx.strokeStyle = "rgba(224,180,88,"+(0.55+Math.sin(t/300)*0.3)+")"; ctx.lineWidth = 3; ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(px, py, rrW*1.35, 0, 7); ctx.stroke();
    }
    if(i===G._dossier){
      ctx.strokeStyle = "rgba(226,232,242,.8)"; ctx.lineWidth = 2; ctx.setLineDash([3,4]);
      ctx.lineDashOffset = -t/60;
      ctx.beginPath(); ctx.arc(px, py, rrW*1.5, 0, 7); ctx.stroke();
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
    }
    ctx.font = `${Math.round(rrW*0.62)}px sans-serif`; ctx.textAlign = "center";
    ctx.fillText(p.wappen, px, py + rrW*0.2);
    /* Namensschild: dunkle Plakette mit Goldrand */
    const nm = `${titelName(p)} ${p.name}${p.tot?" †":""}`;
    ctx.font = "600 13px sans-serif";
    const bw = Math.max(ctx.measureText(nm).width, 118) + 18;
    const bx5 = px - bw/2, by5 = py + rrW*0.85 + 4;
    ctx.fillStyle = "rgba(13,17,23,.78)";
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx5, by5, bw, 34, 7); else ctx.rect(bx5, by5, bw, 34);
    ctx.fill();
    ctx.strokeStyle = i===G.aktiv && !p.tot ? "rgba(224,180,88,.8)" : "rgba(224,180,88,.28)";
    ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = "#dbe2ee";
    ctx.fillText(nm, px, by5 + 14);
    ctx.font = "11px sans-serif"; ctx.fillStyle = "#8b96a8";
    ctx.fillText(`${fmt(p.land)} ha · ${fmt(p.pop)} Einw.`, px, by5 + 27);
    ctx.restore();
  });
  /* Siegel der Ehen und Bündnisse über den Linien */
  ctx.font = "13px sans-serif"; ctx.textAlign = "center";
  for(const [sx7, sy7, ico7] of siegel){
    ctx.fillStyle = "rgba(13,17,23,.7)";
    ctx.beginPath(); ctx.arc(sx7, sy7, 10, 0, 7); ctx.fill();
    ctx.fillText(ico7, sx7, sy7 + 4);
  }
  /* Möwen kreisen über dem Meer */
  ctx.strokeStyle = "rgba(226,232,242,.5)"; ctx.lineWidth = 1.2; ctx.lineCap = "round";
  for(let mo=0; mo<3; mo++){
    const ma = t/2100 + mo*2.1;
    const mxx = W*0.5 + Math.cos(ma)*(W*0.31 + mo*20);
    const myy = H*0.5 + Math.sin(ma)*(H*0.33 + mo*8);
    const fl3 = Math.sin(t/150 + mo*2)*2.2;
    ctx.beginPath();
    ctx.moveTo(mxx-3.6, myy - fl3); ctx.quadraticCurveTo(mxx, myy+1, mxx+3.6, myy - fl3);
    ctx.stroke();
  }
  /* Wolkenschatten ziehen über die Karte */
  ctx.fillStyle = "rgba(6,9,14,.10)";
  for(let ws=0; ws<2; ws++){
    const wsx = ((t/(160+ws*70) + ws*500) % (W+420)) - 210;
    const wsy = H*(0.3 + ws*0.35);
    ctx.beginPath(); ctx.ellipse(wsx, wsy, 130, 42, -0.25, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(wsx+80, wsy+16, 90, 30, -0.25, 0, 7); ctx.fill();
  }
  /* Ein Segelschiff kreuzt das Weltmeer am Kartenrand */
  {
    const bahn = (t/34000) % 1;
    const sa = bahn * 6.2832;
    const shx = cx + Math.cos(sa) * W*0.455;
    const shy = cy + Math.sin(sa) * H*0.44;
    const nachRechts = Math.cos(sa + Math.PI/2) >= 0;
    ctx.save();
    ctx.translate(shx, shy + Math.sin(t/500)*1.4);
    if(!nachRechts) ctx.scale(-1,1);
    ctx.fillStyle = "#5c4426";
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,0); ctx.lineTo(5.5,4); ctx.lineTo(-5.5,4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#8a6a40"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-12); ctx.stroke();
    ctx.fillStyle = "#e2ddd0";
    ctx.beginPath(); ctx.moveTo(0,-12); ctx.quadraticCurveTo(7+Math.sin(t/400)*1.2,-7,0,-2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(200,225,250,.28)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-10,2); ctx.lineTo(-16,1); ctx.moveTo(-10,3.5); ctx.lineTo(-15,4.5); ctx.stroke();
    ctx.restore();
  }
  /* Kartenrahmen wie auf alten Seekarten: Doppellinie mit Eckzier */
  ctx.strokeStyle = "rgba(224,180,88,.5)"; ctx.lineWidth = 2;
  ctx.strokeRect(6, 6, W-12, H-12);
  ctx.strokeStyle = "rgba(224,180,88,.22)"; ctx.lineWidth = 1;
  ctx.strokeRect(11, 11, W-22, H-22);
  ctx.strokeStyle = "rgba(224,180,88,.5)"; ctx.lineWidth = 1.6;
  for(const [ecx, ecy, sx4, sy4] of [[6,6,1,1],[W-6,6,-1,1],[6,H-6,1,-1],[W-6,H-6,-1,-1]]){
    ctx.beginPath();
    ctx.moveTo(ecx + sx4*22, ecy);
    ctx.quadraticCurveTo(ecx + sx4*4, ecy + sy4*4, ecx, ecy + sy4*22);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ecx + sx4*10, ecy + sy4*10, 2, 0, 7); ctx.fill();
  }
  /* Kompassrose */
  const kx2 = W-52, ky2 = H-52, kr2 = 24;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = "#8b96a8"; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(kx2, ky2, kr2, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(kx2, ky2, kr2*0.62, 0, 7); ctx.stroke();
  for(let sp=0; sp<8; sp++){
    const a2 = sp*Math.PI/4;
    const lang = sp%2===0 ? kr2 : kr2*0.6;
    ctx.fillStyle = sp===0 ? "#e0b458" : (sp%2===0 ? "#b7c0cc" : "#5c6878");
    ctx.beginPath();
    ctx.moveTo(kx2 + Math.sin(a2)*lang, ky2 - Math.cos(a2)*lang);
    ctx.lineTo(kx2 + Math.sin(a2+0.42)*4.2, ky2 - Math.cos(a2+0.42)*4.2);
    ctx.lineTo(kx2 + Math.sin(a2-0.42)*4.2, ky2 - Math.cos(a2-0.42)*4.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#e0b458"; ctx.font = "bold 10px Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText("N", kx2, ky2 - kr2 - 4);
  ctx.restore();
  /* Titel-Kartusche im Kartenstil */
  ctx.fillStyle = "rgba(13,17,23,.82)";
  ctx.fillRect(14, H-38, 268, 26);
  ctx.strokeStyle = "rgba(224,180,88,.45)"; ctx.lineWidth = 1; ctx.strokeRect(14, H-38, 268, 26);
  ctx.fillStyle = "#e0b458"; ctx.font = "600 13px Georgia, serif"; ctx.textAlign = "left";
  ctx.fillText(`Die bekannte Welt · Anno ${G.jahr} · ${saison().n}`, 24, H-20);
}
/* Animierte Wetterszene für die Jahresbilanz */
function zeichneWetter(t=0){
  const c = document.getElementById("wetterBild");
  const p = cur();
  if(!c || !p || !p.report) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  const f = p.report.wetter.f;
  const art = f<=0.6 ? "duerre" : f<=0.85 ? "regen" : f<1.12 ? "wechsel" : f<1.3 ? "gut" : "pracht";
  ctx.clearRect(0,0,W,H);
  const himmel = ctx.createLinearGradient(0,0,0,H);
  if(art==="duerre"){ himmel.addColorStop(0,"#7a5c30"); himmel.addColorStop(1,"#8a6a38"); }
  else if(art==="regen"){ himmel.addColorStop(0,"#28313f"); himmel.addColorStop(1,"#39434f"); }
  else if(art==="wechsel"){ himmel.addColorStop(0,"#3a4456"); himmel.addColorStop(1,"#55607a"); }
  else { himmel.addColorStop(0,"#3d4a68"); himmel.addColorStop(1,"#7a6a48"); }
  ctx.fillStyle = himmel; ctx.fillRect(0,0,W,H);
  /* Hügelkamm */
  ctx.fillStyle = art==="duerre" ? "#5c4a26" : "#22301f";
  ctx.beginPath(); ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.3, H-26, W*0.55, H-14);
  ctx.quadraticCurveTo(W*0.8, H-4, W, H-18);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  if(art==="duerre"){
    /* gleißende Sonne mit Hitzeflimmern */
    const sx = W*0.78, sy = H*0.35;
    const grad = ctx.createRadialGradient(sx,sy,2,sx,sy,34);
    grad.addColorStop(0,"#fff0c0"); grad.addColorStop(0.6,"#e8c05a"); grad.addColorStop(1,"rgba(232,192,90,0)");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(sx,sy,34,0,7); ctx.fill();
    ctx.strokeStyle = "rgba(255,240,200,.25)"; ctx.lineWidth = 1.5;
    for(let i=0;i<8;i++){
      const x0 = W*0.08 + i*W*0.11;
      ctx.beginPath();
      for(let y=H-16; y>H*0.45; y-=6)
        ctx.lineTo(x0 + Math.sin(y/9 + t/160 + i)*3.5, y);
      ctx.stroke();
    }
  } else if(art==="regen" || art==="wechsel"){
    if(art==="wechsel"){
      /* Ein blasser Regenbogen spannt sich über die Hügel */
      const rx0 = W*0.62, ry0 = H*1.05;
      const farben = ["rgba(230,90,90,.16)","rgba(230,180,80,.15)","rgba(220,220,110,.13)","rgba(120,200,130,.13)","rgba(110,160,230,.14)"];
      farben.forEach((f2,k)=>{
        ctx.strokeStyle = f2; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(rx0, ry0, H*0.86 - k*4.5, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
      });
    }
    /* Wolkenbänke */
    ctx.fillStyle = "rgba(210,214,224,.16)";
    for(let i=0;i<5;i++){
      const wx = ((t/(60+i*18) + i*220) % (W+240)) - 120;
      for(let b=0;b<4;b++){ ctx.beginPath(); ctx.arc(wx+b*30, 22+i*7+(b%2)*6, 18+(b%3)*7, 0, 7); ctx.fill(); }
    }
    if(art==="regen"){
      ctx.strokeStyle = "rgba(170,200,230,.45)"; ctx.lineWidth = 1.3;
      for(let i=0;i<46;i++){
        const seed = ((i*61)%97)/97;
        const rx2 = (seed*W + t/(2.2+seed)) % W;
        const ry2 = (t/(3+seed*2) + i*37) % H;
        ctx.beginPath(); ctx.moveTo(rx2, ry2); ctx.lineTo(rx2-3, ry2+11); ctx.stroke();
      }
      /* Blitz alle paar Sekunden */
      const blitzPhase = (t % 4200);
      if(blitzPhase < 160){
        ctx.fillStyle = `rgba(255,255,240,${0.35*(1-blitzPhase/160)})`;
        ctx.fillRect(0,0,W,H);
        const bx = W*0.3 + (Math.floor(t/4200)%3)*W*0.2;
        ctx.strokeStyle = "#fff8d0"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(bx, 6);
        ctx.lineTo(bx-8, H*0.35); ctx.lineTo(bx+4, H*0.4); ctx.lineTo(bx-6, H*0.75);
        ctx.stroke();
      }
    }
  } else {
    /* goldene Strahlen und Sonne */
    const sx = W*0.72, sy = H*0.4;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(t/9000);
    ctx.fillStyle = art==="pracht" ? "rgba(255,220,120,.10)" : "rgba(230,205,140,.07)";
    for(let i=0;i<10;i++){ ctx.rotate(Math.PI/5); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(190,-18); ctx.lineTo(190,18); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    const grad = ctx.createRadialGradient(sx,sy,3,sx,sy,30);
    grad.addColorStop(0,"#fff3cf"); grad.addColorStop(0.6,"#e0b458"); grad.addColorStop(1,"rgba(224,180,88,0)");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(sx,sy,30,0,7); ctx.fill();
    if(art==="pracht"){
      ctx.strokeStyle = "rgba(200,205,220,.5)"; ctx.lineWidth = 1.5;
      for(let i=0;i<2;i++){
        const vx = ((t/(26+i*9) + i*300) % (W+60)) - 30;
        const vy = 26 + i*16 + Math.sin(t/400+i)*5;
        ctx.beginPath(); ctx.moveTo(vx-5,vy); ctx.quadraticCurveTo(vx-1.5,vy-3.5,vx,vy);
        ctx.quadraticCurveTo(vx+1.5,vy-3.5,vx+5,vy); ctx.stroke();
      }
    }
  }
  /* Textzeile */
  /* Der Wettertitel liegt als großes HTML-Overlay über dem Bild */
}
function weltAuf(){ G._vorWelt = G.screen; G._dossier = null; zeige("welt"); }
function weltKlick(ev){
  const c = document.getElementById("welt");
  if(!c) return;
  const rect = c.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (c.width / rect.width);
  const y = (ev.clientY - rect.top) * (c.height / rect.height);
  const W = c.width, H = c.height, n = G.spieler.length;
  const cx = W/2, cy = H/2 + 4, ex = W*0.36, ey = H*0.32;
  let treffer = null;
  G.spieler.forEach((p,i)=>{
    const a = -Math.PI/2 + i/n*6.2832;
    const px = cx + Math.cos(a)*ex*(n>1?1:0), py = cy + Math.sin(a)*ey*(n>1?1:0);
    const rrW = 24 + 34*Math.sqrt(Math.min(p.land,50000)/50000);
    if(Math.hypot(x-px, y-py) < Math.max(40, rrW*1.15)) treffer = i;
  });
  G._dossier = (treffer === G._dossier) ? null : treffer;
  render();
}

/* ---------- Einheiten-Sprites (Schlachtfeld & Aufstellungs-Vorschau) ---------- */
function malSoldat(ctx, x, y, farbe, richt, pike=true){
  ctx.strokeStyle = farbe; ctx.fillStyle = farbe; ctx.lineWidth = 1.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y-4.5, 1.7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y-2.8); ctx.lineTo(x, y+1.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y+1.6); ctx.lineTo(x-1.8, y+5);
  ctx.moveTo(x, y+1.6); ctx.lineTo(x+1.8, y+5); ctx.stroke();
  if(pike){ ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(x+richt*2, y+2); ctx.lineTo(x+richt*5, y-8); ctx.stroke(); }
}
function malReiter(ctx, x, y, farbe, richt){
  ctx.strokeStyle = farbe; ctx.fillStyle = farbe; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.ellipse(x, y+1, 5.2, 2.7, 0, 0, 7); ctx.fill();          /* Pferdeleib */
  ctx.beginPath(); ctx.moveTo(x+richt*4, y);                                     /* Hals & Kopf */
  ctx.lineTo(x+richt*6.6, y-3.6); ctx.lineTo(x+richt*8.4, y-2.8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-3, y+3); ctx.lineTo(x-3.4, y+6.4);               /* Beine */
  ctx.moveTo(x+3, y+3); ctx.lineTo(x+3.4, y+6.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-richt*0.6, y-5, 1.6, 0, 7); ctx.fill();             /* Reiter */
  ctx.beginPath(); ctx.moveTo(x-richt*0.6, y-3.4); ctx.lineTo(x-richt*0.6, y-0.5); ctx.stroke();
  ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(x+richt*1, y-2.5); ctx.lineTo(x+richt*7, y-7); ctx.stroke(); /* Lanze */
}
function malKanone(ctx, x, y, farbe, richt){
  ctx.strokeStyle = farbe; ctx.fillStyle = farbe; ctx.lineCap = "round";
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x-richt*1.5, y+1.5); ctx.lineTo(x+richt*6.5, y-3); ctx.stroke(); /* Rohr */
  ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(x, y+3.4, 3.1, 0, 7); ctx.stroke();                    /* Rad */
  ctx.beginPath(); ctx.moveTo(x, y+3.4); ctx.lineTo(x-richt*5.5, y+6.5); ctx.stroke(); /* Lafette */
}
function malAufgebot(ctx, x, y, farbe, richt){
  ctx.strokeStyle = farbe; ctx.fillStyle = farbe; ctx.lineWidth = 1.3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y-4, 1.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y-2.5); ctx.lineTo(x, y+1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y+1.5); ctx.lineTo(x-1.6, y+4.6);
  ctx.moveTo(x, y+1.5); ctx.lineTo(x+1.6, y+4.6); ctx.stroke();
  /* Heugabel */
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x+richt*2, y+2.5); ctx.lineTo(x+richt*3.6, y-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+richt*2.6, y-6.5); ctx.lineTo(x+richt*4.6, y-5.5); ctx.stroke();
}
/* Ein Trupp Sprites eines Typs in Reihen zeichnen; gibt die Blocktiefe zurück */
function malTrupp(ctx, typ, anzahl, maxSprites, front, richt, y0, laneH, farbe){
  if(anzahl <= 0) return 0;
  const sprites = clamp(Math.ceil(anzahl/Math.max(1,Math.round(anzahl/maxSprites))), 1, maxSprites);
  const abst = typ==="kav" ? 13 : typ==="art" ? 13 : 7.5;
  const reihenH = typ==="kav" ? 14 : 11;
  const reihen = Math.max(1, Math.floor((laneH-12)/reihenH));
  let tiefe = 0;
  for(let i=0;i<sprites;i++){
    const reihe = i % reihen, spalte = Math.floor(i/reihen);
    const x = front - richt*(spalte*abst);
    const y = y0 + 8 + reihe*reihenH;
    if(typ==="inf") malSoldat(ctx, x, y, farbe, richt, true);
    else if(typ==="miliz") malSoldat(ctx, x, y, farbe, richt, false);
    else if(typ==="auf") malAufgebot(ctx, x, y, farbe, richt);
    else if(typ==="kav") malReiter(ctx, x, y, farbe, richt);
    else malKanone(ctx, x, y, farbe, richt);
    tiefe = Math.max(tiefe, spalte*abst + abst);
  }
  return tiefe;
}

/* Schlachtfeld-Canvas: Truppen als Formationen, Partikel an der Front */
function zeichneFeld(t=0){
  const c = $("#feld"), s = G._s;
  if(!c || !s || !s.lanes) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  /* Auf schmalen Screens wird der Canvas stark verkleinert: Schrift vergrößern */
  const M = (c.clientWidth > 0 && c.clientWidth < 560) ? 1.5 : 1;
  ctx.clearRect(0,0,W,H);
  const jetztF = performance.now();
  ctx.save();
  if(s.shakeBis && jetztF < s.shakeBis && !s.fertig){
    const stq = (s.shakeBis - jetztF) / 320;
    ctx.translate(rf(-2.6,2.6)*stq, rf(-1.8,1.8)*stq);
  }
  /* Boden mit Tiefe: Himmelstreifen oben, dunkler werdendes Feld nach vorn */
  const boden = ctx.createLinearGradient(0,0,0,H);
  if(s.regen){
    boden.addColorStop(0,"#252d3a"); boden.addColorStop(0.26,"#2a3527");
    boden.addColorStop(0.7,"#243021"); boden.addColorStop(1,"#1d281c");
  } else {
    boden.addColorStop(0,"#2b3444"); boden.addColorStop(0.26,"#31402a");
    boden.addColorStop(0.7,"#2a3a24"); boden.addColorStop(1,"#22301e");
  }
  ctx.fillStyle = boden; ctx.fillRect(0,0,W,H);
  /* Gelände */
  const brng = mulberry(777);
  ctx.fillStyle = "rgba(255,255,255,.03)";
  for(let h=0;h<4;h++){
    const hx = brng()*W, hw = 90+brng()*160;
    ctx.beginPath(); ctx.ellipse(hx, H*0.24, hw, 14+brng()*8, 0, Math.PI, 0); ctx.fill();
  }
  for(let b=0;b<6;b++) malBaum(ctx, brng()*W, H*(0.17+brng()*0.06), 4+brng()*3);
  /* Himmelband: fahle Sonne und ziehende Wolken über dem Feld */
  if(!s.regen){
    const sonn = ctx.createRadialGradient(W*0.82, H*0.09, 3, W*0.82, H*0.09, 26);
    sonn.addColorStop(0,"rgba(255,236,180,.7)"); sonn.addColorStop(1,"rgba(255,236,180,0)");
    ctx.fillStyle = sonn; ctx.beginPath(); ctx.arc(W*0.82, H*0.09, 26, 0, 7); ctx.fill();
  }
  ctx.fillStyle = s.regen ? "rgba(150,155,168,.14)" : "rgba(220,222,232,.09)";
  for(let wk=0; wk<3; wk++){
    const wx4 = ((t/(120+wk*40) + wk*300) % (W+220)) - 110;
    for(let b2=0;b2<4;b2++){
      ctx.beginPath(); ctx.arc(wx4+b2*24, H*0.06+wk*H*0.045+(b2%2)*4, 12+(b2%3)*5, 0, 7); ctx.fill();
    }
  }
  /* Brandnarben vergangener Einschläge bleiben im Boden */
  for(const kt of (s.krater||[])){
    ctx.fillStyle = "rgba(30,26,20,.30)";
    ctx.beginPath(); ctx.ellipse(kt.x*W, kt.y*H, 7, 2.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(60,50,38,.22)";
    ctx.beginPath(); ctx.ellipse(kt.x*W, kt.y*H, 3.6, 1.5, 0, 0, 7); ctx.fill();
  }
  /* Grasbüschel und zertrampelte Erde */
  for(let g2=0; g2<70; g2++){
    const gx3 = brng()*W, gy3 = H*0.3 + brng()*H*0.66;
    if(brng() < 0.55){
      ctx.strokeStyle = "rgba(110,140,90,.20)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(gx3, gy3); ctx.lineTo(gx3-1.5, gy3-3.5);
      ctx.moveTo(gx3+1.5, gy3); ctx.lineTo(gx3+2.5, gy3-3);
      ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(80,68,50,.14)";
      ctx.beginPath(); ctx.ellipse(gx3, gy3, 6+brng()*8, 2+brng()*2, 0, 0, 7); ctx.fill();
    }
  }
  /* Abschnittslinien */
  const oben = H*0.27, laneH = (H-oben-10)/LANES;
  ctx.strokeStyle = "rgba(255,255,255,.05)";
  for(let i=0;i<=LANES;i++){
    ctx.beginPath(); ctx.moveTo(0,oben+i*laneH); ctx.lineTo(W,oben+i*laneH); ctx.stroke();
  }
  ctx.font = `${Math.round(10*M)}px sans-serif`; ctx.textAlign = "left"; ctx.fillStyle = `rgba(219,226,238,${M>1?.6:.4})`;
  for(let i=0;i<LANES;i++){
    const gel = (s.gelaende && s.gelaende[i]) || GELAENDE[0];
    ctx.fillText(`${LANE_NAMEN[i]}${gel.ico?" "+gel.ico:""}`, 8, oben+i*laneH+12);
  }
  /* Gelände in der Feldmitte einzeichnen */
  (s.gelaende||[]).forEach((gel,i)=>{
    const ym = oben + i*laneH + laneH/2;
    if(gel.k==="huegel"){
      ctx.fillStyle = "rgba(120,130,110,.28)";
      ctx.beginPath(); ctx.ellipse(W*0.62, ym+laneH*0.28, 60, 13, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(W*0.55, ym+laneH*0.32, 40, 9, 0, Math.PI, 0); ctx.fill();
    } else if(gel.k==="furt"){
      ctx.fillStyle = "rgba(80,140,180,.30)";
      ctx.fillRect(W*0.47, oben+i*laneH+2, 26, laneH-4);
      ctx.strokeStyle = "rgba(180,220,250,.35)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(W*0.5, oben+i*laneH+4); ctx.lineTo(W*0.5, oben+(i+1)*laneH-4); ctx.stroke();
    } else if(gel.k==="wald"){
      for(let b=0;b<4;b++) malBaum(ctx, W*0.5 + (b-1.5)*16, ym + laneH*0.3, 4.5);
    }
  });
  /* Schlachtwetter: Regen */
  if(s.regen){
    ctx.strokeStyle = "rgba(170,200,230,.28)"; ctx.lineWidth = 1;
    for(let i=0;i<34;i++){
      const seed = ((i*61)%97)/97;
      const rx2 = (seed*W + t/(2.5+seed)) % W;
      const ry2 = (t/(3+seed*2) + i*41) % H;
      ctx.beginPath(); ctx.moveTo(rx2, ry2); ctx.lineTo(rx2-2.5, ry2+9); ctx.stroke();
    }
  }

  /* Morgennebel: träge Schwaden über dem Feld */
  if(s.nebel){
    for(let nb=0; nb<4; nb++){
      const nx = ((t/(90+nb*35) + nb*260) % (W+320)) - 160;
      const ny = H*0.35 + nb*H*0.16;
      const ngrad = ctx.createRadialGradient(nx, ny, 10, nx, ny, 130);
      ngrad.addColorStop(0, "rgba(205,210,220,.16)"); ngrad.addColorStop(1, "rgba(205,210,220,0)");
      ctx.fillStyle = ngrad;
      ctx.beginPath(); ctx.ellipse(nx, ny, 150, 34, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "rgba(200,206,216,.07)"; ctx.fillRect(0, H*0.27, W, H*0.7);
  }
  /* Pulverdunst: je länger das Gefecht, desto trüber die Feldmitte */
  const dunst = Math.min(0.15, (s.tick||0)*0.006);
  if(dunst > 0.02){
    const dgrad = ctx.createLinearGradient(W*0.25, 0, W*0.75, 0);
    dgrad.addColorStop(0, "rgba(130,128,124,0)");
    dgrad.addColorStop(0.5, `rgba(130,128,124,${dunst})`);
    dgrad.addColorStop(1, "rgba(130,128,124,0)");
    ctx.fillStyle = dgrad; ctx.fillRect(0, H*0.27, W, H*0.73);
  }
  const fA = G._kr ? G.spieler[G._kr.a].farbe : "#5fb8d4";
  const fD = G._kr ? G.spieler[G._kr.d].farbe : "#d9973f";
  const basisA = W*0.13, basisD = W*0.87, spann = W*0.34;
  /* Festungswerke des Verteidigers: Mauer quer über die Abschnitte, Burg dahinter */
  if((s.mauerStufe||0) > 0){
    const mx = W*0.80;
    const mrng = mulberry(4242);
    const bruchLanes = s.mauerBruch ? new Set([Math.floor(mrng()*LANES), Math.floor(mrng()*LANES)]) : new Set();
    const dicke = 7 + (s.mauerStufe||0)*3;
    for(let i=0;i<LANES;i++){
      const y1 = oben + i*laneH + 2, y2 = oben + (i+1)*laneH - 2;
      if(bruchLanes.has(i)){
        /* Bresche: Trümmerhaufen statt Mauer */
        ctx.fillStyle = "rgba(140,133,119,.55)";
        for(let k=0;k<6;k++){
          const ty = y1 + (k/6)*(y2-y1);
          ctx.beginPath(); ctx.arc(mx + rf(-6,6), ty, 2.5+mrng()*3, 0, 7); ctx.fill();
        }
        ctx.fillStyle = "rgba(224,180,88,.55)"; ctx.font = "600 9px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("Bresche", mx, y1 + 10);
        continue;
      }
      const wgrad = ctx.createLinearGradient(mx-dicke/2, 0, mx+dicke/2, 0);
      wgrad.addColorStop(0, "#6f695f"); wgrad.addColorStop(0.5, "#9a938a"); wgrad.addColorStop(1, "#5c574e");
      ctx.fillStyle = wgrad;
      ctx.fillRect(mx-dicke/2, y1, dicke, y2-y1);
      /* Zinnen */
      ctx.fillStyle = "#7d7568";
      for(let z=y1; z<y2-4; z+=9) ctx.fillRect(mx-dicke/2-2, z, dicke+4, 4);
    }
    /* Burg als Turm über dem Feld */
    if((s.burgStufe||0) > 0){
      const bx = W*0.905, by = oben - 6;
      ctx.fillStyle = "#7d7568";
      ctx.fillRect(bx-10, by-26, 20, 26);
      for(let z=0;z<4;z++) ctx.fillRect(bx-10+z*6, by-31, 4, 6);
      if((s.burgStufe||0) >= 2){ ctx.fillStyle = "#6f695f"; ctx.fillRect(bx-17, by-16, 6, 16); ctx.fillRect(bx+11, by-16, 6, 16); }
      ctx.fillStyle = fD;
      ctx.fillRect(bx-1, by-44, 2, 14);
      ctx.beginPath(); ctx.moveTo(bx+1, by-44); ctx.lineTo(bx+11, by-41); ctx.lineTo(bx+1, by-38); ctx.closePath(); ctx.fill();
    }
    /* Beschriftung */
    ctx.fillStyle = "rgba(219,226,238,.45)"; ctx.font = "600 10px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`🏰 ${s.mauerBruch ? "Mauer (durchbrochen)" : "Stadtmauer Stufe " + s.mauerStufe}`, W*0.80, oben - 10);
  }
  const skala = Math.max(1, Math.ceil((s.startG.A+s.startG.D)/560));

  /* Truppen als Einheiten-Sprites je Abschnitt */
  s.lanes.forEach((lane,i)=>{
    const y0 = oben + i*laneH + 2;
    const frontA = basisA + (100-lane.dist)/100*spann;
    const frontD = basisD - (100-lane.dist)/100*spann;
    const malSeite2 = (u, farbe, front, richt) => {
      let x = front;
      x -= richt * malTrupp(ctx, "inf",   u.inf,   10, x, richt, y0, laneH, farbe);
      x -= richt * malTrupp(ctx, "miliz", u.miliz,  7, x, richt, y0, laneH, farbe+"99");
      x -= richt * malTrupp(ctx, "auf",   u.auf,    5, x, richt, y0, laneH, farbe+"77");
      malTrupp(ctx, "kav", u.kav, 5, x, richt, y0, laneH, farbe);
      /* Artillerie an der Basis */
      malTrupp(ctx, "art", u.art, 3, richt>0 ? basisA-34 : basisD+34, richt, y0, laneH, farbe);
    };
    /* Marsch-Wippen: solange die Linie vorrückt, wiegt sie leicht */
    const wippe = lane.dist > 0 && !s.fertig ? Math.sin(t/170 + i*1.4) * 1.1 : 0;
    const flucht = s.fertig && !s.replayAktiv && s.fertigZeit
      ? Math.min(1, (jetztF - s.fertigZeit) / 2600) : 0;
    const fluchtA = s.fertig && s.sieger === "D" ? flucht : 0;
    const fluchtD = s.fertig && s.sieger === "A" ? flucht : 0;
    ctx.save(); ctx.translate(-fluchtA * 85, wippe + Math.sin(t/90 + i)*fluchtA*1.5);
    ctx.globalAlpha = 1 - fluchtA * 0.55;
    if(laneGroesse(lane.A)>0) malSeite2(lane.A, fA, frontA, 1);
    ctx.restore();
    ctx.save(); ctx.translate(fluchtD * 85, -wippe + Math.sin(t/90 + i)*fluchtD*1.5);
    ctx.globalAlpha = 1 - fluchtD * 0.55;
    if(laneGroesse(lane.D)>0) malSeite2(lane.D, fD, frontD, -1);
    ctx.restore();
    /* Kleine Frontfahnen zeigen, wie weit jede Linie vorgerückt ist */
    if(laneGroesse(lane.A)>0 && lane.dist>0){
      const fw2 = Math.sin(t/230+i)*2;
      ctx.strokeStyle = "#5a4a30"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(frontA+8, y0+4); ctx.lineTo(frontA+8, y0+15); ctx.stroke();
      ctx.fillStyle = fA;
      ctx.beginPath(); ctx.moveTo(frontA+8, y0+4);
      ctx.quadraticCurveTo(frontA+14, y0+5+fw2*0.4, frontA+18, y0+6+fw2*0.4);
      ctx.quadraticCurveTo(frontA+14, y0+8, frontA+8, y0+9);
      ctx.closePath(); ctx.fill();
    }
    if(laneGroesse(lane.D)>0 && lane.dist>0){
      const fw3 = Math.sin(t/230+i+2)*2;
      ctx.strokeStyle = "#5a4a30"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(frontD-8, y0+4); ctx.lineTo(frontD-8, y0+15); ctx.stroke();
      ctx.fillStyle = fD;
      ctx.beginPath(); ctx.moveTo(frontD-8, y0+4);
      ctx.quadraticCurveTo(frontD-14, y0+5+fw3*0.4, frontD-18, y0+6+fw3*0.4);
      ctx.quadraticCurveTo(frontD-14, y0+8, frontD-8, y0+9);
      ctx.closePath(); ctx.fill();
    }
    /* Truppenzahlen an den Rändern */
    ctx.font = `600 ${Math.round(11*M)}px sans-serif`;
    ctx.fillStyle = fA; ctx.textAlign = "left";
    ctx.fillText(fmt(laneGroesse(lane.A)), 8, y0 + laneH - 8);
    ctx.fillStyle = fD; ctx.textAlign = "right";
    ctx.fillText(fmt(laneGroesse(lane.D)), W-8, y0 + laneH - 8);
    if(laneGroesse(lane.A)===0 && laneGroesse(lane.D)===0){
      ctx.fillStyle = "rgba(219,226,238,.18)"; ctx.font = `${Math.round(11*M)}px sans-serif`; ctx.textAlign="center";
      ctx.fillText("verwaist", W/2, y0+laneH/2);
    } else if(laneGroesse(lane.D)===0 && laneGroesse(lane.A)>0){
      ctx.fillStyle = "rgba(224,180,88,.6)"; ctx.font = `600 ${Math.round(10*M)}px sans-serif`; ctx.textAlign="center";
      ctx.fillText("⚡ Durchbruch", W*0.72, y0+12);
    }
  });

  /* Feldbanner mit Wappen. Bei sinkender Moral neigt sich die Fahne */
  const banner = (bx, farbe, ph, wp, moral) => {
    const kippen = (100 - (moral===undefined?100:moral)) / 100 * 0.35;
    ctx.save();
    ctx.translate(bx, oben-4);
    ctx.rotate(bx < W/2 ? -kippen : kippen);
    ctx.strokeStyle = "#5a4a30"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -30); ctx.stroke();
    ctx.fillStyle = farbe;
    const wf = Math.sin(t/240 + ph)*3;
    ctx.beginPath(); ctx.moveTo(0, -30);
    ctx.quadraticCurveTo(10, -28+wf, 20, -25+wf);
    ctx.quadraticCurveTo(10, -22+wf*0.5, 0, -18);
    ctx.closePath(); ctx.fill();
    if(wp){ ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(wp, 8, -21); }
    ctx.restore();
  };
  banner(W*0.05, fA, 0, G._kr ? G.spieler[G._kr.a].wappen : "", s.moralA);
  banner(W*0.95-20, fD, 2, G._kr ? G.spieler[G._kr.d].wappen : "", s.moralD);

  /* Partikel: Kanonenkugeln (Flugbahn), Explosionen, Nahkampfstaub */
  const jetzt = performance.now();
  for(const pk of (s.partikel||[])){
    const alter = jetzt - pk.born;
    if(alter < 0) continue;
    if(pk.typ==="kugel" && alter < 900){
      const q = alter/900;
      /* Mündungsfeuer beim Abschuss */
      if(q < 0.14){
        const mx = pk.von==="A" ? basisA-16 : basisD+16;
        const my = oben + pk.lane*laneH + laneH/2;
        ctx.fillStyle = `rgba(255,225,140,${0.9*(1-q/0.14)})`;
        ctx.beginPath(); ctx.arc(mx, my, 5+q*30, 0, 7); ctx.fill();
      }
      /* Pulverrauch treibt nach dem Schuss davon */
      if(q < 0.75){
        const mx2 = pk.von==="A" ? basisA-14 : basisD+14;
        const my2 = oben + pk.lane*laneH + laneH/2;
        const drift = (pk.von==="A" ? 1 : -1) * q * 16;
        ctx.fillStyle = `rgba(190,190,196,${0.22*(1-q/0.75)})`;
        for(let rw=0; rw<3; rw++){
          ctx.beginPath();
          ctx.arc(mx2 + drift + rw*5*(pk.von==="A"?-1:1), my2 - q*22 - rw*3, 3.5 + q*9 + rw*1.5, 0, 7);
          ctx.fill();
        }
      }
      const lane = s.lanes[pk.lane];
      const y0 = oben + pk.lane*laneH + laneH/2;
      const dist = lane ? lane.dist : 50;
      const zielA = basisA + (100-dist)/100*spann, zielD = basisD - (100-dist)/100*spann;
      const von = pk.von==="A" ? basisA-20 : basisD+20;
      const nach = pk.von==="A" ? zielD : zielA;
      const x = von + (nach-von)*q;
      const y = y0 - Math.sin(q*Math.PI)*laneH*1.4;
      ctx.fillStyle = "#20242c";
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
      if(q>0.93){
        ctx.fillStyle = "rgba(255,220,130,.8)";
        ctx.beginPath(); ctx.arc(nach, y0, 6, 0, 7); ctx.fill();
      }
    } else if(pk.typ==="boom" && alter < 750){
      const q = alter/750, r = 3 + q*11;
      const x = pk.rx*W, y = pk.ry*H;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0,`rgba(255,230,140,${0.95*(1-q)})`);
      grad.addColorStop(0.5,`rgba(230,120,60,${0.7*(1-q)})`);
      grad.addColorStop(1,"rgba(230,120,60,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    } else if(pk.typ==="gefallen" && alter < 4200){
      const q = alter/4200;
      const lane = s.lanes[pk.lane];
      const y0 = oben + pk.lane*laneH + laneH*0.5;
      const xm = basisA + (100-(lane?lane.dist:0))/100*spann + (pk.seite==="A"?-14:14) + pk.off*W;
      ctx.strokeStyle = `rgba(150,150,158,${0.5*(1-q)})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(xm-4, y0+6); ctx.lineTo(xm+4, y0+6);
      ctx.moveTo(xm, y0+2); ctx.lineTo(xm, y0+9); ctx.stroke();
    } else if(pk.typ==="wandtreffer" && alter < 1100){
      const q = alter/1100;
      const y0 = oben + pk.lane*laneH + laneH/2;
      const wx = W*0.80;
      /* Aufblitzen des Einschlags */
      if(q < 0.25){
        ctx.fillStyle = `rgba(255,225,150,${0.85*(1-q/0.25)})`;
        ctx.beginPath(); ctx.arc(wx, y0, 4+q*26, 0, 7); ctx.fill();
      }
      /* Staubwolke und Splitter */
      ctx.fillStyle = `rgba(170,160,145,${0.4*(1-q)})`;
      for(let k=0;k<4;k++){
        ctx.beginPath(); ctx.arc(wx + rf(-9,9), y0 - q*20 + rf(-8,8), 3+q*9, 0, 7); ctx.fill();
      }
      ctx.fillStyle = `rgba(140,133,119,${0.7*(1-q)})`;
      for(let k=0;k<3;k++){
        ctx.fillRect(wx + (k-1)*8*q*2, y0 + q*q*26 - 4, 2.5, 2.5);
      }
    } else if(pk.typ==="salve" && alter < 520){
      const q = alter/520;
      const lane = s.lanes[pk.lane];
      const y0 = oben + pk.lane*laneH;
      const front = pk.seite==="A"
        ? basisA + (100-(lane?lane.dist:0))/100*spann - 6
        : basisD - (100-(lane?lane.dist:0))/100*spann + 6;
      /* Reihe von Mündungsblitzen entlang der Front */
      for(let k=0;k<4;k++){
        const fy = y0 + 6 + k*(laneH-10)/3;
        ctx.fillStyle = `rgba(255,232,150,${0.85*(1-q)})`;
        ctx.beginPath(); ctx.arc(front, fy, 1.6+q*2.6, 0, 7); ctx.fill();
      }
      ctx.fillStyle = `rgba(200,200,205,${0.3*(1-q)})`;
      ctx.beginPath(); ctx.arc(front + (pk.seite==="A"?4:-4), y0+laneH/2 - q*8, 4+q*8, 0, 7); ctx.fill();
    } else if(pk.typ==="sturmritt" && alter < 900){
      const q = alter/900;
      const lane = s.lanes[pk.lane];
      const y0 = oben + pk.lane*laneH + laneH/2;
      const xm = basisA + (100-(lane?lane.dist:0))/100*spann;
      /* Bewegungsstreifen der stürmenden Reiterei */
      ctx.strokeStyle = `rgba(240,230,200,${0.5*(1-q)})`; ctx.lineWidth = 2;
      for(let k=0;k<5;k++){
        const sy = y0 + (k-2)*5;
        const sx = xm - 26 - k*7 + q*30;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+15, sy); ctx.stroke();
      }
      ctx.fillStyle = `rgba(160,140,110,${0.4*(1-q)})`;
      ctx.beginPath(); ctx.ellipse(xm-20+q*24, y0+6, 12+q*14, 4, 0, 0, 7); ctx.fill();
    } else if(pk.typ==="durchflash" && alter < 1000){
      const q = alter/1000;
      const y0 = oben + pk.lane*laneH;
      const gg = ctx.createLinearGradient(0, y0, W, y0);
      gg.addColorStop(0, "rgba(224,180,88,0)");
      gg.addColorStop(Math.min(0.99,q), `rgba(224,180,88,${0.35*(1-q)})`);
      gg.addColorStop(1, "rgba(224,180,88,0)");
      ctx.fillStyle = gg; ctx.fillRect(0, y0, W, laneH);
    } else if(pk.typ==="reserve" && alter < 1600){
      const q = alter/1600;
      const y0 = oben + pk.lane*laneH + laneH/2;
      const von = pk.seite==="A" ? -30 : W+30;
      const nach = pk.seite==="A" ? basisA : basisD;
      const x = von + (nach-von)*Math.min(1, q*1.4);
      ctx.globalAlpha = 1-Math.max(0,q-0.7)/0.3;
      ctx.font = "16px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("🥁", x, y0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgba(240,236,220,${0.5*(1-q)})`;
      for(let k=1;k<=3;k++){
        ctx.beginPath(); ctx.arc(x - k*10*(pk.seite==="A"?1:-1), y0+3, 1.8, 0, 7); ctx.fill();
      }
    } else if(pk.typ==="staub" && alter < 1300){
      const q = alter/1300;
      const lane = s.lanes[pk.lane];
      const y0 = oben + pk.lane*laneH + laneH/2;
      const xm = basisA + (100-(lane?lane.dist:0))/100*spann + 8;
      ctx.fillStyle = `rgba(170,160,140,${0.25*(1-q)})`;
      for(let k=0;k<3;k++){
        ctx.beginPath(); ctx.arc(xm+rf(-10,10), y0 - q*16 + rf(-6,6), 5+q*10, 0, 7); ctx.fill();
      }
    }
  }
  if(s.partikel) s.partikel = s.partikel.filter(pk => jetzt - pk.born < (pk.typ==="gefallen" ? 4200 : 1900));
  /* Krähen kreisen über dem stillen Feld */
  if(s.fertig && !s.replayAktiv){
    ctx.strokeStyle = "rgba(20,22,28,.7)"; ctx.lineWidth = 1.5; ctx.lineCap = "round";
    for(let kv=0; kv<4; kv++){
      const ka = t/1600 + kv*1.57;
      const kxx = W*0.5 + Math.cos(ka)*(70+kv*22);
      const kyy = H*0.13 + Math.sin(ka)*(13+kv*4);
      const fl2 = Math.sin(t/130 + kv*2)*2.4;
      ctx.beginPath();
      ctx.moveTo(kxx-3.4, kyy - fl2); ctx.quadraticCurveTo(kxx, kyy+1.2, kxx+3.4, kyy - fl2);
      ctx.stroke();
    }
  }
  /* Sieges-Zeremonie: Lorbeer und Wappen des Siegers, Goldfunken rieseln */
  if(s.fertig && !s.replayAktiv && s.fertigZeit && G._kr){
    const seit = jetztF - s.fertigZeit;
    const q = Math.min(1, seit/900);
    const ease2 = 1 - Math.pow(1-q, 3);
    const wx5 = s.sieger==="A" ? W*0.28 : W*0.72;
    const gewinner = G.spieler[s.sieger==="A" ? G._kr.a : G._kr.d];
    ctx.save();
    ctx.globalAlpha = ease2;
    ctx.translate(wx5, H*0.30 - (1-ease2)*24);
    ctx.scale(0.6 + ease2*0.4, 0.6 + ease2*0.4);
    ctx.textAlign = "center";
    ctx.font = "38px sans-serif"; ctx.fillText("🏆", 0, 0);
    ctx.font = "22px sans-serif"; ctx.fillText(gewinner.wappen, 0, -34);
    ctx.font = "600 13px Georgia, serif"; ctx.fillStyle = "#e0b458";
    ctx.fillText(`${titelName(gewinner)} ${gewinner.name} behält das Feld`, 0, 22);
    ctx.restore();
    /* Goldfunken rieseln über die Sieger-Hälfte */
    if(seit < 6000){
      ctx.fillStyle = "rgba(224,180,88,.75)";
      for(let gf=0; gf<14; gf++){
        const seed = ((gf*67)%91)/91;
        const gy = ((seit/(9+seed*7)) + gf*43) % (H*0.7);
        const gx = wx5 + Math.sin(seit/500 + gf)*W*0.13 + (seed-0.5)*W*0.2;
        ctx.globalAlpha = 0.7 * (1 - gy/(H*0.7));
        ctx.beginPath(); ctx.arc(gx, H*0.1 + gy, 1.1 + seed, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  /* Weisse Flagge + Sieger-Vignette */
  if(s.fertig && !s.replayAktiv){
    const sx5 = s.sieger==="A" ? 0 : W;
    const sgrad = ctx.createLinearGradient(s.sieger==="A" ? 0 : W, 0, s.sieger==="A" ? W*0.55 : W*0.45, 0);
    sgrad.addColorStop(0, "rgba(224,180,88,.14)");
    sgrad.addColorStop(1, "rgba(224,180,88,0)");
    ctx.fillStyle = sgrad; ctx.fillRect(0,0,W,H);
    ctx.font = "22px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("🏳️", s.sieger==="A" ? W*0.8 : W*0.2, H*0.16);
    const puls = 1 + Math.sin(t/300)*0.06;
    ctx.save();
    ctx.translate(s.sieger==="A" ? W*0.2 : W*0.8, H*0.13);
    ctx.scale(puls, puls);
    ctx.font = "26px sans-serif";
    ctx.fillText("🎖️", 0, 0);
    ctx.restore();
  }
  if(s.replayAktiv){
    ctx.fillStyle = "rgba(13,17,23,.72)"; ctx.fillRect(10, 10, 158, 24);
    ctx.fillStyle = "#e0b458"; ctx.font = "600 13px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("🎞️ Zeitraffer läuft …", 18, 27);
  }
  /* Schlacht-Auftakt: Wappen und Namen prallen aufeinander */
  if(s.introBis && jetzt < s.introBis && !s.fertig && G._kr){
    const rest = (s.introBis - jetzt) / 2800;
    const alpha = rest > 0.85 ? (1-rest)/0.15 : rest < 0.25 ? rest/0.25 : 1;
    const ang2 = G.spieler[G._kr.a], ver2 = G.spieler[G._kr.d];
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = "rgba(8,10,16,.62)"; ctx.fillRect(0,0,W,H);
    /* Namenszüge fahren von den Seiten herein */
    const einzug = Math.min(1, (1-rest)*2.4);
    const ease = 1-Math.pow(1-einzug,3);
    ctx.textAlign = "center";
    ctx.font = "bold 30px Georgia, serif";
    ctx.fillStyle = ang2.farbe;
    ctx.fillText(`${ang2.wappen} ${ang2.name}`, W*0.26 - (1-ease)*W*0.3, H*0.44);
    ctx.fillStyle = ver2.farbe;
    ctx.fillText(`${ver2.name} ${ver2.wappen}`, W*0.74 + (1-ease)*W*0.3, H*0.44);
    ctx.fillStyle = "#e0b458";
    ctx.font = `bold ${Math.round(40 + Math.sin(jetzt/120)*3)}px Georgia, serif`;
    ctx.fillText("⚔", W/2, H*0.47);
    ctx.font = "600 15px Georgia, serif";
    ctx.fillStyle = "rgba(219,226,238,.85)";
    ctx.fillText(s.belagerung ? "Die Belagerung ist gebrochen, zur Schlacht!" : "Die Heere treffen aufeinander", W/2, H*0.58);
    ctx.restore();
  }
  ctx.restore();
}
/* Vorschau der eigenen Aufstellung (Platzierungs-Bildschirm) */
function zeichneAufstellung(cid, einheiten, gewichte, farbe, rechts){
  const c = document.getElementById(cid);
  if(!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#1c2b1e"; ctx.fillRect(0,0,W,H);
  const laneH = (H-12)/LANES;
  const lanes = verteileEinheiten(einheiten, gewichte);
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  for(let i=0;i<=LANES;i++){ ctx.beginPath(); ctx.moveTo(0,6+i*laneH); ctx.lineTo(W,6+i*laneH); ctx.stroke(); }
  const richt = rechts ? -1 : 1;
  const basis = rechts ? W-70 : 70;
  lanes.forEach((u,i)=>{
    const y0 = 6 + i*laneH;
    let x = basis;
    x -= richt * malTrupp(ctx, "inf",   u.inf,   8, x, richt, y0, laneH, farbe);
    x -= richt * malTrupp(ctx, "miliz", u.miliz, 6, x, richt, y0, laneH, farbe+"99");
    x -= richt * malTrupp(ctx, "auf",   u.auf,   4, x, richt, y0, laneH, farbe+"77");
    malTrupp(ctx, "kav", u.kav, 4, x, richt, y0, laneH, farbe);
    malTrupp(ctx, "art", u.art, 2, rechts ? W-16 : 16, richt, y0, laneH, farbe);
    ctx.fillStyle = "rgba(219,226,238,.75)"; ctx.font = "600 11px sans-serif";
    ctx.textAlign = rechts ? "left" : "right";
    ctx.fillText(`${LANE_NAMEN[i]} · ${fmt(laneGroesse(u))}`, rechts ? 6 : W-6, y0+laneH-6);
  });
}

/* ---------- Gesamtkarte: alle Reiche im Nachbarschaftskreis ---------- */
function schlachtAbschliessen(){
  const s = G._s, kr = G._kr;
  const ang = G.spieler[kr.a], ver = G.spieler[kr.d];
  /* Kampferfahrung: Überlebende lernen, Sieger mehr als Verlierer */
  ang.heerXp = clamp((ang.heerXp||0) + (s.sieger==="A" ? 16 : 8), 0, 100);
  ver.heerXp = clamp((ver.heerXp||0) + (s.sieger==="D" ? 16 : 8), 0, 100);
  /* Feldherren: Ruhm für den Sieger, Todesrisiko für den Verlierer */
  for(const [seite, p2] of [["A",ang],["D",ver]]){
    if(!p2.feldherr) continue;
    const fa = feldherrArt(p2);
    if(s.sieger === seite){
      p2.feldherr.ruhm = (p2.feldherr.ruhm||0) + 1;
      if(p2.feldherr.ruhm === 3) geschichte("🎖️", `${fa.n} in ${p2.name}s Diensten wird als großer Feldherr gerühmt.`);
    } else if(Math.random() < 0.06){
      geschichte("🕯️", `${fa.n} fällt in der Schlacht, ${p2.name} verliert seinen Feldherrn.`);
      if(!p2.ki) toast(`🕯️ Euer Feldherr ${fa.n} ist in der Schlacht gefallen.`, 8000);
      p2.feldherr = null;
    }
  }
  /* Verluste anteilig in die stehenden Heere zurückschreiben (Leihtruppen kehren dezimiert heim) */
  verlusteZurueck(s);
  if(s.sieger === "A"){
    /* Eindringtiefe: geräumte Abschnitte, oder Überrennen nach der Flucht */
    const geraeumt = s.lanes.filter(l => laneGroesse(l.D) === 0).length;
    const verlustquote = 1 - sRest(s,"D")/s.startG.D;
    let tiefe = clamp(Math.max(geraeumt,
      s.routD ? Math.round(verlustquote*5) + 1 : Math.round(verlustquote*3)), 0, 5);
    if((ver.mauer||0) >= 2 && !kr.mauerBruch) tiefe = Math.max(0, tiefe - 1);   /* die Mauer deckt das Hinterland */
    let beute = Math.round(ver.land*(0.10 + tiefe*0.02));
    if(tiefe >= 4) beute = Math.min(beute, ver.land);   /* totaler Durchbruch: auch bebautes Land fällt */
    else beute = Math.min(beute, Math.max(0, freiLand(ver)));
    ver.land -= beute; ang.land += beute;
    /* Gebäude, deren Land verloren ging, verfallen */
    let verfallen = 0;
    while(minLand(ver) > ver.land && (ver.maerkte > 0 || ver.muehlen > 0)){
      if(ver.maerkte >= ver.muehlen && ver.maerkte > 0){ ver.maerkte--; entferneGebaeude(ver,"m"); }
      else if(ver.muehlen > 0){ ver.muehlen--; entferneGebaeude(ver,"k"); }
      verfallen++;
      if(verfallen > 60) break;
    }
    const gefallene = Math.round(ver.pop*0.03);
    ver.pop -= gefallene;
    ver.stimmung = clamp(ver.stimmung-10,5,100);
    ang.stimmung = clamp(ang.stimmung-5,5,100);
    /* Plünderung: je tiefer der Durchbruch, desto mehr Schäden im Hinterland */
    const schaeden = [];
    for(let i=0;i<tiefe;i++){
      if(Math.random() < 0.5 && (ver.maerkte>0 || ver.muehlen>0)){
        if(ver.maerkte>0 && (ver.muehlen===0 || Math.random()<0.5)){
          ver.maerkte--; entferneGebaeude(ver,"m"); schaeden.push("ein Markt");
        } else if(ver.muehlen>0){
          ver.muehlen--; entferneGebaeude(ver,"k"); schaeden.push("eine Mühle");
        }
      }
    }
    /* Festungswerke nehmen Schaden */
    if(tiefe >= 2 && (ver.mauer||0) > 0 && Math.random() < 0.55){
      ver.mauer--; schaeden.push("ein Ring der Stadtmauer");
    }
    if(tiefe >= 4 && (ver.burg||0) > 0 && Math.random() < 0.35){
      ver.burg--; schaeden.push("ein Turm der Burg");
    }
    if(tiefe >= 3){
      if(ver.palast>0 && Math.random()<0.5){
        const d = ri(1, Math.min(3, ver.palast)); ver.palast -= d;
        schaeden.push(`${d} Palast-Teil${d>1?"e":""}`);
      }
      if(ver.dom>0 && Math.random()<0.4){
        const d = ri(1, Math.min(2, ver.dom)); ver.dom -= d;
        schaeden.push(`${d} Dom-Teil${d>1?"e":""}`);
      }
    }
    /* Belagerung: bei tiefem Durchbruch fällt eine ganze Stadt in Eure Hand */
    if(tiefe >= 4 && staedte(ver) >= 1 && Math.random() < 0.65){
      ver.maerkte -= 5; ver.muehlen -= 3;
      for(let k=0;k<5;k++) entferneGebaeude(ver,"m");
      for(let k=0;k<3;k++) entferneGebaeude(ver,"k");
      ang.maerkte += 5; ang.muehlen += 3;
      for(let k=0;k<5;k++) platziereGebaeude(ang,"m");
      for(let k=0;k<3;k++) platziereGebaeude(ang,"k");
      schaeden.push("eine ganze Stadt (erobert!)");
      geschichte("🏰", `${ang.name} erobert eine Stadt von ${ver.name}.`);
      erfolg("eroberer");
    }
    const kornBeute = tiefe>0 ? Math.min(ver.korn, Math.round(ver.korn * 0.04 * tiefe)) : 0;
    ver.korn -= kornBeute; ang.korn += kornBeute;
    s.tiefe = tiefe;
    ang.stat.siege++; ver.stat.niederlagen++;
    bezAendern(ang, ver, -35);
    if(tiefe >= 5) erfolg("brandschatzer");
    s.plünder = schaeden.length || kornBeute
      ? `Eindringtiefe ${tiefe}/5, geplündert: ${[...schaeden, kornBeute?fmt(kornBeute)+" Fuder Korn":null].filter(Boolean).join(", ")}.`
      : (tiefe>0 ? `Eindringtiefe ${tiefe}/5, die Plünderer fanden wenig.` : "");
    s.ergebnis = `Sieg! Eure Truppen erobern ${fmt(beute)} ha von ${ver.name}. ${fmt(gefallene)} Feinde fallen.`;
    geschichte("⚔️", `${ang.name} besiegt ${ver.name} und erobert ${fmt(beute)} ha.`);
    if(reichBesiegt(ver, ang)){
      s.ergebnis += ` 🏳️ ${ver.name}s Reich ist vernichtet und wird dem Sieger einverleibt!`;
      if(!ang.ki) erfolg("bezwinger");
      pruefeAlleinherrschaft();
    }
    if(!s.still){
      setTimeout(sSchlachtSieg, 300);
      if(kr.a === G.aktiv && !ang.ki){ erfolg("krieg"); if(s.helferA.length) erfolg("buendnis"); }
    }
  } else {
    const tribut = Math.round(Math.max(0,ang.geld)*0.2);
    ang.geld -= tribut; ver.geld += tribut;
    ang.stimmung = clamp(ang.stimmung-15,5,100);
    ang.stat.niederlagen++; ver.stat.siege++;
    bezAendern(ang, ver, -25);
    s.ergebnis = `Niederlage! Euer Heer wird geschlagen. Ihr zahlt ${fmt(tribut)} Taler Tribut an ${ver.name}.`;
    geschichte("🛡️", `${ver.name} schlägt ${ang.name}s Angriff zurück.`);
    if(!s.still) setTimeout(sNieder, 300);
  }
  quicksave();
  mpSync();
}

/* Ein Reich ohne Land scheidet aus, sein Rest fällt an den Sieger */
function reichBesiegt(ver, ang){
  if(ver.tot || ver.land > 1500) return false;
  const vi = G.spieler.indexOf(ver);
  ver.tot = true; ver.besiegt = true;
  const restLand = Math.max(0, ver.land);
  const restGeld = Math.round(Math.max(0, ver.geld) * 0.5);
  ver.land = 0; ver.geld -= restGeld;
  ver.heer = { inf:0, kav:0, art:0 };
  ang.land += restLand; ang.geld += restGeld;
  G.routen = (G.routen||[]).filter(r => r.a !== vi && r.b !== vi);
  G._angriffe = (G._angriffe||[]).filter(x => x.kr.a !== vi && x.kr.d !== vi);
  geschichte("🏳️", `${titelName(ver)} ${ver.name} verliert das letzte Land, das Reich ist ausgelöscht. ${ang.name} nimmt Rest und Kasse (${fmt(restGeld)} T).`);
  if(!ver.ki) toast(`🏳️ Euer Reich ist gefallen. ${ang.name} hat Euer letztes Land erobert.`, 9000);
  return true;
}
/* Bleibt nur ein Reich übrig, wird sein Regent zum Kaiser ausgerufen */
function pruefeAlleinherrschaft(){
  if(G.spieler.length < 2 || G.sieger) return;
  const leb = G.spieler.filter(p => !p.tot);
  if(leb.length !== 1) return;
  const w = leb[0];
  w.titel = 8;
  G.sieger = w;
  G._siegEroberung = true;
  geschichte("👑", `${w.name} hat alle Rivalen bezwungen und wird durch das Recht des Schwertes zum Kaiser ausgerufen!`);
  if(!w.ki) erfolg("kaiser");
  mpSync();
}
/* ---------- Geschichtsschreibung (Chronik der Partie) ---------- */
function geschichte(ico, text){
  G.geschichte = (G.geschichte || []).concat({ j:G.jahr, ico, t:text }).slice(-120);
}

/* ---------- Dynastie: die Erbfolge ---------- */
function erben(p){
  const alterName = `${titelName(p)} ${p.name}`;
  /* Heiratspolitik: vermählte Häuser erheben Erbansprüche */
  const pi = G.spieler.indexOf(p);
  G.spieler.forEach((x, xi) => {
    if(x === p || x.tot) return;
    if(x.ehen && x.ehen[pi] && x.ehen[pi] >= G.jahr){
      const anspruch = Math.min(Math.round(p.land*0.05), freiLand(p));
      if(anspruch > 0){
        p.land -= anspruch; x.land += anspruch;
        geschichte("⚰️", `Haus ${x.name} erbt durch die Ehe ${fmt(anspruch)} ha aus ${p.name}s Nachlass.`);
        if(!x.ki) toast(`💍 Durch die Vermählung erbt Euer Haus ${fmt(anspruch)} ha von ${p.name}.`, 6000);
      }
      delete x.ehen[pi];
      if(p.ehen) delete p.ehen[xi];
    }
  });
  p.gen = (p.gen||1) + 1;
  const erbe = p.erbe && (G.jahr - p.erbe.geb) >= 14 ? p.erbe : null;
  p.startAlter = erbe
    ? Math.max(16, G.jahr - erbe.geb) - (G.jahr - 1700)
    : ri(18,26) - (G.jahr - 1700);                 /* Alter = startAlter + Regierungsjahre */
  p.todesJahr = G.jahr + (G.tempo>=2.5 ? ri(17,23) : G.tempo>1 ? ri(28,38) : ri(42,55)) + Math.random();
  p.tot = false;
  /* Erbstreit: die Übergabe kostet */
  const verlustGeld = Math.round(Math.max(0,p.geld)*0.2);
  const verlustLand = Math.min(Math.round(p.land*0.08), freiLand(p));
  p.geld -= verlustGeld;
  p.land -= verlustLand;
  if(p.titel > 0) p.titel--;
  p.stimmung = clamp(p.stimmung-8, 5, 100);
  if(erbe){
    p.name = erbe.name;
    p.w = erbe.w;
    p.zug = erbe.zug || wuerfleZug();
  } else {
    p.zug = wuerfleZug();                            /* ein ferner Vetter tritt an */
    const roem = ["","II.","III.","IV.","V.","VI.","VII."][Math.min(p.gen-1,6)] || (p.gen+".");
    if(!/ (II\.|III\.|IV\.|V\.|VI\.|VII\.|\d+\.)$/.test(p.name)) p.name = p.name + " " + roem;
    else p.name = p.name.replace(/ (II\.|III\.|IV\.|V\.|VI\.|VII\.|\d+\.)$/, " " + roem);
  }
  p.erbe = null;
  const zg = zugVon(p);
  geschichte("👶", `${alterName} stirbt · ${erbe?"Thronfolge":"Erbfolge"}: ${p.name} (${zg?zg.n.toLowerCase():"?"}) tritt das Erbe an (Erbstreit: −${fmt(verlustGeld)} T, −${fmt(verlustLand)} ha).`);
  if(!p.ki && zg) toast(`${zg.ico} Der neue Regent ist <b>${zg.n.toLowerCase()}</b>: ${zg.d}`, 7000);
  quicksave(); mpSync();
}

/* ---------- Friedens-Diplomatie: Geschenke, Handel, Pakte ---------- */
const diploLimit = p => ((p.berater && p.berater.kanzler) ? 2 : 1) + (hatPrivileg(p,4) ? 1 : 0) + (p.zug==="gelehrt" ? 1 : 0);
function diploAktion(art){
  const p = cur();
  const ziel = G.spieler[+$("#dipZiel").value];
  p.diploZaehler = p.diploZaehler || 0;
  if(!ziel || ziel.tot || p.diploZaehler >= diploLimit(p)) return;
  if(art === "geschenk"){
    const betrag = clamp(Math.floor(+$("#dipGeschenk").value||0), 0, p.geld);
    if(betrag < 100){ alertMsg("Ein Geschenk unter 100 Talern beleidigt den Empfänger."); return; }
    p.geld -= betrag; ziel.geld += betrag;
    bezAendern(p, ziel, clamp(Math.round(betrag/150), 2, 25));
    p.diploZaehler++;
    if(G.lehre && G.aktiv === 0) G.lehre.flags.geschenk = true;
    toast(`🎁 ${ziel.name} nimmt Euer Geschenk wohlwollend an.`);
  } else if(art === "handel"){
    const richtung = $("#dipRichtung").value;             /* kauf | verkauf */
    const menge = Math.max(1, Math.floor(+$("#dipMenge").value||0));
    const preis = Math.max(1, Math.floor(+$("#dipPreis").value||0));
    const angebot = { von:G.spieler.indexOf(p), an:G.spieler.indexOf(ziel), richtung, menge, preis, jahr:G.jahr };
    if(richtung === "kauf" && menge*preis > p.geld){ alertMsg("So viel Geld habt Ihr nicht."); return; }
    if(richtung === "verkauf" && menge > p.korn){ alertMsg("So viel Korn habt Ihr nicht."); return; }
    if(ziel.ki){
      if(kiAngebotPruefen(ziel, angebot)){ angebotAusfuehren(angebot); toast(`🤝 ${ziel.name} schlägt ein!`); erfolg("handel"); }
      else toast(`❌ ${ziel.name} lehnt das Angebot ab.`);
    } else {
      G.angebote.push(angebot);
      toast(`📜 Angebot an ${ziel.name} übermittelt. Antwort zu Beginn ${ziel.w?"ihres":"seines"} Zuges.`);
      mpSync();
    }
    p.diploZaehler++;
  } else if(art === "buendnis"){
    if(buendnisAktiv(p, ziel)){ alertMsg("Zwischen Euren Häusern besteht bereits ein Bündnis."); return; }
    if(p.geld < 1000){ alertMsg("Die Bündnisurkunde samt Gesandtschaft kostet 1.000 Taler."); return; }
    if(bezWert(p, ziel) < 25){ alertMsg("Für ein Bündnis ist das Verhältnis zu kühl (mindestens +25), sendet erst Geschenke."); return; }
    if(ziel.ki){
      const bedroht = nachbarn(G.spieler.indexOf(ziel)).some(i=>{
        const z2 = G.spieler[i];
        return z2 !== p && !z2.tot && heerStaerke(z2.heer) > heerStaerke(ziel.heer)*1.3;
      });
      if(bezWert(ziel, p) >= 30 || (bedroht && bezWert(ziel, p) >= 15)){
        p.geld -= 1000;
        buendnisSchliessen(p, ziel);
        toast(`🛡️ ${ziel.name} besiegelt das Bündnis, Eure Heere stehen füreinander ein (8 Jahre).`);
        p.diploZaehler++;
      } else {
        toast(`❌ ${ziel.name} zögert. Ein Bündnis braucht mehr Vertrauen (Verhältnis derzeit ${bezWert(ziel,p)}).`);
      }
    } else {
      G.angebote.push({ von:G.spieler.indexOf(p), an:G.spieler.indexOf(ziel), richtung:"buendnis", menge:0, preis:0, jahr:G.jahr });
      toast(`📜 Bündnis-Angebot an ${ziel.name} übermittelt.`);
      p.diploZaehler++;
      mpSync();
    }
  } else if(art === "route"){
    const pi = G.spieler.indexOf(p), zi = G.spieler.indexOf(ziel);
    if(routeAktiv(pi, zi)){ alertMsg("Zwischen Euren Reichen verkehren bereits Karawanen."); return; }
    if(routenVon(pi).length >= 3){ alertMsg("Mehr als drei Routen kann Euer Reich nicht unterhalten."); return; }
    if(p.geld < 1500){ alertMsg("Der Aufbau einer Route kostet 1.500 Taler."); return; }
    if(bezWert(p, ziel) < 0){ alertMsg("Dafür ist das Verhältnis zu frostig, sendet erst Geschenke."); return; }
    if(ziel.ki){
      if(routenVon(zi).length < 3 && (ziel.kiTyp === "haendler" || bezWert(ziel, p) >= 10)){
        p.geld -= 1500;
        routeEroeffnen(pi, zi);
        toast(`🚚 ${ziel.name} lässt die Karawanen rollen, beide Reiche kassieren fortan Zoll.`);
      } else toast(`❌ ${ziel.name} winkt ab, kein Interesse an Eurer Route.`);
    } else {
      G.angebote.push({ von:pi, an:zi, richtung:"route", menge:0, preis:0, jahr:G.jahr });
      toast(`📜 Routen-Angebot an ${ziel.name} übermittelt.`);
      mpSync();
    }
    p.diploZaehler++;
  } else if(art === "ehe"){
    if(eheAktiv(p, ziel)){ alertMsg("Zwischen Euren Häusern besteht bereits eine Ehe."); return; }
    const mitgift = Math.floor(+$("#dipMitgift").value||0);
    if(mitgift < 2000){ alertMsg("Unter 2.000 Talern Mitgift gilt ein Antrag als Beleidigung."); return; }
    if(mitgift > p.geld){ alertMsg("So viel Mitgift gibt Eure Kasse nicht her."); return; }
    if(ziel.ki){
      const schwelle = eheSchwelle(ziel);
      const wert = bezWert(ziel, p) + mitgift/200;
      if(wert >= schwelle){
        eheSchliessen(p, ziel, mitgift);
        toast(`💍 ${ziel.name} nimmt den Heiratsantrag an, die Häuser sind vereint (12 Jahre Frieden).`);
        p.diploZaehler++;
      } else {
        const fehltP = Math.ceil(schwelle - wert);
        toast(`❌ ${ziel.name} weist den Antrag zurück. Es fehlen etwa <b>${fehltP} Punkte</b>:
          verbessert das Verhältnis (Geschenke) oder bietet rund <b>${fmt(fehltP*200)} Taler mehr Mitgift</b>.
          <span class="small muted">Der Antrag hat keine Diplomatie-Aktion verbraucht.</span>`, 9000);
      }
    } else {
      G.angebote.push({ von:G.spieler.indexOf(p), an:G.spieler.indexOf(ziel), richtung:"ehe", menge:mitgift, preis:0, jahr:G.jahr });
      toast(`📜 Heiratsantrag an ${ziel.name} übermittelt.`);
      mpSync();
      p.diploZaehler++;
    }
  } else if(art === "pakt"){
    if(paktAktiv(p, ziel)){ alertMsg("Es besteht bereits ein Pakt."); return; }
    const angebot = { von:G.spieler.indexOf(p), an:G.spieler.indexOf(ziel), richtung:"pakt", menge:0, preis:0, jahr:G.jahr };
    if(ziel.ki){
      if(bezWert(ziel,p) >= -10 || ziel.kiTyp !== "aggressor"){
        angebotAusfuehren(angebot);
        toast(`🕊️ ${ziel.name} besiegelt den Nichtangriffspakt (5 Jahre).`); erfolg("pakt");
      } else toast(`❌ ${ziel.name} lehnt den Pakt ab.`);
    } else {
      G.angebote.push(angebot);
      toast(`📜 Paktangebot an ${ziel.name} übermittelt.`);
      mpSync();
    }
    p.diploZaehler++;
  }
  render();
}

function angebotAusfuehren(a){
  const von = G.spieler[a.von], an = G.spieler[a.an];
  if(a.richtung === "ehe"){
    if(von.geld < a.menge) return;
    eheSchliessen(von, an, a.menge);
    return;
  }
  if(a.richtung === "route"){
    if(von.geld < 1500 || routenVon(a.von).length >= 3 || routenVon(a.an).length >= 3) return;
    von.geld -= 1500;
    routeEroeffnen(a.von, a.an);
    return;
  }
  if(a.richtung === "buendnis"){
    if(von.geld < 1000) return;
    von.geld -= 1000;
    buendnisSchliessen(von, an);
    return;
  }
  if(a.richtung === "pakt"){
    von.pakte[a.an] = G.jahr + 5;
    an.pakte[a.von] = G.jahr + 5;
    bezAendern(von, an, 15);
    geschichte("🕊️", `${von.name} und ${an.name} besiegeln einen Nichtangriffspakt.`);
    return;
  }
  const kaeufer = a.richtung === "kauf" ? von : an;
  const verkaeufer = a.richtung === "kauf" ? an : von;
  const summe = a.menge * a.preis;
  if(kaeufer.geld < summe || verkaeufer.korn < a.menge) return;
  kaeufer.geld -= summe; verkaeufer.geld += summe;
  verkaeufer.korn -= a.menge; kaeufer.korn += a.menge;
  verkaeufer.stat.kornErloes += summe;
  bezAendern(von, an, 6);
}

    if(ki.korn - a.menge < noetigKorn(ki)*1.5) return false;
